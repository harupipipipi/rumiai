name: Bug report
description: Report a reproducible Rumi AI issue.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Rumi AI. Please remove secrets, tokens, private prompts, and personal data before posting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact commands or UI steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Runtime versions
      placeholder: Python 3.11, Node 22, Rust stable, Flutter ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the smallest useful excerpt. Remove secrets.
      render: text
