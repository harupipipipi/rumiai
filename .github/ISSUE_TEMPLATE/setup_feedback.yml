name: Setup feedback
description: Share first-run setup results, whether they succeeded or failed.
title: "[Setup]: "
labels: ["setup-feedback", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for trying Rumi AI. Please remove secrets, tokens, private prompts, local paths with personal data, and unrelated logs before posting.
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      description: What happened when you tried the first-run check?
      options:
        - Health check passed
        - Health check failed
        - Install or dependency setup blocked me
        - Documentation was unclear
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and shell
      placeholder: Windows 11 PowerShell, macOS 15 zsh, Ubuntu 24.04 bash, etc.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime versions
      placeholder: Python 3.11.9, Node 22, Rust stable, Flutter ...
  - type: textarea
    id: commands
    attributes:
      label: Commands tried
      description: Include the exact setup or health-check commands you ran.
      placeholder: |
        git clone https://github.com/harupipipipi/rumiai.git
        cd rumiai
        python -m rumi_ai --health
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Result or smallest useful log excerpt
      description: For successful checks, paste the health-check summary. For failures, paste only the smallest useful excerpt with secrets removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Docs feedback
      description: What was missing, surprising, or confusing?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, private prompts, and unrelated personal data.
          required: true
