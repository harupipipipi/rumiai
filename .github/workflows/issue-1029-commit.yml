name: Commit issue 1029 generated fix

on:
  push:
    branches:
      - fix/1029-subagent-readonly-decision-preview

permissions:
  contents: write

jobs:
  commit-generated-fix:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1029-subagent-readonly-decision-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json
      - name: Apply patch embedded in issue workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/issue-1029-autofix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          if start_marker not in source:
              raise SystemExit('embedded patch start marker missing')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, 'issue-1029-embedded-patch.py', 'exec'))
          PY
      - name: Install dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci
      - name: Validate and rebuild
        continue-on-error: true
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: |
          npx tsx --test src/subagentTeam/SubagentTeamWorkspaceApproval.test.ts
          npm run lint
          npm run build
      - name: Commit implementation and remove helpers
        if: always()
        run: |
          rm -f .github/workflows/issue-1029-autofix.yml .github/workflows/issue-1029-commit.yml .github/.ci-trigger-1029
          git config user.name "rumiai-ui-bot"
          git config user.email "rumiai-ui-bot@users.noreply.github.com"
          git add -A .github/workflows/issue-1029-autofix.yml .github/workflows/issue-1029-commit.yml .github/.ci-trigger-1029 rumi_ai_1_10/ecosystem/defaultspack/webapp/package.json rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/SubagentTeamWorkspace.tsx rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/SubagentTeamWorkspaceApproval.test.ts rumi_ai_1_10/ecosystem/defaultspack/ui
          git diff --cached --quiet && exit 0
          git commit -m "[auto-patched] Make Subagent Team decision previews read-only"
          git push origin HEAD:fix/1029-subagent-readonly-decision-preview
