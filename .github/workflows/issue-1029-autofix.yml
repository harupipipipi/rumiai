name: Apply issue 1029 fix

on:
  pull_request:
    branches:
      - fix/1043-truthful-ui-precision-demo
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'fix/1029-subagent-readonly-decision-preview' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1029-subagent-readonly-decision-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json
      - name: Replace cosmetic decisions with read-only authoritative previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp')
          page = root / 'src/subagentTeam/SubagentTeamWorkspace.tsx'
          text = page.read_text(encoding='utf-8')

          creator_pattern = re.compile(
              r'function CreatorDecisionPreview\(\{[\s\S]*?\n\}\n\nfunction MessageRow',
              re.MULTILINE,
          )
          creator_replacement = '''function CreatorDecisionPreview({
            task,
            status,
          }: {
            task: CompanyTask | null;
            status: DecisionStatus;
          }) {
            const title = task?.title || "PM routing plan preview";
            const targetAgents = task?.target_agent_ids?.length ? task.target_agent_ids.join(", ") : "pm, frontend, qa";
            return (
              <div className="mx-2 mb-2 rounded-lg border border-zinc-800/80 bg-[#0d0d11] p-2.5">
                <div className="mb-2 flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wide text-zinc-500">
                      <ClipboardCheck size={12} className="text-emerald-300" />
                      <span>Creator decision preview</span>
                    </div>
                    <p className="mt-1 line-clamp-2 text-[12px] font-medium leading-snug text-zinc-100">{title}</p>
                  </div>
                  <span className={cn("shrink-0 rounded border px-1.5 py-0.5 text-[9px]", statusClassName(status))}>
                    {status}
                  </span>
                </div>
                <div className="grid gap-1.5 text-[10px] text-zinc-500">
                  <div className="rounded border border-zinc-800 bg-zinc-950/50 px-2 py-1.5">
                    <span className="text-zinc-400">Route:</span> {targetAgents}
                  </div>
                  <div className="rounded border border-zinc-800 bg-zinc-950/50 px-2 py-1.5">
                    <span className="text-zinc-400">Creator sees:</span> PM summary, changed files, and latest channel blockers.
                  </div>
                </div>
                <div
                  role="note"
                  data-testid="subagent-creator-decision-readonly"
                  className="mt-2 flex items-start gap-1.5 rounded-md border border-sky-500/20 bg-sky-500/10 px-2 py-1.5 text-[10px] leading-4 text-sky-100"
                >
                  <ShieldCheck size={12} className="mt-0.5 shrink-0" />
                  <span>Read-only preview. No approval or revision is recorded from this card.</span>
                </div>
              </div>
            );
          }

          function MessageRow'''
          text, creator_count = creator_pattern.subn(creator_replacement, text, count=1)
          if creator_count != 1:
              raise SystemExit(f'CreatorDecisionPreview replacement count={creator_count}')

          approval_pattern = re.compile(
              r'function ApprovalCard\(\{[\s\S]*?\n\}\n\nexport function SubagentTeamWorkspace',
              re.MULTILINE,
          )
          approval_replacement = '''function ApprovalCard({
            task,
            status,
            source,
            error,
          }: {
            task: CompanyTask | null;
            status: DecisionStatus;
            source: "api" | "preview";
            error: string | null;
          }) {
            const previewMessage = source === "preview"
              ? "Fallback preview data is read-only and cannot be approved."
              : "Decision preview only. Open the authoritative pending request to approve, reject, or request revision.";
            return (
              <div className="rounded-lg border border-amber-500/20 bg-amber-500/10 p-3">
                <div className="mb-2 flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wide text-amber-200">
                      <ClipboardCheck size={12} />
                      <span>Decision preview</span>
                    </div>
                    <p className="mt-1 line-clamp-2 text-[12px] font-medium text-zinc-100">{task?.title || "PM goal gate preview"}</p>
                  </div>
                  <span className={cn("shrink-0 rounded border px-1.5 py-0.5 text-[9px]", statusClassName(status))}>{status}</span>
                </div>
                <p className="line-clamp-3 text-[11px] leading-relaxed text-zinc-300">
                  {task?.description || "PM and Creator review channel context before subagents proceed with larger fanout or /goal execution."}
                </p>
                {error && <p className="mt-2 line-clamp-2 text-[10px] text-amber-100/70">{error}</p>}
                <div
                  role="note"
                  data-testid="subagent-approval-preview-readonly"
                  className="mt-2 rounded-md border border-amber-400/25 bg-black/20 px-2 py-1.5 text-[10px] leading-4 text-amber-50"
                >
                  {previewMessage}
                </div>
                <p className="mt-1 font-mono text-[9px] text-amber-100/50">source:{source}</p>
              </div>
            );
          }

          export function SubagentTeamWorkspace'''
          text, approval_count = approval_pattern.subn(approval_replacement, text, count=1)
          if approval_count != 1:
              raise SystemExit(f'ApprovalCard replacement count={approval_count}')

          state_line = '  const [decisionStatus, setDecisionStatus] = useState<DecisionStatus>("waiting");\n'
          if state_line not in text:
              raise SystemExit('local decision state line missing')
          text = text.replace(state_line, '', 1)

          decision_anchor = '  const effectiveDecisionTask = decisionPreviewTask ?? latestDecisionTask;\n'
          decision_helper = '''  const effectiveDecisionTask = decisionPreviewTask ?? latestDecisionTask;
          const decisionStatus: DecisionStatus = (() => {
            const value = String(effectiveDecisionTask?.status ?? "").trim().toLowerCase();
            if (["approved", "completed", "done"].includes(value)) return "approved";
            if (["revision", "changes_requested", "blocked"].includes(value)) return "revision";
            return "waiting";
          })();
'''
          if decision_anchor not in text:
              raise SystemExit('effective decision anchor missing')
          text = text.replace(decision_anchor, decision_helper, 1)

          call_pattern = re.compile(
              r'<ApprovalCard\s+task=\{effectiveDecisionTask\}\s+status=\{decisionStatus\}\s+source=\{decisionPreviewSource\}\s+error=\{decisionPreviewError\}\s+onStatusChange=\{setDecisionStatus\}\s*/>\s*<CreatorDecisionPreview\s+task=\{effectiveDecisionTask\}\s+status=\{decisionStatus\}\s+onStatusChange=\{setDecisionStatus\}\s*/>',
              re.MULTILINE,
          )
          call_replacement = '''<ApprovalCard
                        task={effectiveDecisionTask}
                        status={decisionStatus}
                        source={decisionPreviewSource}
                        error={decisionPreviewError}
                      />
                      <CreatorDecisionPreview task={effectiveDecisionTask} status={decisionStatus} />'''
          text, call_count = call_pattern.subn(call_replacement, text, count=1)
          if call_count != 1:
              raise SystemExit(f'decision call-site replacement count={call_count}')

          if '<Check ' not in text:
              text = text.replace('  Check,\n', '', 1)
          if 'setDecisionStatus' in text or 'onStatusChange("approved")' in text:
              raise SystemExit('cosmetic decision mutation remains')

          page.write_text(text, encoding='utf-8')

          test_path = root / 'src/subagentTeam/SubagentTeamWorkspaceApproval.test.ts'
          test_path.write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const source = readFileSync(resolve(import.meta.dirname, "SubagentTeamWorkspace.tsx"), "utf8");

          test("Subagent Team decision previews cannot mutate local approval state", () => {
            assert.doesNotMatch(source, /setDecisionStatus/);
            assert.doesNotMatch(source, /onStatusChange=\\{setDecisionStatus\\}/);
            assert.doesNotMatch(source, /onStatusChange\\(\"approved\"\\)/);
            assert.doesNotMatch(source, />Approve<|>Revise<|>OK</);
          });

          test("Subagent Team labels API and fallback decision data as read-only previews", () => {
            assert.match(source, /Read-only preview\. No approval or revision is recorded from this card\./);
            assert.match(source, /Fallback preview data is read-only and cannot be approved\./);
            assert.match(source, /Open the authoritative pending request to approve, reject, or request revision\./);
            assert.match(source, /subagent-approval-preview-readonly/);
          });
          ''', encoding='utf-8')

          package_path = root / 'package.json'
          package_text = package_path.read_text(encoding='utf-8')
          old_tail = 'src/subagentTeam/subagentTeamData.test.ts"'
          new_tail = 'src/subagentTeam/subagentTeamData.test.ts src/subagentTeam/SubagentTeamWorkspaceApproval.test.ts"'
          if old_tail not in package_text and new_tail not in package_text:
              raise SystemExit('package test tail missing')
          package_text = package_text.replace(old_tail, new_tail, 1)
          package_path.write_text(package_text, encoding='utf-8')
          PY
      - name: Install dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci
      - name: Validate and rebuild
        continue-on-error: true
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: |
          npx tsx --test src/subagentTeam/SubagentTeamWorkspaceApproval.test.ts
          npm run lint
          npm run build
      - name: Commit implementation and remove helper
        if: always()
        run: |
          rm -f .github/workflows/issue-1029-autofix.yml
          git config user.name "rumiai-ui-bot"
          git config user.email "rumiai-ui-bot@users.noreply.github.com"
          git add -A .github/workflows/issue-1029-autofix.yml \
            rumi_ai_1_10/ecosystem/defaultspack/webapp/package.json \
            rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/SubagentTeamWorkspace.tsx \
            rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/SubagentTeamWorkspaceApproval.test.ts \
            rumi_ai_1_10/ecosystem/defaultspack/ui
          git diff --cached --quiet && exit 0
          git commit -m "[auto-patched] Make Subagent Team decision previews read-only"
          git push origin HEAD:fix/1029-subagent-readonly-decision-preview
