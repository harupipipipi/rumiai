name: Apply issue 1029 fix

on:
  pull_request:
    branches: [soon]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1029-read-only-subagent-decisions
      - name: Remove cosmetic approval controls
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/SubagentTeamWorkspace.tsx')
          source = source_path.read_text(encoding='utf-8')

          source = source.replace('  Check,\n', '')
          source = source.replace('type DecisionStatus = "waiting" | "approved" | "revision";\n', '')

          creator_start = source.index('function CreatorDecisionPreview({')
          creator_end = source.index('function MessageRow({', creator_start)
          source = source[:creator_start] + source[creator_end:]

          approval_start = source.index('function ApprovalCard({')
          approval_end = source.index('export function SubagentTeamWorkspace({', approval_start)
          decision_card = '''export function DecisionPreviewCard({\n  task,\n  source,\n  error,\n}: {\n  task: CompanyTask | null;\n  source: "api" | "preview";\n  error: string | null;\n}) {\n  const targetAgents = task?.target_agent_ids?.length ? task.target_agent_ids.join(", ") : "not specified";\n  const sourceLabel = source === "api" ? "API preview · read only" : "Sample preview · read only";\n  return (\n    <div\n      className="rounded-lg border border-amber-500/20 bg-amber-500/10 p-3"\n      data-testid="subagent-decision-preview"\n      aria-label="Read-only decision preview"\n    >\n      <div className="mb-2 flex items-start justify-between gap-2">\n        <div className="min-w-0">\n          <div className="flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wide text-amber-200">\n            <ClipboardCheck size={12} />\n            <span>Decision preview</span>\n          </div>\n          <p className="mt-1 line-clamp-2 text-[12px] font-medium text-zinc-100">\n            {task?.title || "PM routing decision context"}\n          </p>\n        </div>\n        <span className="shrink-0 rounded border border-zinc-700 bg-zinc-950/50 px-1.5 py-0.5 text-[9px] text-zinc-400">\n          {sourceLabel}\n        </span>\n      </div>\n      <p className="text-[11px] leading-relaxed text-zinc-300">\n        {task?.description || "PM and Creator context is shown here for inspection."}\n      </p>\n      <div className="mt-2 rounded border border-zinc-800 bg-zinc-950/50 px-2 py-1.5 text-[10px] text-zinc-400">\n        Route: {targetAgents}\n      </div>\n      <p className="mt-2 rounded border border-amber-400/20 bg-black/20 px-2 py-1.5 text-[10px] leading-4 text-amber-100">\n        This is read-only preview data. It cannot approve, revise, reject, or dispatch work. Use the authoritative approval queue when a real request is pending.\n      </p>\n      {error && <p className="mt-2 break-words text-[10px] text-amber-100/70">{error}</p>}\n    </div>\n  );\n}\n\n'''
          source = source[:approval_start] + decision_card + source[approval_end:]
          source = source.replace('  const [decisionStatus, setDecisionStatus] = useState<DecisionStatus>("waiting");\n', '')

          render_start = source.index('            <ApprovalCard\n')
          old_creator = '            <CreatorDecisionPreview task={effectiveDecisionTask} status={decisionStatus} onStatusChange={setDecisionStatus} />'
          render_end = source.index(old_creator, render_start) + len(old_creator)
          replacement = '''            <DecisionPreviewCard\n              task={effectiveDecisionTask}\n              source={decisionPreviewSource}\n              error={decisionPreviewError}\n            />'''
          source = source[:render_start] + replacement + source[render_end:]

          forbidden = ['setDecisionStatus', 'onStatusChange("approved")', '>Approve<', '>Revise<']
          for fragment in forbidden:
              if fragment in source:
                  raise SystemExit(f'local decision control remains: {fragment}')
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/subagentTeamData.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'import { ChannelButton } from "./SubagentTeamWorkspace";',
              'import { ChannelButton, DecisionPreviewCard } from "./SubagentTeamWorkspace";',
          )
          marker = 'decision preview is read-only and exposes no cosmetic approval controls'
          if marker not in tests:
              tests += '''\n\ntest("decision preview is read-only and exposes no cosmetic approval controls", () => {\n  const sampleHtml = renderToStaticMarkup(createElement(DecisionPreviewCard, {\n    task: null,\n    source: "preview",\n    error: null,\n  }));\n  const apiHtml = renderToStaticMarkup(createElement(DecisionPreviewCard, {\n    task: null,\n    source: "api",\n    error: null,\n  }));\n\n  assert.match(sampleHtml, /Sample preview · read only/);\n  assert.match(apiHtml, /API preview · read only/);\n  assert.match(sampleHtml, /cannot approve, revise, reject, or dispatch work/);\n  assert.doesNotMatch(sampleHtml, /<button/);\n  assert.doesNotMatch(apiHtml, /<button/);\n});\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json
      - name: Install dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci
      - name: Run focused tests
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npx tsx --test src/subagentTeam/subagentTeamData.test.ts
      - name: Typecheck and build
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: |
          npm run lint
          npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/issue-1029-autofix.yml
          git config user.name "rumiai-ui-bot"
          git config user.email "rumiai-ui-bot@users.noreply.github.com"
          git add -A .github/workflows/issue-1029-autofix.yml \
            rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/SubagentTeamWorkspace.tsx \
            rumi_ai_1_10/ecosystem/defaultspack/webapp/src/subagentTeam/subagentTeamData.test.ts \
            rumi_ai_1_10/ecosystem/defaultspack/ui
          git commit -m "Remove cosmetic Subagent Team approvals"
          git push origin HEAD:fix-1029-read-only-subagent-decisions
