name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  root-python-tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run root pytest
        id: root_pytest
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/root-pytest-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-py${{ matrix.python-version }}.log"
          pytest tests/ -v 2>&1 | tee "$PYTEST_LOG"

      - name: Upload root pytest log
        if: failure() && steps.root_pytest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: root-pytest-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/root-pytest-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python-version }}.log
          if-no-files-found: ignore

  rumi-ai-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: rumi_ai_1_10
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run contract cluster pytest
        id: contract_pytest
        working-directory: rumi_ai_1_10
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/contract-pytest-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          pytest \
            tests/test_app1_permissive_guard.py \
            tests/test_bug_20260306_batch_b.py \
            tests/test_capability_executor.py \
            tests/test_capability_executor_security.py \
            tests/test_capability_proxy.py \
            tests/test_desktop_app_schema.py \
            tests/test_di_container.py \
            tests/test_di_phase2.py \
            tests/test_di_phase3.py \
            tests/test_di_phase4.py \
            -v 2>&1 | tee "$PYTEST_LOG"

      - name: Upload contract pytest log
        if: failure() && steps.contract_pytest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: contract-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract-pytest-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}.log
          if-no-files-found: ignore

  rumi-ai-package-pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: rumi_ai_1_10
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run package pytest
        id: package_pytest
        working-directory: rumi_ai_1_10
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/package-pytest-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-py${{ matrix.python-version }}.log"
          pytest tests/ -v 2>&1 | tee "$PYTEST_LOG"

      - name: Upload package pytest log
        if: failure() && steps.package_pytest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: package-pytest-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-pytest-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python-version }}.log
          if-no-files-found: ignore

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: |
          cd pack-shell && cargo test
