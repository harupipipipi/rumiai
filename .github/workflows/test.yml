name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r rumi_ai_1_10/requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          pytest tests/ -v
          cd rumi_ai_1_10 && pytest tests/ -v

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: |
          cd pack-shell && cargo test
