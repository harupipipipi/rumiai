name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  root-python-tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run root pytest
        run: |
          pytest tests/ -v

  rumi-ai-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: rumi_ai_1_10
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run contract cluster pytest
        working-directory: rumi_ai_1_10
        run: |
          pytest \
            tests/test_app1_permissive_guard.py \
            tests/test_bug_20260306_batch_b.py \
            tests/test_capability_executor.py \
            tests/test_capability_executor_security.py \
            tests/test_capability_proxy.py \
            tests/test_desktop_app_schema.py \
            tests/test_di_container.py \
            tests/test_di_phase2.py \
            tests/test_di_phase3.py \
            tests/test_di_phase4.py \
            -v

  rumi-ai-package-pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: rumi_ai_1_10
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run package pytest
        working-directory: rumi_ai_1_10
        run: |
          pytest tests/ -v

  rumi-ai-ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: rumi_ai_1_10
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff
        working-directory: rumi_ai_1_10
        run: |
          ruff check .

  rumi-ai-mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: rumi_ai_1_10
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run mypy
        working-directory: rumi_ai_1_10
        run: |
          mypy --check-untyped-defs core_runtime app.py

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: |
          cd pack-shell && cargo test
