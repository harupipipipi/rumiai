name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  root-python-tests:
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run root pytest
        run: |
          pytest tests/ -v

  rumi-ai-python-checks:
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: rumi_ai_1_10
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run package pytest
        working-directory: rumi_ai_1_10
        run: |
          pytest tests/ -v

      - name: Run Ruff
        working-directory: rumi_ai_1_10
        run: |
          ruff check .

      - name: Run mypy
        working-directory: rumi_ai_1_10
        run: |
          mypy --check-untyped-defs core_runtime app.py

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: |
          cd pack-shell && cargo test
