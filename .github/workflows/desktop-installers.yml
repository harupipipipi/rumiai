name: Desktop Installers

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/scripts/prepare_tauri_resources.py"
      - ".github/workflows/desktop-installers.yml"
      - "pack-shell/**"
      - "rumi_ai_1_10/**"
      - "rumi_viewer/**"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - ".github/scripts/prepare_tauri_resources.py"
      - ".github/workflows/desktop-installers.yml"
      - "pack-shell/**"
      - "rumi_ai_1_10/**"
      - "rumi_viewer/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  build-installer:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            signing_args: "--no-sign"
            artifact_suffix: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            signing_args: "--no-sign"
            artifact_suffix: macos-x64
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            signing_args: ""
            artifact_suffix: windows-x64
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            signing_args: ""
            artifact_suffix: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-installers-${{ matrix.target }}
          workspaces: |
            pack-shell -> target
            rumi_viewer/src-tauri -> target

      - name: Install Tauri CLI
        shell: bash
        run: |
          if command -v cargo-tauri >/dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if cargo install tauri-cli --version "^2" --locked; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 20))
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rumi_viewer/frontend/package-lock.json
            rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install viewer frontend dependencies
        working-directory: rumi_viewer/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run viewer frontend checks
        working-directory: rumi_viewer/frontend
        run: |
          npm test
          npm run lint

      - name: Build defaultspack frontend
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Run rumi viewer Rust tests
        working-directory: rumi_viewer/src-tauri
        run: cargo test --locked

      - name: Build desktop installer
        if: runner.os == 'macOS'
        working-directory: rumi_viewer
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci ${{ matrix.signing_args }}

      - name: Build desktop installer
        if: runner.os == 'Windows'
        working-directory: rumi_viewer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($attempt in 1..3) {
            cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci ${{ matrix.signing_args }}
            $status = $LASTEXITCODE
            if ($status -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              exit $status
            }
            Start-Sleep -Seconds ($attempt * 20)
          }

      - name: Build desktop installer
        if: runner.os == 'Linux'
        working-directory: rumi_viewer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci ${{ matrix.signing_args }}; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 20))
          done

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: rumi-ai-${{ matrix.artifact_suffix }}-installer-${{ github.sha }}
          path: |
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
