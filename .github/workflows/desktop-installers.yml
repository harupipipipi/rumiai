name: Desktop Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - ".github/scripts/prepare_tauri_resources.py"
      - ".github/workflows/desktop-installers.yml"
      - "pack-shell/**"
      - "rumi_ai_1_10/**"
      - "rumi_viewer/**"

permissions:
  contents: read

env:
  UV_VERSION: "0.11.14"

jobs:
  build-installer:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            signing_args: "--no-sign"
            artifact_suffix: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            signing_args: "--no-sign"
            artifact_suffix: macos-x64
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            signing_args: ""
            artifact_suffix: windows-x64
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            signing_args: ""
            artifact_suffix: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rumi_viewer/frontend/package-lock.json
            rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install viewer frontend dependencies
        working-directory: rumi_viewer/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run viewer frontend checks
        working-directory: rumi_viewer/frontend
        run: |
          npm test
          npm run lint

      - name: Build panel frontend
        working-directory: rumi_viewer/frontend
        run: npm run build

      - name: Build defaultspack frontend
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Build pack-shell runtime
        working-directory: pack-shell
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare bundled Rumi runtime
        run: python .github/scripts/prepare_tauri_resources.py --target ${{ matrix.target }} --uv-version ${{ env.UV_VERSION }} --require-runtime-tools

      - name: Run rumi viewer Rust tests
        working-directory: rumi_viewer/src-tauri
        run: cargo test --locked

      - name: Disable updater artifacts for unsigned installer CI
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("rumi_viewer/src-tauri/tauri.conf.json")
          data = json.loads(path.read_text())
          data.setdefault("bundle", {})["createUpdaterArtifacts"] = False
          path.write_text(json.dumps(data, indent=2) + "\n")

      - name: Build desktop installer
        working-directory: rumi_viewer
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci ${{ matrix.signing_args }}

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: rumi-ai-${{ matrix.artifact_suffix }}-installer-${{ github.sha }}
          path: |
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
