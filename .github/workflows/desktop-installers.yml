name: Desktop Installers

on:
  workflow_dispatch:
  push:
    branches: [master, soon]
    paths:
      - ".github/scripts/install_locked_python_test_dependencies.py"
      - ".github/scripts/packaging_toolchain_identity.py"
      - ".github/scripts/update_packaging_python_provenance.py"
      - ".github/toolchains/packaging-python-macos.v1.json"
      - "tobkiri_runtime/scripts/packaging_cleanup.py"
      - ".github/scripts/prepare_tauri_resources.py"
      - ".github/scripts/build_sealed_python_environment.py"
      - ".github/scripts/sealed_python_sources/**"
      - ".github/schemas/sealed-python-*.json"
      - "tobkiri_launcher/docs/sealed-python-environment.md"
      - ".github/scripts/tests/test_packaging_cleanup.py"
      - ".github/scripts/tests/test_packaging_toolchain_identity.py"
      - ".github/scripts/tests/test_packaged_defaultspack_generator_relocation.py"
      - ".github/workflows/desktop-installers.yml"
      - "pack-shell/**"
      - "tobkiri_runtime/**"
      - "tobkiri_launcher/**"
  pull_request:
    branches: [master, soon, codex/pack-architecture-program-soon]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - ".github/scripts/install_locked_python_test_dependencies.py"
      - ".github/scripts/packaging_toolchain_identity.py"
      - ".github/scripts/update_packaging_python_provenance.py"
      - ".github/toolchains/packaging-python-macos.v1.json"
      - "tobkiri_runtime/scripts/packaging_cleanup.py"
      - ".github/scripts/prepare_tauri_resources.py"
      - ".github/scripts/build_sealed_python_environment.py"
      - ".github/scripts/sealed_python_sources/**"
      - ".github/schemas/sealed-python-*.json"
      - "tobkiri_launcher/docs/sealed-python-environment.md"
      - ".github/scripts/tests/test_packaging_cleanup.py"
      - ".github/scripts/tests/test_packaging_toolchain_identity.py"
      - ".github/scripts/tests/test_packaged_defaultspack_generator_relocation.py"
      - ".github/workflows/desktop-installers.yml"
      - "pack-shell/**"
      - "tobkiri_runtime/**"
      - "tobkiri_launcher/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-installer:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            shell_bundles: app
            presentation_variant: shell.tauri.default.macos-arm64
            presentation_platform: macos
            presentation_architecture: arm64
            signing_args: ""
            artifact_suffix: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            shell_bundles: app
            presentation_variant: shell.tauri.default.macos-x86_64
            presentation_platform: macos
            presentation_architecture: x86_64
            signing_args: ""
            artifact_suffix: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allocate packaging transaction
        shell: bash
        run: |
          set -euo pipefail
          token="$(/usr/bin/uuidgen | /usr/bin/tr -d '-' | /usr/bin/tr '[:upper:]' '[:lower:]')"
          test "${#token}" -eq 32
          echo "TOBKIRI_PACKAGING_TRANSACTION_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Bind verified packaging tool identities
        shell: bash
        env:
          TOOLCHAIN_ENV: ${{ runner.temp }}/tobkiri-packaging-toolchain.env
        run: |
          set -euo pipefail
          /usr/bin/python3 -B .github/scripts/packaging_toolchain_identity.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --provenance .github/toolchains/packaging-python-macos.v1.json \
            --source-commit "$GITHUB_SHA" \
            --transaction-token "$TOBKIRI_PACKAGING_TRANSACTION_TOKEN" \
            --prepare-macos-installation \
            --env-output "$TOOLCHAIN_ENV"
          for marker in \
            TOBKIRI_PACKAGING_PYTHON \
            TOBKIRI_PACKAGING_PYTHON_SHA256 \
            TOBKIRI_PACKAGING_GIT \
            TOBKIRI_PACKAGING_GIT_SHA256 \
            TOBKIRI_PACKAGING_PYTHON_SNAPSHOT \
            TOBKIRI_PACKAGING_PYTHON_INVENTORY_SHA256
          do
            /usr/bin/grep -q "^${marker}=" "$TOOLCHAIN_ENV"
          done
          /bin/cat "$TOOLCHAIN_ENV" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Check reviewed packaging Python provenance
        run: |
          /usr/bin/python3 -B .github/scripts/update_packaging_python_provenance.py \
            --version 3.13.13 \
            --requirements tobkiri_runtime/requirements.txt \
            --output .github/toolchains/packaging-python-macos.v1.json \
            --check

      - name: Smoke verified system Git authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B .github/scripts/packaging_toolchain_identity.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --provenance .github/toolchains/packaging-python-macos.v1.json \
            --source-commit "$GITHUB_SHA" \
            --git "$TOBKIRI_PACKAGING_GIT" \
            --git-sha256 "$TOBKIRI_PACKAGING_GIT_SHA256" \
            --smoke-git-authority

      - name: Verify closed packaging Python installation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B .github/scripts/packaging_toolchain_identity.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --transaction-token "$TOBKIRI_PACKAGING_TRANSACTION_TOKEN" \
            --verify-macos-installation "$TOBKIRI_PACKAGING_PYTHON_SNAPSHOT" \
            --inventory-sha256 "$TOBKIRI_PACKAGING_PYTHON_INVENTORY_SHA256"

      - name: Resolve checked-out source revision
        id: checked_out_source
        shell: python
        run: |
          import os
          import subprocess

          git = os.environ["TOBKIRI_PACKAGING_GIT"]
          git_environment = {
              "GIT_ATTR_NOSYSTEM": "1",
              "GIT_CEILING_DIRECTORIES": os.environ["GITHUB_WORKSPACE"],
              "GIT_CONFIG": os.devnull,
              "GIT_CONFIG_GLOBAL": os.devnull,
              "GIT_CONFIG_SYSTEM": os.devnull,
              "GIT_CONFIG_NOSYSTEM": "1",
              "GIT_EXEC_PATH": "/private/var/empty",
              "GIT_OPTIONAL_LOCKS": "0",
              "GIT_PAGER": "cat",
              "GIT_TERMINAL_PROMPT": "0",
              "HOME": "/private/var/empty",
              "LC_ALL": "C",
              "PATH": "/usr/bin:/bin",
              "PAGER": "cat",
              "XDG_CONFIG_HOME": "/private/var/empty",
          }
          git_arguments = [
              git,
              "--no-optional-locks",
              "--no-replace-objects",
              "-c", "core.fsmonitor=false",
              "-c", "core.untrackedCache=false",
              "-c", "core.hooksPath=/dev/null",
              "-c", "core.attributesFile=/dev/null",
              "-c", "diff.external=",
              "-c", "core.excludesFile=/dev/null",
              "-c", "core.sshCommand=false",
              "-c", "core.pager=cat",
              "-c", "pager.show=cat",
          ]
          source_revision = subprocess.check_output(
              [*git_arguments, "rev-parse", "--verify", "HEAD"],
              text=True,
              env=git_environment,
          ).strip()
          if len(source_revision) != 40 or any(
              character not in "0123456789abcdef" for character in source_revision
          ):
              raise SystemExit("checked-out source revision is not a full lowercase SHA")
          source_tree = subprocess.check_output(
              [*git_arguments, "rev-parse", "--verify", "HEAD^{tree}"],
              text=True,
              env=git_environment,
          ).strip()
          if len(source_tree) != 40 or any(
              character not in "0123456789abcdef" for character in source_tree
          ):
              raise SystemExit("checked-out source tree is not a full lowercase SHA")
          source_clean = subprocess.run(
              [
                  *git_arguments,
                  "diff-index",
                  "--cached",
                  "--quiet",
                  "--no-ext-diff",
                  "--no-textconv",
                  "--ignore-submodules=none",
                  "HEAD",
                  "--",
              ],
              env=git_environment,
              check=False,
          )
          if source_clean.returncode != 0:
              raise SystemExit("checked-out index must match HEAD")
          # Pre-build workflow authority requires zero untracked paths. The
          # later src-tauri/gen exception is Rust-owned and type-checked.
          untracked = subprocess.check_output(
              [
                  *git_arguments,
                  "ls-files",
                  "--others",
                  "-z",
                  "--",
              ],
              env=git_environment,
          )
          if untracked:
              raise SystemExit("checked-out source has untracked paths")
          subprocess.run(
              [
                  "/usr/bin/python3",
                  "-B",
                  ".github/scripts/packaging_toolchain_identity.py",
                  "--repository-root", os.environ["GITHUB_WORKSPACE"],
                  "--provenance", ".github/toolchains/packaging-python-macos.v1.json",
                  "--source-commit", source_revision,
                  "--git", git,
                  "--git-sha256", os.environ["TOBKIRI_PACKAGING_GIT_SHA256"],
                  "--smoke-git-authority",
              ],
              check=True,
              env={"PATH": "/usr/bin:/bin"},
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_revision={source_revision}\n")
              output.write(f"source_tree={source_tree}\n")

      - name: Install locked runtime and test dependencies
        run: python .github/scripts/install_locked_python_test_dependencies.py

      - name: Exercise root packaging ancestor transactions
        env:
          TOBKIRI_REQUIRE_ROOT_PROCESS_TESTS: "1"
          ROOT_PROCESS_JUNIT: ${{ runner.temp }}/packaging-root-process-tests.xml
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -rs \
            --junitxml="$ROOT_PROCESS_JUNIT" \
            .github/scripts/tests/test_packaging_toolchain_identity.py::test_process_creates_and_rolls_back_clean_framework_ancestors \
            .github/scripts/tests/test_packaging_toolchain_identity.py::test_process_recovers_kill_midway_through_ancestor_creation \
            .github/scripts/tests/test_packaging_toolchain_identity.py::test_process_retains_created_ancestor_that_becomes_nonempty \
            .github/scripts/tests/test_packaging_toolchain_identity.py::test_unrelated_unsafe_system_frameworks_is_not_install_authority \
            .github/scripts/tests/test_packaging_toolchain_identity.py::test_process_rejects_other_uid_existing_ancestor_when_available \
            .github/scripts/tests/test_packaging_toolchain_identity.py::test_published_ancestor_is_traversable_by_nonroot_process_when_available
          python - "$ROOT_PROCESS_JUNIT" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          if tests != 6 or skipped != 0:
              raise SystemExit(f"root process contract requires 6 tests and 0 skips: {tests=}, {skipped=}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-installers-${{ matrix.target }}
          workspaces: |
            pack-shell -> target
            tobkiri_launcher/src-tauri -> target

      - name: Install Tauri CLI
        shell: bash
        run: |
          if command -v cargo-tauri >/dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if cargo install tauri-cli --version "^2" --locked; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 20))
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tobkiri_launcher/frontend/package-lock.json
            tobkiri_runtime/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install viewer frontend dependencies
        working-directory: tobkiri_launcher/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run viewer frontend checks
        working-directory: tobkiri_launcher/frontend
        run: |
          npm test
          npm run lint

      - name: Build panel frontend
        working-directory: tobkiri_launcher/frontend
        env:
          TOBKIRI_PANEL_BUILD_DIR: ${{ runner.temp }}/tobkiri-panel-build
        run: npm run build
      - name: Build defaultspack frontend
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Build debug Pack Shell for viewer Rust tests
        run: cargo build --locked --manifest-path pack-shell/Cargo.toml --target ${{ matrix.target }}

      - name: Seal debug Pack Shell for viewer Rust tests
        run: >-
          python .github/scripts/seal_pack_shell.py
          --repo-root .
          --target ${{ matrix.target }}
          --profile debug

      - name: Run rumi viewer Rust tests
        working-directory: tobkiri_launcher/src-tauri
        run: cargo test --locked

      - name: Build release Pack Shell for verified Tauri Shell artifact
        run: cargo build --release --locked --manifest-path pack-shell/Cargo.toml --target ${{ matrix.target }}

      - name: Seal release Pack Shell for verified Tauri Shell artifact
        run: >-
          python .github/scripts/seal_pack_shell.py
          --repo-root .
          --target ${{ matrix.target }}
          --profile release

      - name: Build verified Tauri Shell artifact
        working-directory: tobkiri_launcher
        run: cargo tauri build --target ${{ matrix.target }} --config src-tauri/tauri.shell.conf.json --bundles ${{ matrix.shell_bundles }} --ci

      - name: Ad-hoc sign macOS Tauri Shell artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find "tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name 'Tobkiri.app' -print -quit)"
          test -n "$artifact"
          /usr/bin/codesign --force --sign - "$artifact"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$artifact"

      - name: Build local macOS application (ad-hoc)
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        env:
          TOBKIRI_PANEL_BUILD_DIR: ${{ runner.temp }}/tobkiri-panel-build
        run: cargo tauri build --target ${{ matrix.target }} --config src-tauri/tauri.macos.dev.conf.json --bundles app --ci ${{ matrix.signing_args }}

      - name: Build macOS DMG installer
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        shell: bash
        run: |
          set -o pipefail
          bash scripts/package_macos_dmg.sh \
            --app-bundle "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tobkiri Launcher.app" \
            --target '${{ matrix.target }}' \
            --allow-ad-hoc-local \
            --output-dir "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" \
            2>&1 | tee "$RUNNER_TEMP/tobkiri-macos-dmg-${{ matrix.target }}.log"

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: tobkiri-${{ matrix.artifact_suffix }}-installer-${{ steps.checked_out_source.outputs.source_revision }}
          path: |
            tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Capture macOS installer diagnostics
        if: failure() && runner.os == 'macOS'
        working-directory: tobkiri_launcher
        shell: bash
        run: |
          diagnostic="$RUNNER_TEMP/tobkiri-macos-dmg-${{ matrix.target }}-diagnostic.txt"
          {
            echo "target=${{ matrix.target }}"
            echo "runner=${RUNNER_OS:-unknown}"
            sw_vers || true
            uname -a || true
            df -h . || true
            command -v hdiutil || true
            hdiutil info || true
            ps auxww | grep -E '[h]diutil|[d]iskimages' || true
            bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
            find "$bundle_dir" -maxdepth 3 -type f -o -type d | sort || true
            generated_script="$bundle_dir/dmg/bundle_dmg.sh"
            if [[ -f "$generated_script" ]]; then
              echo '--- generated bundle_dmg.sh (first 240 lines) ---'
              sed -n '1,240p' "$generated_script"
            fi
          } > "$diagnostic" 2>&1

      - name: Upload macOS installer diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tobkiri-${{ matrix.artifact_suffix }}-installer-diagnostics-${{ steps.checked_out_source.outputs.source_revision }}
          path: |
            ${{ runner.temp }}/tobkiri-macos-dmg-${{ matrix.target }}.log
            ${{ runner.temp }}/tobkiri-macos-dmg-${{ matrix.target }}-diagnostic.txt
          if-no-files-found: warn

      - name: Clean packaging Python installation
        if: always() && env.TOBKIRI_PACKAGING_TRANSACTION_TOKEN != ''
        env:
          PRIMARY_JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          set -uo pipefail
          args=(--transaction-token "$TOBKIRI_PACKAGING_TRANSACTION_TOKEN" --cleanup-transaction)
          if test -n "${TOBKIRI_PACKAGING_PYTHON_SNAPSHOT:-}"; then
            args+=(--cleanup-macos-installation "$TOBKIRI_PACKAGING_PYTHON_SNAPSHOT")
            args+=(--inventory-sha256 "$TOBKIRI_PACKAGING_PYTHON_INVENTORY_SHA256")
          fi
          /usr/bin/python3 -B .github/scripts/packaging_toolchain_identity.py "${args[@]}"
          cleanup_status=$?
          if test "$cleanup_status" -ne 0; then
            if test "$PRIMARY_JOB_STATUS" = success; then
              exit "$cleanup_status"
            fi
            echo "::warning::Packaging cleanup failed after primary job failure; residue retained for diagnosis"
          fi
