name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOBKIRI_RELEASE_REPOSITORY: harupipipipi/tobkiri

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            shell_bundles: app
            presentation_variant: shell.tauri.default.macos-arm64
            presentation_platform: macos
            presentation_architecture: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            shell_bundles: app
            presentation_variant: shell.tauri.default.macos-x86_64
            presentation_platform: macos
            presentation_architecture: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release repository binding
        shell: bash
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TOBKIRI_RELEASE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          test "$repository" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Bind verified packaging tool identities
        shell: python
        env:
          TOOLCHAIN_ENV: ${{ runner.temp }}/tobkiri-packaging-toolchain.env
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          output = Path(os.environ["TOOLCHAIN_ENV"])
          subprocess.run(
              [
                  sys.executable,
                  "-B",
                  ".github/scripts/packaging_toolchain_identity.py",
                  "--python",
                  str(Path(sys.executable).resolve()),
                  "--env-output",
                  str(output),
              ],
              check=True,
          )
          payload = output.read_text(encoding="utf-8")
          required = (
              "TOBKIRI_PACKAGING_PYTHON=",
              "TOBKIRI_PACKAGING_PYTHON_SHA256=",
              "TOBKIRI_PACKAGING_GIT=",
              "TOBKIRI_PACKAGING_GIT_SHA256=",
          )
          if any(marker not in payload for marker in required):
              raise SystemExit("formal packaging tool identity output is incomplete")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(payload)

      - name: Resolve checked-out source revision
        id: checked_out_source
        shell: python
        run: |
          import os
          import subprocess

          source_revision = subprocess.check_output(
              ["git", "rev-parse", "--verify", "HEAD"], text=True
          ).strip()
          if len(source_revision) != 40 or any(
              character not in "0123456789abcdef" for character in source_revision
          ):
              raise SystemExit("checked-out source revision is not a full lowercase SHA")
          tag_revision = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"{os.environ['GITHUB_REF_NAME']}^{{commit}}"],
              text=True,
          ).strip()
          if tag_revision != source_revision:
              raise SystemExit("checked-out source revision does not match the release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_revision={source_revision}\n")

      - name: Verify exact release tag, versions, and production trust policy
        shell: python
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          import os
          import subprocess
          import sys

          root = os.environ["GITHUB_WORKSPACE"]
          subprocess.run(
              [
                  sys.executable,
                  "scripts/release_gate.py",
                  "version",
                  "--repo-root",
                  root,
                  "--tag",
                  os.environ["GITHUB_REF_NAME"],
              ],
              check=True,
          )
          subprocess.run(
              [
                  sys.executable,
                  "scripts/release_gate.py",
                  "signing",
                  "--mode",
                  "production",
                  "--platform",
                  "${{ matrix.presentation_platform }}",
                  "--check-tools",
              ],
              check=True,
          )

      - name: Install locked runtime and test dependencies
        run: python .github/scripts/install_locked_python_test_dependencies.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            pack-shell -> target
            tobkiri_launcher/src-tauri -> target

      - name: Clean cached Pack Shell outputs before verified build
        shell: bash
        run: |
          set -euo pipefail
          cargo clean --manifest-path pack-shell/Cargo.toml --target "${{ matrix.target }}"

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tobkiri_launcher/frontend/package-lock.json
            tobkiri_runtime/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: tobkiri_launcher/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run frontend release checks
        working-directory: tobkiri_launcher/frontend
        run: |
          npm test
          npm run lint
          npm run audit

      - name: Build panel frontend
        working-directory: tobkiri_launcher/frontend
        env:
          TOBKIRI_PANEL_BUILD_DIR: ${{ runner.temp }}/tobkiri-panel-build
        run: npm run build
      - name: Build defaultspack frontend
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Verify defaultspack frontend source and bundle sync
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm run check:shell-bundle

      - name: Build debug Pack Shell for release Rust tests
        run: cargo build --locked --manifest-path pack-shell/Cargo.toml --target "${{ matrix.target }}"

      - name: Seal debug Pack Shell for release Rust tests
        run: >-
          python .github/scripts/seal_pack_shell.py
          --repo-root .
          --target ${{ matrix.target }}
          --profile debug

      - name: Run Rust release smoke tests
        working-directory: tobkiri_launcher/src-tauri
        run: cargo test --locked

      - name: Build release Pack Shell for verified Tauri Shell artifact
        run: cargo build --release --locked --manifest-path pack-shell/Cargo.toml --target "${{ matrix.target }}"

      - name: Seal release Pack Shell for verified Tauri Shell artifact
        run: >-
          python .github/scripts/seal_pack_shell.py
          --repo-root .
          --target ${{ matrix.target }}
          --profile release

      - name: Prepare sealed Python environment and export manifest binding
        shell: python
        env:
          SEALED_TARGET: ${{ matrix.target }}
          SEALED_BINDING: ${{ runner.temp }}/sealed-python-binding.env
        run: |
          import importlib.util
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target = os.environ["SEALED_TARGET"]
          builder_path = root / ".github/scripts/build_sealed_python_environment.py"
          spec = importlib.util.spec_from_file_location("sealed_target_check", builder_path)
          if spec is None or spec.loader is None:
              raise SystemExit(f"Unable to load {builder_path}")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.target_spec(target)

          subprocess.run(
              [
                  sys.executable,
                  ".github/scripts/prepare_tauri_resources.py",
                  "--repo-root",
                  str(root),
                  "--target",
                  target,
                  "--uv-version",
                  module.UV_VERSION,
                  "--require-runtime-tools",
              ],
              cwd=root,
              check=True,
          )
          binding = Path(os.environ["SEALED_BINDING"])
          subprocess.run(
              [
                  sys.executable,
                  str(builder_path),
                  "--repo-root",
                  str(root),
                  "--target",
                  target,
                  "--check",
                  "--env-output",
                  str(binding),
              ],
              cwd=root,
              check=True,
          )
          text = binding.read_text(encoding="utf-8")
          prefix = "TOBKIRI_SEALED_PYTHON_MANIFEST_SHA256="
          digest = text.removeprefix(prefix).strip()
          if len(digest) != 64 or any(character not in "0123456789abcdef" for character in digest):
              raise SystemExit("sealed Python manifest binding is not a lowercase SHA-256")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(text if text.endswith("\n") else text + "\n")

      - name: Build verified Tauri Shell artifact
        working-directory: tobkiri_launcher
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: cargo tauri build --target ${{ matrix.target }} --config src-tauri/tauri.shell.conf.json --bundles ${{ matrix.shell_bundles }} --ci

      - name: Notarize and staple macOS Shell artifact
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          artifact="$(find "tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name 'Tobkiri.app' -print -quit)"
          test -n "$artifact"
          python scripts/release_gate.py sign-artifacts \
            --repo-root "$GITHUB_WORKSPACE" \
            --mode production \
            --platform macos \
            --app-bundle "$artifact" \
            --artifact "$artifact"

      - name: Stage verified macOS Tauri Shell artifact
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
        run: |
          artifact="$(find "tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name 'Tobkiri.app' -print -quit)"
          test -n "$artifact"
          python -c 'import secrets,sys; open(sys.argv[1], "wb").write(secrets.token_bytes(32))' "$RUNNER_TEMP/tobkiri-presentation-signing-key.raw"
          python tobkiri_launcher/scripts/write_shell_build_output.py \
            --artifact-id '${{ matrix.presentation_variant }}' --artifact "$artifact" \
            --platform '${{ matrix.presentation_platform }}' --architecture '${{ matrix.presentation_architecture }}' \
            --source-identity 'github:${{ github.repository }}' --source-revision '${{ steps.checked_out_source.outputs.source_revision }}' \
            --output "$RUNNER_TEMP/shell-build-output.v4.json"
          python tobkiri_launcher/scripts/package_presentation_artifact.py \
            --catalog tobkiri_launcher/src-tauri/bundled/presentation_catalog.json \
            --build-output-manifest "$RUNNER_TEMP/shell-build-output.v4.json" \
            --signing-key "$RUNNER_TEMP/tobkiri-presentation-signing-key.raw" \
            --signing-key-id 'github-actions:${{ github.run_id }}:${{ matrix.target }}' \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-dir "$RELEASE_ROOT"

      - name: Build signed macOS application
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        env:
          TOBKIRI_PRESENTATION_RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
          TOBKIRI_PANEL_BUILD_DIR: ${{ runner.temp }}/tobkiri-panel-build
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --target ${{ matrix.target }} --bundles app --ci

      - name: Verify Developer ID signed macOS application
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          bash scripts/verify_macos_release.sh \
            --app-bundle "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tobkiri Launcher.app" \
            --signing-identity "$APPLE_SIGNING_IDENTITY"

      - name: Build macOS DMG installer
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        shell: bash
        env:
          TOBKIRI_PRESENTATION_RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -o pipefail
          bash scripts/package_macos_dmg.sh \
            --app-bundle "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tobkiri Launcher.app" \
            --target '${{ matrix.target }}' \
            --signing-identity "$APPLE_SIGNING_IDENTITY" \
            --output-dir "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" \
            2>&1 | tee "$RUNNER_TEMP/tobkiri-macos-dmg-${{ matrix.target }}.log"

      - name: Notarize and staple macOS release DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tobkiri Launcher.app"
          test -d "$app"
          dmg="$(find "tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          test -s "$dmg"
          python scripts/release_gate.py sign-artifacts \
            --repo-root "$GITHUB_WORKSPACE" \
            --mode production \
            --platform macos \
            --app-bundle "$app" \
            --artifact "$app" \
            --artifact "$dmg"


      - name: Prepare immutable target release upload
        shell: python
        env:
          RELEASE_UPLOAD_ROOT: ${{ runner.temp }}/tobkiri-release-upload/${{ matrix.target }}
          SOURCE_REVISION: ${{ steps.checked_out_source.outputs.source_revision }}
        run: |
          import os
          import subprocess
          import sys

          runner_os = "${{ runner.os }}"
          target = "${{ matrix.target }}"
          bundle_root = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              "tobkiri_launcher",
              "src-tauri",
              "target",
              target,
              "release",
              "bundle",
          )
          if runner_os != "macOS":
              raise SystemExit("release workflow is currently macOS-only")
          source_dirs = [os.path.join(bundle_root, "dmg")]
          command = [
              sys.executable,
              "scripts/release_inventory.py",
              "collect-target",
              "--output-root",
              os.environ["RELEASE_UPLOAD_ROOT"],
              "--source-revision",
              os.environ["SOURCE_REVISION"],
              "--target",
              target,
              "--platform",
              "${{ matrix.presentation_platform }}",
              "--architecture",
              "${{ matrix.presentation_architecture }}",
          ]
          for source_dir in source_dirs:
              command.extend(["--source-dir", source_dir])
          subprocess.run(command, check=True)

      - name: Upload immutable target release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tobkiri-release-${{ matrix.target }}-${{ steps.checked_out_source.outputs.source_revision }}
          path: ${{ runner.temp }}/tobkiri-release-upload
          if-no-files-found: error
          retention-days: 7

      - name: Capture macOS installer diagnostics
        if: failure() && runner.os == 'macOS'
        working-directory: tobkiri_launcher
        shell: bash
        run: |
          diagnostic="$RUNNER_TEMP/tobkiri-macos-dmg-${{ matrix.target }}-diagnostic.txt"
          {
            echo "target=${{ matrix.target }}"
            echo "runner=${RUNNER_OS:-unknown}"
            sw_vers || true
            uname -a || true
            df -h . || true
            command -v hdiutil || true
            hdiutil info || true
            ps auxww | grep -E '[h]diutil|[d]iskimages' || true
            bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
            find "$bundle_dir" -maxdepth 3 -type f -o -type d | sort || true
            generated_script="$bundle_dir/dmg/bundle_dmg.sh"
            if [[ -f "$generated_script" ]]; then
              echo '--- generated bundle_dmg.sh (first 240 lines) ---'
              sed -n '1,240p' "$generated_script"
            fi
          } > "$diagnostic" 2>&1

      - name: Upload macOS installer diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tobkiri-release-${{ matrix.target }}-installer-diagnostics-${{ steps.checked_out_source.outputs.source_revision }}
          path: |
            ${{ runner.temp }}/tobkiri-macos-dmg-${{ matrix.target }}.log
            ${{ runner.temp }}/tobkiri-macos-dmg-${{ matrix.target }}-diagnostic.txt
          if-no-files-found: warn

  gather:
    name: Gather, verify, and attest release assets
    if: ${{ needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Resolve checked-out source revision
        id: checked_out_source
        shell: python
        run: |
          import os
          import subprocess

          source_revision = subprocess.check_output(
              ["git", "rev-parse", "--verify", "HEAD"], text=True
          ).strip()
          if len(source_revision) != 40 or any(
              character not in "0123456789abcdef" for character in source_revision
          ):
              raise SystemExit("checked-out source revision is not a full lowercase SHA")
          tag_revision = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"{os.environ['GITHUB_REF_NAME']}^{{commit}}"],
              text=True,
          ).strip()
          if tag_revision != source_revision:
              raise SystemExit("checked-out source revision does not match the release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_revision={source_revision}\n")

      - name: Verify exact release tag and synchronized version
        shell: python
        run: |
          import os
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.executable,
                  "scripts/release_gate.py",
                  "version",
                  "--repo-root",
                  os.environ["GITHUB_WORKSPACE"],
                  "--tag",
                  os.environ["GITHUB_REF_NAME"],
              ],
              check=True,
          )

      - name: Download all immutable target release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tobkiri-release-*-${{ steps.checked_out_source.outputs.source_revision }}
          path: ${{ runner.temp }}/tobkiri-release-gather
          merge-multiple: true

      - name: Create one SHA-256 release inventory
        id: create_inventory
        shell: python
        env:
          SOURCE_REVISION: ${{ steps.checked_out_source.outputs.source_revision }}
          GATHER_ROOT: ${{ runner.temp }}/tobkiri-release-gather
        run: |
          import hashlib
          import os
          import subprocess
          import sys

          root = os.environ["GATHER_ROOT"]
          inventory_path = os.path.join(root, "release-inventory.json")
          subprocess.run(
              [
                  sys.executable,
                  "scripts/release_inventory.py",
                  "create",
                  "--root",
                  root,
                  "--output",
                  inventory_path,
                  "--assets-dir",
                  os.path.join(root, "release-assets"),
                  "--source-revision",
                  os.environ["SOURCE_REVISION"],
                  "--tag",
                  os.environ["GITHUB_REF_NAME"],
              ],
              check=True,
          )
          with open(inventory_path, "rb") as inventory_file:
              inventory_sha256 = "sha256:" + hashlib.sha256(
                  inventory_file.read()
              ).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"inventory_sha256={inventory_sha256}\n")

      - name: Verify gathered release inventory before attestation
        shell: python
        env:
          INVENTORY_SHA256: ${{ steps.create_inventory.outputs.inventory_sha256 }}
          SOURCE_REVISION: ${{ steps.checked_out_source.outputs.source_revision }}
          GATHER_ROOT: ${{ runner.temp }}/tobkiri-release-gather
        run: |
          import os
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.executable,
                  "scripts/release_inventory.py",
                  "verify",
                  "--inventory",
                  os.path.join(os.environ["GATHER_ROOT"], "release-inventory.json"),
                  "--assets-dir",
                  os.path.join(os.environ["GATHER_ROOT"], "release-assets"),
                  "--source-revision",
                  os.environ["SOURCE_REVISION"],
                  "--tag",
                  os.environ["GITHUB_REF_NAME"],
                  "--inventory-sha256",
                  os.environ["INVENTORY_SHA256"],
              ],
              check=True,
          )

      - name: Attest the single release inventory subject
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: ${{ runner.temp }}/tobkiri-release-gather/release-inventory.json

      - name: Add attested inventory to final release assets
        shell: python
        env:
          GATHER_ROOT: ${{ runner.temp }}/tobkiri-release-gather
        run: |
          import os
          import shutil

          root = os.environ["GATHER_ROOT"]
          shutil.copyfile(
              os.path.join(root, "release-inventory.json"),
              os.path.join(root, "release-assets", "release-inventory.json"),
          )

      - name: Verify final release assets after attestation
        shell: python
        env:
          INVENTORY_SHA256: ${{ steps.create_inventory.outputs.inventory_sha256 }}
          SOURCE_REVISION: ${{ steps.checked_out_source.outputs.source_revision }}
          GATHER_ROOT: ${{ runner.temp }}/tobkiri-release-gather
        run: |
          import os
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.executable,
                  "scripts/release_inventory.py",
                  "verify",
                  "--inventory",
                  os.path.join(os.environ["GATHER_ROOT"], "release-inventory.json"),
                  "--assets-dir",
                  os.path.join(os.environ["GATHER_ROOT"], "release-assets"),
                  "--source-revision",
                  os.environ["SOURCE_REVISION"],
                  "--tag",
                  os.environ["GITHUB_REF_NAME"],
                  "--inventory-sha256",
                  os.environ["INVENTORY_SHA256"],
              ],
              check=True,
          )

      - name: Upload one reviewable draft release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        if: success()
        with:
          files: ${{ runner.temp }}/tobkiri-release-gather/release-assets/*
          # Tags create a reviewable draft. A maintainer must publish it only
          # after checking the attested inventory and release notes.
          draft: true
          generate_release_notes: true
