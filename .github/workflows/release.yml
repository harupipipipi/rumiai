name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TOBKIRI_RELEASE_REPOSITORY: harupipipipi/tobkiri

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            shell_bundles: app
            presentation_variant: shell.tauri.default.macos-arm64
            presentation_platform: macos
            presentation_architecture: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            shell_bundles: app
            presentation_variant: shell.tauri.default.macos-x86_64
            presentation_platform: macos
            presentation_architecture: x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            shell_bundles: nsis
            presentation_variant: shell.tauri.default.windows-x86_64
            presentation_platform: windows
            presentation_architecture: x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            shell_bundles: appimage
            presentation_variant: shell.tauri.default.linux-x86_64
            presentation_platform: linux
            presentation_architecture: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release repository binding
        shell: bash
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TOBKIRI_RELEASE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          test "$repository" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve checked-out source revision
        id: checked_out_source
        shell: python
        run: |
          import os
          import subprocess

          source_revision = subprocess.check_output(
              ["git", "rev-parse", "--verify", "HEAD"], text=True
          ).strip()
          if len(source_revision) != 40 or any(
              character not in "0123456789abcdef" for character in source_revision
          ):
              raise SystemExit("checked-out source revision is not a full lowercase SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_revision={source_revision}\n")

      - name: Install Shell release signing dependency
        run: python -m pip install -r tobkiri_runtime/requirements.txt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            pack-shell -> target
            tobkiri_launcher/src-tauri -> target

      - name: Clean cached Pack Shell outputs before verified build
        shell: bash
        run: |
          set -euo pipefail
          cargo clean --manifest-path pack-shell/Cargo.toml --target "${{ matrix.target }}"

      - name: Require macOS release signing and notarization configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for variable in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required macOS release setting is missing: ${variable}" >&2
              exit 1
            fi
          done
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *)
              echo "APPLE_SIGNING_IDENTITY must name a Developer ID Application identity" >&2
              exit 1
              ;;
          esac

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tobkiri_launcher/frontend/package-lock.json
            tobkiri_runtime/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: tobkiri_launcher/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run frontend release checks
        working-directory: tobkiri_launcher/frontend
        run: |
          npm test
          npm run lint
          npm run audit

      - name: Build panel frontend
        working-directory: tobkiri_launcher/frontend
        run: npm run build
      - name: Build defaultspack frontend
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Verify defaultspack frontend source and bundle sync
        working-directory: tobkiri_runtime/ecosystem/defaultspack/webapp
        run: npm run check:shell-bundle

      - name: Build debug Pack Shell for release Rust tests
        run: cargo build --locked --manifest-path pack-shell/Cargo.toml --target "${{ matrix.target }}"

      - name: Seal debug Pack Shell for release Rust tests
        run: >-
          python .github/scripts/seal_pack_shell.py
          --repo-root .
          --target ${{ matrix.target }}
          --profile debug

      - name: Run Rust release smoke tests
        working-directory: tobkiri_launcher/src-tauri
        run: cargo test --locked

      - name: Build release Pack Shell for verified Tauri Shell artifact
        run: cargo build --release --locked --manifest-path pack-shell/Cargo.toml --target "${{ matrix.target }}"

      - name: Seal release Pack Shell for verified Tauri Shell artifact
        run: >-
          python .github/scripts/seal_pack_shell.py
          --repo-root .
          --target ${{ matrix.target }}
          --profile release

      - name: Build verified Tauri Shell artifact
        working-directory: tobkiri_launcher
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: cargo tauri build --target ${{ matrix.target }} --config src-tauri/tauri.shell.conf.json --bundles ${{ matrix.shell_bundles }} --ci

      - name: Stage verified macOS Tauri Shell artifact
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
        run: |
          artifact="$(find "tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name 'Tobkiri.app' -print -quit)"
          test -n "$artifact"
          python -c 'import secrets,sys; open(sys.argv[1], "wb").write(secrets.token_bytes(32))' "$RUNNER_TEMP/tobkiri-presentation-signing-key.raw"
          python tobkiri_launcher/scripts/write_shell_build_output.py \
            --artifact-id '${{ matrix.presentation_variant }}' --artifact "$artifact" \
            --platform '${{ matrix.presentation_platform }}' --architecture '${{ matrix.presentation_architecture }}' \
            --source-identity 'github:${{ github.repository }}' --source-revision '${{ steps.checked_out_source.outputs.source_revision }}' \
            --output "$RUNNER_TEMP/shell-build-output.v4.json"
          python tobkiri_launcher/scripts/package_presentation_artifact.py \
            --catalog tobkiri_launcher/src-tauri/bundled/presentation_catalog.json \
            --build-output-manifest "$RUNNER_TEMP/shell-build-output.v4.json" \
            --signing-key "$RUNNER_TEMP/tobkiri-presentation-signing-key.raw" \
            --signing-key-id 'github-actions:${{ github.run_id }}:${{ matrix.target }}' \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-dir "$RELEASE_ROOT"

      - name: Stage verified Linux Tauri Shell artifact
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
        run: |
          artifact="$(find "tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$artifact"
          python -c 'import secrets,sys; open(sys.argv[1], "wb").write(secrets.token_bytes(32))' "$RUNNER_TEMP/tobkiri-presentation-signing-key.raw"
          python tobkiri_launcher/scripts/write_shell_build_output.py \
            --artifact-id '${{ matrix.presentation_variant }}' --artifact "$artifact" \
            --platform '${{ matrix.presentation_platform }}' --architecture '${{ matrix.presentation_architecture }}' \
            --source-identity 'github:${{ github.repository }}' --source-revision '${{ steps.checked_out_source.outputs.source_revision }}' \
            --output "$RUNNER_TEMP/shell-build-output.v4.json"
          python tobkiri_launcher/scripts/package_presentation_artifact.py \
            --catalog tobkiri_launcher/src-tauri/bundled/presentation_catalog.json \
            --build-output-manifest "$RUNNER_TEMP/shell-build-output.v4.json" \
            --signing-key "$RUNNER_TEMP/tobkiri-presentation-signing-key.raw" \
            --signing-key-id 'github-actions:${{ github.run_id }}:${{ matrix.target }}' \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-dir "$RELEASE_ROOT"

      - name: Stage verified Windows Tauri Shell artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
        run: |
          $artifact = Join-Path $env:GITHUB_WORKSPACE "tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/tobkiri-shell.exe"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Tauri Shell binary not found: $artifact" }
          $key = Join-Path $env:RUNNER_TEMP "tobkiri-presentation-signing-key.raw"
          $manifest = Join-Path $env:RUNNER_TEMP "shell-build-output.v4.json"
          python -c "import secrets,sys; open(sys.argv[1], 'wb').write(secrets.token_bytes(32))" $key
          python tobkiri_launcher/scripts/write_shell_build_output.py `
            --artifact-id '${{ matrix.presentation_variant }}' --artifact $artifact `
            --platform '${{ matrix.presentation_platform }}' --architecture '${{ matrix.presentation_architecture }}' `
            --source-identity 'github:${{ github.repository }}' --source-revision '${{ steps.checked_out_source.outputs.source_revision }}' --output $manifest
          python tobkiri_launcher/scripts/package_presentation_artifact.py `
            --catalog tobkiri_launcher/src-tauri/bundled/presentation_catalog.json `
            --build-output-manifest $manifest --signing-key $key `
            --signing-key-id 'github-actions:${{ github.run_id }}:${{ matrix.target }}' `
            --repository-root $env:GITHUB_WORKSPACE `
            --output-dir $env:RELEASE_ROOT

      - name: Build signed macOS application
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        env:
          TOBKIRI_PRESENTATION_RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --target ${{ matrix.target }} --bundles app --ci

      - name: Verify Developer ID signed macOS application
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          bash scripts/verify_macos_release.sh \
            --app-bundle "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tobkiri Launcher.app" \
            --signing-identity "$APPLE_SIGNING_IDENTITY"

      - name: Build macOS DMG installer
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        shell: bash
        env:
          TOBKIRI_PRESENTATION_RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -o pipefail
          bash scripts/package_macos_dmg.sh \
            --app-bundle "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tobkiri Launcher.app" \
            --target '${{ matrix.target }}' \
            --signing-identity "$APPLE_SIGNING_IDENTITY" \
            --output-dir "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" \
            2>&1 | tee "$RUNNER_TEMP/tobkiri-macos-dmg-${{ matrix.target }}.log"

      - name: Notarize and staple macOS release DMG
        if: runner.os == 'macOS'
        working-directory: tobkiri_launcher
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PROFILE_NAME: tobkiri-release
          NOTARY_KEYCHAIN: ${{ runner.temp }}/tobkiri-notary.keychain-db
        run: |
          set -euo pipefail
          dmg="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          test -s "$dmg"
          rm -f "$NOTARY_KEYCHAIN"
          xcrun notarytool store-credentials "$NOTARY_PROFILE_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$NOTARY_KEYCHAIN"
          xcrun notarytool history \
            --keychain-profile "$NOTARY_PROFILE_NAME" \
            --keychain "$NOTARY_KEYCHAIN" >/dev/null
          xcrun notarytool submit "$dmg" \
            --keychain-profile "$NOTARY_PROFILE_NAME" \
            --keychain "$NOTARY_KEYCHAIN" \
            --wait
          xcrun stapler staple -v "$dmg"
          xcrun stapler validate -v "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - name: Build with cargo tauri
        if: runner.os != 'macOS'
        working-directory: tobkiri_launcher
        env:
          TOBKIRI_PRESENTATION_RELEASE_ROOT: ${{ runner.temp }}/tobkiri-presentation-release
        run: cargo tauri build --target ${{ matrix.target }} --ci

      - name: Sign and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: tobkiri_launcher
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: https://timestamp.digicert.com
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_BASE64 is required for release installers'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required for release installers'
          }

          $signtool = Get-ChildItem -Path @(
            "$env:ProgramFiles\Windows Kits\10\bin\*\x64\signtool.exe",
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"
          ) -File -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe is required for release installers' }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'tobkiri-release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            Get-PfxData -FilePath $certificatePath -Password $securePassword | Out-Null

            $installers = @(Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' -File)
            if ($installers.Count -eq 0) { throw 'No Windows NSIS installer was produced' }
            foreach ($installer in $installers) {
              & $signtool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 /d 'Tobkiri Launcher' $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($installer.Name)" }
              & $signtool.FullName verify /pa /all /tw /v $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.Name)" }
            }
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Capture macOS installer diagnostics
        if: failure() && runner.os == 'macOS'
        working-directory: tobkiri_launcher
        shell: bash
        run: |
          diagnostic="$RUNNER_TEMP/tobkiri-macos-dmg-${{ matrix.target }}-diagnostic.txt"
          {
            echo "target=${{ matrix.target }}"
            echo "runner=${RUNNER_OS:-unknown}"
            sw_vers || true
            uname -a || true
            df -h . || true
            command -v hdiutil || true
            hdiutil info || true
            ps auxww | grep -E '[h]diutil|[d]iskimages' || true
            bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
            find "$bundle_dir" -maxdepth 3 -type f -o -type d | sort || true
            generated_script="$bundle_dir/dmg/bundle_dmg.sh"
            if [[ -f "$generated_script" ]]; then
              echo '--- generated bundle_dmg.sh (first 240 lines) ---'
              sed -n '1,240p' "$generated_script"
            fi
          } > "$diagnostic" 2>&1

      - name: Upload macOS installer diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tobkiri-release-${{ matrix.target }}-installer-diagnostics-${{ steps.checked_out_source.outputs.source_revision }}
          path: |
            ${{ runner.temp }}/tobkiri-macos-dmg-${{ matrix.target }}.log
            ${{ runner.temp }}/tobkiri-macos-dmg-${{ matrix.target }}-diagnostic.txt
          if-no-files-found: warn

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            tobkiri_launcher/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          # Tags create a reviewable draft. A maintainer must publish it after
          # verifying the artifacts and release notes.
          draft: true
          generate_release_notes: true
