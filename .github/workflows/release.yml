name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  UV_VERSION: "0.11.14"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rumi_viewer/frontend/package-lock.json
            rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: rumi_viewer/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run frontend release checks
        working-directory: rumi_viewer/frontend
        run: |
          npm test
          npm run lint
          npm run audit

      - name: Build panel frontend
        working-directory: rumi_viewer/frontend
        run: npm run build

      - name: Build defaultspack frontend
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Validate release versions
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          cargo = pathlib.Path("rumi_viewer/src-tauri/Cargo.toml").read_text()
          cargo_version = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1)
          tauri_version = json.loads(pathlib.Path("rumi_viewer/src-tauri/tauri.conf.json").read_text())["version"]
          if cargo_version != tauri_version:
              raise SystemExit(f"viewer version mismatch: Cargo={cargo_version} tauri={tauri_version}")
          pack = json.loads(pathlib.Path("rumi_ai_1_10/ecosystem/defaultspack/rumi-pack.json").read_text())
          eco = json.loads(pathlib.Path("rumi_ai_1_10/ecosystem/defaultspack/ecosystem.json").read_text())
          if pack["version"] != eco["version"]:
              raise SystemExit(f"defaultspack version mismatch: rumi-pack={pack['version']} ecosystem={eco['version']}")
          PY

      - name: Build pack-shell runtime
        working-directory: pack-shell
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare bundled Rumi runtime
        run: python .github/scripts/prepare_tauri_resources.py --target ${{ matrix.target }} --uv-version ${{ env.UV_VERSION }} --require-runtime-tools

      - name: Run Rust release smoke tests
        working-directory: rumi_viewer/src-tauri
        run: cargo test --locked

      - name: Inject updater public key
        shell: bash
        env:
          RUMI_VIEWER_UPDATER_PUBKEY: ${{ secrets.RUMI_VIEWER_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          if not os.environ.get("RUMI_VIEWER_UPDATER_PUBKEY"):
              raise SystemExit("RUMI_VIEWER_UPDATER_PUBKEY is required for signed viewer updater artifacts")
          if not os.environ.get("TAURI_SIGNING_PRIVATE_KEY"):
              raise SystemExit("TAURI_SIGNING_PRIVATE_KEY is required for signed viewer updater artifacts")
          path = pathlib.Path("rumi_viewer/src-tauri/tauri.conf.json")
          data = json.loads(path.read_text())
          data.setdefault("plugins", {}).setdefault("updater", {})["pubkey"] = os.environ["RUMI_VIEWER_UPDATER_PUBKEY"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Build with cargo tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUMI_VIEWER_UPDATER_PUBKEY: ${{ secrets.RUMI_VIEWER_UPDATER_PUBKEY }}
        working-directory: rumi_viewer
        run: cargo tauri build --target ${{ matrix.target }} --ci

      - name: Collect viewer updater artifact
        shell: bash
        run: |
          python rumi_ai_1_10/scripts/collect_tauri_updater_artifacts.py \
            --bundle-dir "rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle" \
            --target "${{ matrix.target }}" \
            --out-dir dist/viewer-updater

      - name: Build pack and core update artifacts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          RUMI_PACK_HMAC_KEY_ID: ${{ secrets.RUMI_PACK_HMAC_KEY_ID }}
          RUMI_PACK_HMAC_SECRET: ${{ secrets.RUMI_PACK_HMAC_SECRET }}
        run: |
          mkdir -p dist/update
          PACK_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('rumi_ai_1_10/ecosystem/defaultspack/rumi-pack.json'))['version'])
          PY
          )"
          CORE_VERSION="$(python - <<'PY'
          import re, pathlib
          m = re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path('rumi_ai_1_10/pyproject.toml').read_text(), re.M)
          print(m.group(1))
          PY
          )"
          VIEWER_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('rumi_viewer/src-tauri/tauri.conf.json'))['version'])
          PY
          )"
          python rumi_ai_1_10/scripts/build_pack_bundle.py \
            rumi_ai_1_10/ecosystem/defaultspack \
            "dist/update/defaultspack-${PACK_VERSION}.rumi-pack"
          python rumi_ai_1_10/scripts/verify_pack_bundle.py \
            "dist/update/defaultspack-${PACK_VERSION}.rumi-pack" \
            --pack-id defaultspack \
            --core-version "$CORE_VERSION" \
            --viewer-version "$VIEWER_VERSION"
          python rumi_ai_1_10/scripts/generate_pack_index.py \
            --artifact "dist/update/defaultspack-${PACK_VERSION}.rumi-pack" \
            --base-url "$RELEASE_BASE_URL" \
            --output dist/update/pack-index.stable.json
          python rumi_ai_1_10/scripts/build_core_bundle.py \
            rumi_ai_1_10 \
            "dist/update/rumiai-core-${CORE_VERSION}.zip"
          python rumi_ai_1_10/scripts/generate_core_index.py \
            --bundle "dist/update/rumiai-core-${CORE_VERSION}.zip" \
            --runtime-dir rumi_ai_1_10 \
            --base-url "$RELEASE_BASE_URL" \
            --output dist/update/core-index.stable.json
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("dist/update")
          index = json.loads((root / "pack-index.stable.json").read_text())
          for pack in index["packs"].values():
              for item in pack["versions"].values():
                  name = item["url"].rsplit("/", 1)[-1]
                  if not (root / name).exists():
                      raise SystemExit(f"pack index references missing artifact: {name}")
          core = json.loads((root / "core-index.stable.json").read_text())
          for item in core["versions"].values():
              name = item["url"].rsplit("/", 1)[-1]
              if not (root / name).exists():
                  raise SystemExit(f"core index references missing artifact: {name}")
          PY

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            dist/viewer-updater/viewer-updater-${{ matrix.target }}-*
            dist/viewer-updater/viewer-updater-${{ matrix.target }}.json
            dist/update/*.rumi-pack
            dist/update/pack-index.stable.json
            dist/update/rumiai-core-*.zip
            dist/update/core-index.stable.json
          draft: false
          generate_release_notes: true

  publish-updater-index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download release updater fragments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/viewer-updater
          gh release download "${{ github.ref_name }}" \
            --pattern 'viewer-updater-*' \
            --dir dist/viewer-updater \
            --clobber

      - name: Generate Tauri latest.json
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          VIEWER_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('rumi_viewer/src-tauri/tauri.conf.json'))['version'])
          PY
          )"
          python rumi_ai_1_10/scripts/generate_tauri_latest.py \
            --fragments-dir dist/viewer-updater \
            --base-url "$RELEASE_BASE_URL" \
            --version "$VIEWER_VERSION" \
            --output dist/viewer-updater/latest.json

      - name: Upload latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: dist/viewer-updater/latest.json
          draft: false
          generate_release_notes: true
