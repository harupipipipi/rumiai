name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build with cargo tauri
        working-directory: rumi_viewer
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          draft: true
          generate_release_notes: true
