name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - ".github/scripts/prepare_tauri_resources.py"
      - ".github/workflows/windows-installer.yml"
      - "pack-shell/**"
      - "rumi_ai_1_10/**"
      - "rumi_viewer/**"

permissions:
  contents: read

env:
  TARGET: x86_64-pc-windows-msvc
  UV_VERSION: "0.11.14"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rumi_viewer/frontend/package-lock.json
            rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install viewer frontend dependencies
        working-directory: rumi_viewer/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run viewer frontend checks
        working-directory: rumi_viewer/frontend
        run: |
          npm test
          npm run lint

      - name: Build panel frontend
        working-directory: rumi_viewer/frontend
        run: npm run build

      - name: Build defaultspack frontend
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Build pack-shell runtime
        working-directory: pack-shell
        run: cargo build --locked --release --target ${{ env.TARGET }}

      - name: Prepare bundled Rumi runtime
        run: python .github/scripts/prepare_tauri_resources.py --target ${{ env.TARGET }} --uv-version ${{ env.UV_VERSION }} --require-runtime-tools

      - name: Run rumi viewer Rust tests
        working-directory: rumi_viewer/src-tauri
        run: cargo test --locked

      - name: Build Windows installer
        working-directory: rumi_viewer
        run: cargo tauri build --target ${{ env.TARGET }} --bundles nsis --ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rumi-ai-windows-installer-${{ github.sha }}
          path: rumi_viewer/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: error
