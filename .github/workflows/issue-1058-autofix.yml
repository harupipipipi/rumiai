name: Apply issue 1058 fix

on:
  pull_request:
    branches: [soon]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1058-harden-tool-preview
      - name: Harden Tool Preview network and HTML boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.tsx')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              "export const WEB_PREVIEW_IFRAME_SANDBOX = 'allow-forms allow-modals allow-popups allow-scripts';",
              "export const WEB_PREVIEW_IFRAME_SANDBOX = '';\nexport const TOOL_PREVIEW_HTML_CSP = \"default-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; frame-src 'none'; img-src data: blob:; media-src data: blob:; object-src 'none'; script-src 'none'; style-src 'unsafe-inline'; font-src data:;\";\nconst MAX_INLINE_RASTER_IMAGE_URL_LENGTH = 12_000_000;",
          )

          href_start = source.index('function safeHref(')
          href_end = source.index('function looksLikeHtml(', href_start)
          safe_helpers = '''function blockedPreviewHostname(hostname: string): boolean {\n  const host = hostname.toLowerCase().replace(/^\\[|\\]$/g, '');\n  if (!host || host === 'localhost' || host === '0.0.0.0' || host === '::1' || host.endsWith('.local')) return true;\n  if (/^127\\./.test(host) || /^10\\./.test(host) || /^169\\.254\\./.test(host) || /^192\\.168\\./.test(host)) return true;\n  const match = host.match(/^172\\.(\\d{1,3})\\./);\n  return Boolean(match && Number(match[1]) >= 16 && Number(match[1]) <= 31);\n}\n\nexport function safeToolPreviewHref(url: string | undefined): string | undefined {\n  const raw = String(url ?? '').trim();\n  if (!raw || raw.startsWith('//')) return undefined;\n  const rootRelative = raw.startsWith('/');\n  try {\n    const parsed = new URL(raw, 'https://rumi.invalid');\n    if (!['http:', 'https:'].includes(parsed.protocol)) return undefined;\n    if (parsed.username || parsed.password) return undefined;\n    if (!rootRelative && blockedPreviewHostname(parsed.hostname)) return undefined;\n    return rootRelative ? `${parsed.pathname}${parsed.search}${parsed.hash}` : parsed.toString();\n  } catch {\n    return undefined;\n  }\n}\n\nexport function inlineToolPreviewImageUrl(url: string | undefined): string | undefined {\n  const raw = String(url ?? '').trim();\n  if (!raw || raw.length > MAX_INLINE_RASTER_IMAGE_URL_LENGTH) return undefined;\n  return /^data:image\\/(?:png|jpeg|jpg|gif|webp);base64,[a-z0-9+/=\\s]+$/i.test(raw) ? raw : undefined;\n}\n\n'''
          source = source[:href_start] + safe_helpers + source[href_end:]

          html_start = source.index('function escapeHtmlAttribute(')
          html_end = source.index('export function artifactDialogItemFromToolPreview(', html_start)
          html_helper = '''function escapeHtmlAttribute(value: string): string {\n  return value\n    .replace(/&/g, '&amp;')\n    .replace(/\"/g, '&quot;')\n    .replace(/</g, '&lt;')\n    .replace(/>/g, '&gt;');\n}\n\nexport function hardenToolPreviewHtml(content: string): string {\n  const withoutNavigationPrimitives = content\n    .replace(/<base\\b[^>]*>/gi, '')\n    .replace(/<meta\\b[^>]*http-equiv\\s*=\\s*['\"]?refresh['\"]?[^>]*>/gi, '');\n  const csp = `<meta http-equiv=\"Content-Security-Policy\" content=\"${escapeHtmlAttribute(TOOL_PREVIEW_HTML_CSP)}\">`;\n  if (/<head[^>]*>/i.test(withoutNavigationPrimitives)) {\n    return withoutNavigationPrimitives.replace(/<head([^>]*)>/i, `<head$1>${csp}`);\n  }\n  if (/<html[^>]*>/i.test(withoutNavigationPrimitives)) {\n    return withoutNavigationPrimitives.replace(/<html([^>]*)>/i, `<html$1><head>${csp}</head>`);\n  }\n  return `<!doctype html><html><head>${csp}</head><body>${withoutNavigationPrimitives}</body></html>`;\n}\n\n'''
          source = source[:html_start] + html_helper + source[html_end:]

          source = source.replace('href: safeHref(data.url),', 'href: safeToolPreviewHref(data.url),')
          source = source.replace('href: data.url,', 'href: safeToolPreviewHref(data.url),')
          source = source.replace('imageUrl: data.url,', 'imageUrl: inlineToolPreviewImageUrl(data.url),')
          source = source.replace('imageUrl: data.screenshot,', 'imageUrl: inlineToolPreviewImageUrl(data.screenshot),')

          web_start = source.index('function WebPreviewContent(')
          web_end = source.index('function CodePreviewContent(', web_start)
          web_renderer = '''function WebPreviewContent({ data }: { data: WebPreview }) {\n  const href = safeToolPreviewHref(data.url);\n  const screenshot = inlineToolPreviewImageUrl(data.screenshot);\n  return (\n    <div className="flex h-full flex-col">\n      <div className="flex flex-shrink-0 items-center gap-2 border-b border-zinc-800/60 bg-zinc-900 px-3 py-2">\n        <Globe size={12} className="shrink-0 text-zinc-600" />\n        <span className="min-w-0 flex-1 truncate font-mono text-[10px] text-zinc-500">{data.url}</span>\n        {href && (\n          <a href={href} target="_blank" rel="noopener noreferrer" referrerPolicy="no-referrer" className="text-zinc-600 transition-colors hover:text-zinc-300" aria-label={`Open ${data.title || data.url} externally`}>\n            <ExternalLink size={12} />\n          </a>\n        )}\n      </div>\n      <div className="flex min-h-0 flex-1 items-center justify-center overflow-auto p-4">\n        {screenshot ? (\n          <img src={screenshot} alt={data.title} referrerPolicy="no-referrer" className="max-h-full max-w-full rounded border border-zinc-800" />\n        ) : (\n          <div className="max-w-md rounded-lg border border-amber-500/20 bg-amber-500/10 p-4 text-center">\n            <Globe size={28} className="mx-auto text-zinc-600" />\n            <h3 className="mt-2 text-sm font-medium text-zinc-200">{data.title || 'Remote preview'}</h3>\n            {data.snippet && <p className="mt-2 text-xs leading-relaxed text-zinc-500">{data.snippet}</p>}\n            <p className="mt-3 text-[11px] leading-5 text-amber-100">Remote pages and screenshots are not loaded automatically. Review the displayed destination before opening it externally.</p>\n            {href && (\n              <a href={href} target="_blank" rel="noopener noreferrer" referrerPolicy="no-referrer" className="mt-3 inline-flex h-8 items-center gap-1 rounded-md border border-zinc-700 bg-zinc-950 px-3 text-[11px] text-zinc-300 hover:border-zinc-600">\n                <ExternalLink size={12} />\n                Open externally\n              </a>\n            )}\n          </div>\n        )}\n      </div>\n    </div>\n  );\n}\n\n'''
          source = source[:web_start] + web_renderer + source[web_end:]

          remote_start = source.index('function useRemotePreviewText(')
          remote_end = source.index('function HtmlPreviewContent(', remote_start)
          remote_hook = '''function useRemotePreviewText(data: FilePreview) {\n  const inlineContent = displayPreviewContent(data);\n  return {\n    error: inlineContent === undefined && data.url\n      ? 'Remote preview content is blocked. Open the reviewed source externally instead.'\n      : null,\n    isLoading: false,\n    text: inlineContent ?? '',\n  };\n}\n\n'''
          source = source[:remote_start] + remote_hook + source[remote_end:]

          source = source.replace('const srcDoc = content ? htmlWithBase(content, data.url) : undefined;', 'const srcDoc = content ? hardenToolPreviewHtml(content) : undefined;')
          source = source.replace('href={data.url}', 'href={safeToolPreviewHref(data.url)}')
          source = source.replace('{data.url && (', '{safeToolPreviewHref(data.url) && (')
          source = source.replace('rel="noreferrer"', 'rel="noopener noreferrer" referrerPolicy="no-referrer"')
          source = source.replace('sandbox="allow-forms allow-modals allow-popups allow-scripts"', 'sandbox={WEB_PREVIEW_IFRAME_SANDBOX}\n            referrerPolicy="no-referrer"\n            allow=""')

          image_start = source.index('function ImagePreviewContent(')
          image_end = source.index('// ============================================================\n// Canvas timeline', image_start)
          image_renderer = '''function ImagePreviewContent({ data }: { data: ImagePreview }) {\n  const imageUrl = inlineToolPreviewImageUrl(data.url);\n  const href = safeToolPreviewHref(data.url);\n  return (\n    <div className="flex h-full flex-col">\n      <div className="flex flex-shrink-0 items-center gap-2 border-b border-zinc-800/60 bg-zinc-900 px-3 py-2">\n        <Image size={12} className="text-zinc-500" />\n        <span className="min-w-0 flex-1 truncate text-[11px] text-zinc-300">{data.alt}</span>\n        {href && (\n          <a href={href} target="_blank" rel="noopener noreferrer" referrerPolicy="no-referrer" className="text-zinc-600 hover:text-zinc-300" aria-label={`Open ${data.alt} externally`}>\n            <ExternalLink size={12} />\n          </a>\n        )}\n      </div>\n      <div className="flex flex-1 items-center justify-center overflow-y-auto p-4">\n        {imageUrl ? (\n          <img src={imageUrl} alt={data.alt} referrerPolicy="no-referrer" className="max-h-full max-w-full rounded-lg border border-zinc-800" />\n        ) : (\n          <div className="max-w-sm rounded-lg border border-amber-500/20 bg-amber-500/10 p-4 text-center">\n            <Image size={32} className="mx-auto text-zinc-600" />\n            <p className="mt-2 text-[11px] leading-5 text-amber-100">Remote images are blocked from automatic loading. Only bounded inline PNG, JPEG, GIF, or WebP data can render in this preview.</p>\n          </div>\n        )}\n      </div>\n      {data.prompt && (\n        <div className="flex-shrink-0 border-t border-zinc-800/60 px-3 py-2">\n          <p className="text-[10px] text-zinc-600"><span className="text-zinc-500">Prompt:</span> {data.prompt}</p>\n        </div>\n      )}\n    </div>\n  );\n}\n\n'''
          source = source[:image_start] + image_renderer + source[image_end:]

          for forbidden in ["fetch(data.url", "src={data.url}", "allow-scripts", "htmlWithBase(", "localPreviewUrl("]:
              if forbidden in source:
                  raise SystemExit(f'unsafe Tool Preview primitive remains: {forbidden}')
          path.write_text(source, encoding='utf-8')

          test_path = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('import assert from "node:assert/strict";\n', 'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\n')
          tests = tests.replace(
              '  WEB_PREVIEW_IFRAME_SANDBOX,\n',
              '  WEB_PREVIEW_IFRAME_SANDBOX,\n  TOOL_PREVIEW_HTML_CSP,\n  hardenToolPreviewHtml,\n  inlineToolPreviewImageUrl,\n  safeToolPreviewHref,\n',
          )
          old_test = '''test("web preview iframe sandbox keeps same-origin content isolated", () => {\n  assert.match(WEB_PREVIEW_IFRAME_SANDBOX, /allow-scripts/);\n  assert.doesNotMatch(WEB_PREVIEW_IFRAME_SANDBOX, /allow-same-origin/);\n});'''
          new_test = '''test("tool preview HTML sandbox grants no active capabilities", () => {\n  assert.equal(WEB_PREVIEW_IFRAME_SANDBOX, "");\n  assert.match(TOOL_PREVIEW_HTML_CSP, /default-src 'none'/);\n  assert.match(TOOL_PREVIEW_HTML_CSP, /connect-src 'none'/);\n  assert.match(TOOL_PREVIEW_HTML_CSP, /script-src 'none'/);\n  assert.match(TOOL_PREVIEW_HTML_CSP, /form-action 'none'/);\n});'''
          if old_test not in tests:
              raise SystemExit('expected sandbox test missing')
          tests = tests.replace(old_test, new_test)
          if 'tool preview rejects unsafe and private destinations' not in tests:
              tests += '''\n\ntest("tool preview rejects unsafe and private destinations", () => {\n  assert.equal(safeToolPreviewHref("https://example.com/report"), "https://example.com/report");\n  assert.equal(safeToolPreviewHref("/api/artifacts/1"), "/api/artifacts/1");\n  for (const value of [\n    "javascript:alert(1)",\n    "data:text/html,hello",\n    "file:///tmp/secret",\n    "//attacker.example/path",\n    "https://user:pass@example.com/",\n    "http://127.0.0.1/admin",\n    "http://10.0.0.1/admin",\n    "http://192.168.1.1/admin",\n    "http://172.16.0.1/admin",\n  ]) {\n    assert.equal(safeToolPreviewHref(value), undefined, value);\n  }\n});\n\ntest("tool preview only renders bounded inline raster images", () => {\n  assert.equal(inlineToolPreviewImageUrl("data:image/png;base64,YWJj"), "data:image/png;base64,YWJj");\n  assert.equal(inlineToolPreviewImageUrl("data:image/svg+xml;base64,YWJj"), undefined);\n  assert.equal(inlineToolPreviewImageUrl("https://example.com/pixel.png"), undefined);\n});\n\ntest("tool preview hardens inline HTML and removes navigation primitives", () => {\n  const hardened = hardenToolPreviewHtml('<html><head><base href="https://attacker.example/"><meta http-equiv="refresh" content="0;url=https://attacker.example"></head><body><script>fetch("/secret")</script><form action="https://attacker.example"></form></body></html>');\n  assert.match(hardened, /Content-Security-Policy/);\n  assert.match(hardened, /default-src &amp;#39;none&amp;#39;|default-src 'none'/);\n  assert.doesNotMatch(hardened, /<base/i);\n  assert.doesNotMatch(hardened, /http-equiv="refresh"/i);\n});\n\ntest("tool preview source contains no automatic URL fetch or raw image source", () => {\n  const source = readFileSync(resolve(import.meta.dirname, "ToolPreview.tsx"), "utf8");\n  assert.doesNotMatch(source, /fetch\\(data\\.url/);\n  assert.doesNotMatch(source, /src=\\{data\\.url\\}/);\n  assert.doesNotMatch(source, /allow-scripts|allow-forms|allow-popups/);\n});\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json
      - name: Install dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci
      - name: Focused tests
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npx tsx --test src/components/ToolPreview.test.ts
      - name: Typecheck and build
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: |
          npm run lint
          npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/issue-1058-autofix.yml
          git config user.name "rumiai-ui-bot"
          git config user.email "rumiai-ui-bot@users.noreply.github.com"
          git add -A .github/workflows/issue-1058-autofix.yml \
            rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.tsx \
            rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.test.ts \
            rumi_ai_1_10/ecosystem/defaultspack/ui
          git commit -m "Harden Tool Preview against untrusted active content"
          git push origin HEAD:fix-1058-harden-tool-preview
