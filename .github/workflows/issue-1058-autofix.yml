name: Apply issue 1058 fix

on:
  push:
    branches: [fix-1058-harden-tool-preview]
  pull_request:
    branches: [soon]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[issue-1058-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1058-harden-tool-preview
      - name: Disable active and automatic remote previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.tsx')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              "export const WEB_PREVIEW_IFRAME_SANDBOX = 'allow-forms allow-modals allow-popups allow-scripts';",
              "export const WEB_PREVIEW_IFRAME_SANDBOX = '';",
          )

          helpers_start = source.index('function safeHref(')
          helpers_end = source.index('function looksLikeHtml(', helpers_start)
          helpers = '''function blockedPreviewHost(hostname: string): boolean {
  const host = hostname.toLowerCase().replace(/^\\[|\\]$/g, '');
  if (!host || host === 'localhost' || host === '0.0.0.0' || host === '::1' || host.endsWith('.local')) return true;
  if (/^(127|10|169\\.254|192\\.168)\\./.test(host)) return true;
  const private172 = host.match(/^172\\.(\\d{1,3})\\./);
  return Boolean(private172 && Number(private172[1]) >= 16 && Number(private172[1]) <= 31);
}

export function safeToolPreviewHref(url: string | undefined): string | undefined {
  const raw = String(url ?? '').trim();
  if (!raw || raw.startsWith('//')) return undefined;
  const relative = raw.startsWith('/');
  try {
    const parsed = new URL(raw, 'https://rumi.invalid');
    if (!['http:', 'https:'].includes(parsed.protocol)) return undefined;
    if (parsed.username || parsed.password) return undefined;
    if (!relative && blockedPreviewHost(parsed.hostname)) return undefined;
    return relative ? `${parsed.pathname}${parsed.search}${parsed.hash}` : parsed.toString();
  } catch {
    return undefined;
  }
}

export function inlineToolPreviewImageUrl(url: string | undefined): string | undefined {
  const raw = String(url ?? '').trim();
  if (!raw || raw.length > 12_000_000) return undefined;
  return /^data:image\\/(?:png|jpeg|jpg|gif|webp);base64,[a-z0-9+/=\\s]+$/i.test(raw) ? raw : undefined;
}

'''
          source = source[:helpers_start] + helpers + source[helpers_end:]

          source = source.replace('href: safeHref(data.url),', 'href: safeToolPreviewHref(data.url),')
          source = source.replace('href: data.url,', 'href: safeToolPreviewHref(data.url),')
          source = source.replace('imageUrl: data.url,', 'imageUrl: inlineToolPreviewImageUrl(data.url),')
          source = source.replace('imageUrl: data.screenshot,', 'imageUrl: inlineToolPreviewImageUrl(data.screenshot),')

          web_start = source.index('function WebPreviewContent(')
          web_end = source.index('function CodePreviewContent(', web_start)
          web = '''function WebPreviewContent({ data }: { data: WebPreview }) {
  const href = safeToolPreviewHref(data.url);
  const screenshot = inlineToolPreviewImageUrl(data.screenshot);
  return (
    <div className="flex h-full flex-col">
      <div className="flex items-center gap-2 border-b border-zinc-800/60 bg-zinc-900 px-3 py-2">
        <Globe size={12} className="shrink-0 text-zinc-600" />
        <span className="min-w-0 flex-1 truncate font-mono text-[10px] text-zinc-500">{data.url}</span>
      </div>
      <div className="flex min-h-0 flex-1 items-center justify-center overflow-auto p-4">
        {screenshot ? (
          <img src={screenshot} alt={data.title} referrerPolicy="no-referrer" className="max-h-full max-w-full rounded border border-zinc-800" />
        ) : (
          <div className="max-w-md rounded-lg border border-amber-500/20 bg-amber-500/10 p-4 text-center">
            <Globe size={28} className="mx-auto text-zinc-600" />
            <h3 className="mt-2 text-sm font-medium text-zinc-200">{data.title || 'Remote preview blocked'}</h3>
            {data.snippet && <p className="mt-2 text-xs leading-relaxed text-zinc-500">{data.snippet}</p>}
            <p className="mt-3 text-[11px] leading-5 text-amber-100">Remote pages and screenshots are not loaded automatically.</p>
            {href && <a href={href} target="_blank" rel="noopener noreferrer" referrerPolicy="no-referrer" className="mt-3 inline-flex h-8 items-center gap-1 rounded-md border border-zinc-700 bg-zinc-950 px-3 text-[11px] text-zinc-300"><ExternalLink size={12} />Open externally</a>}
          </div>
        )}
      </div>
    </div>
  );
}

'''
          source = source[:web_start] + web + source[web_end:]

          hook_start = source.index('function useRemotePreviewText(')
          hook_end = source.index('function HtmlPreviewContent(', hook_start)
          hook = '''function useRemotePreviewText(data: FilePreview) {
  const inlineContent = displayPreviewContent(data);
  return {
    error: inlineContent === undefined && data.url ? 'Remote content is blocked from automatic loading.' : null,
    isLoading: false,
    text: inlineContent ?? '',
  };
}

'''
          source = source[:hook_start] + hook + source[hook_end:]

          html_start = source.index('function HtmlPreviewContent(')
          html_end = source.index('function FilePreviewContent(', html_start)
          html = '''function HtmlPreviewContent({ data, content, error }: { data: FilePreview; content: string; error: string | null; isLoading: boolean }) {
  return (
    <div className="flex h-full flex-col">
      <div className="flex items-center justify-between border-b border-zinc-800/60 bg-zinc-900 px-3 py-2">
        <span className="truncate font-mono text-[11px] text-zinc-300">{data.filename}</span>
        <span className="rounded border border-amber-500/20 px-2 py-0.5 text-[10px] text-amber-200">HTML source only</span>
      </div>
      <div className="min-h-0 flex-1 overflow-auto bg-zinc-950 p-3">
        {content ? <pre className="whitespace-pre-wrap break-words font-mono text-[11px] leading-5 text-zinc-400">{content}</pre> : <p className="text-[11px] text-zinc-500">{error || 'No trusted inline HTML content.'}</p>}
      </div>
    </div>
  );
}

'''
          source = source[:html_start] + html + source[html_end:]

          source = source.replace('href={data.url}', 'href={safeToolPreviewHref(data.url)}')
          source = source.replace('{data.url && (', '{safeToolPreviewHref(data.url) && (')
          source = source.replace('rel="noreferrer"', 'rel="noopener noreferrer" referrerPolicy="no-referrer"')

          image_start = source.index('function ImagePreviewContent(')
          image_end = source.index('// ============================================================\n// Canvas timeline', image_start)
          image = '''function ImagePreviewContent({ data }: { data: ImagePreview }) {
  const imageUrl = inlineToolPreviewImageUrl(data.url);
  const href = safeToolPreviewHref(data.url);
  return (
    <div className="flex h-full flex-col">
      <div className="flex items-center gap-2 border-b border-zinc-800/60 bg-zinc-900 px-3 py-2"><Image size={12} className="text-zinc-500" /><span className="min-w-0 flex-1 truncate text-[11px] text-zinc-300">{data.alt}</span></div>
      <div className="flex flex-1 items-center justify-center overflow-auto p-4">
        {imageUrl ? <img src={imageUrl} alt={data.alt} referrerPolicy="no-referrer" className="max-h-full max-w-full rounded-lg border border-zinc-800" /> : <div className="max-w-sm rounded-lg border border-amber-500/20 bg-amber-500/10 p-4 text-center"><Image size={32} className="mx-auto text-zinc-600" /><p className="mt-2 text-[11px] leading-5 text-amber-100">Remote images are blocked from automatic loading.</p>{href && <a href={href} target="_blank" rel="noopener noreferrer" referrerPolicy="no-referrer" className="mt-3 inline-flex text-[11px] text-zinc-300 underline">Open externally</a>}</div>}
      </div>
    </div>
  );
}

'''
          source = source[:image_start] + image + source[image_end:]

          for unsafe in ['fetch(data.url', 'src={data.url}', 'allow-scripts', 'htmlWithBase(content']:
              if unsafe in source:
                  raise SystemExit(f'unsafe primitive remains: {unsafe}')
          path.write_text(source, encoding='utf-8')

          test = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.test.ts')
          tests = test.read_text(encoding='utf-8')
          tests = tests.replace('  WEB_PREVIEW_IFRAME_SANDBOX,\n', '  WEB_PREVIEW_IFRAME_SANDBOX,\n  inlineToolPreviewImageUrl,\n  safeToolPreviewHref,\n')
          tests = tests.replace('  assert.match(WEB_PREVIEW_IFRAME_SANDBOX, /allow-scripts/);\n  assert.doesNotMatch(WEB_PREVIEW_IFRAME_SANDBOX, /allow-same-origin/);', '  assert.equal(WEB_PREVIEW_IFRAME_SANDBOX, "");')
          tests += '''\n\ntest("tool preview URL policy rejects unsafe and private destinations", () => {\n  assert.equal(safeToolPreviewHref("https://example.com/report"), "https://example.com/report");\n  for (const value of ["javascript:alert(1)", "data:text/html,x", "file:///tmp/x", "//evil.test/x", "http://127.0.0.1/x", "http://10.0.0.1/x", "http://192.168.1.1/x", "https://u:p@example.com/"]) assert.equal(safeToolPreviewHref(value), undefined);\n});\n\ntest("tool preview only auto-renders bounded inline raster data", () => {\n  assert.equal(inlineToolPreviewImageUrl("data:image/png;base64,YWJj"), "data:image/png;base64,YWJj");\n  assert.equal(inlineToolPreviewImageUrl("data:image/svg+xml;base64,YWJj"), undefined);\n  assert.equal(inlineToolPreviewImageUrl("https://example.com/pixel.png"), undefined);\n});\n'''
          test.write_text(tests, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json
      - name: Validate
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: |
          npm ci
          npx tsx --test src/components/ToolPreview.test.ts
          npm run lint
          npm run build
      - name: Commit
        run: |
          rm .github/workflows/issue-1058-autofix.yml
          git config user.name rumiai-ui-bot
          git config user.email rumiai-ui-bot@users.noreply.github.com
          git add -A .github/workflows/issue-1058-autofix.yml rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.tsx rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.test.ts rumi_ai_1_10/ecosystem/defaultspack/ui
          git commit -m "[issue-1058-applied] Disable active untrusted Tool Preview content"
          git push origin HEAD:fix-1058-harden-tool-preview
