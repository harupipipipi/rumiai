name: Apply issue 1050 fix

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1050-reject-plaintext-api-qr
      - name: Reject plaintext API credential QR payloads
        run: |
          python - <<'PY'
          from pathlib import Path

          payload_path = Path('rumi_ai_1_10/ecosystem/rumi_mobile/lib/src/qr/qr_payload.dart')
          source = payload_path.read_text(encoding='utf-8')
          source = source.replace(
              "class QrUnknown extends QrPayload {\n",
              "class QrRejected extends QrPayload {\n  const QrRejected(this.reason);\n  final String reason;\n}\n\nclass QrUnknown extends QrPayload {\n",
          )
          source = source.replace(
              "QrPayload parseQrPayload(String raw) {\n  final trimmed = raw.trim();\n  if (trimmed.isEmpty) return const QrUnknown('');\n",
              "const _maxQrPayloadCharacters = 64 * 1024;\n\nQrPayload parseQrPayload(String raw) {\n  final trimmed = raw.trim();\n  if (trimmed.isEmpty) return const QrUnknown('');\n  if (trimmed.length > _maxQrPayloadCharacters) {\n    return const QrRejected('QRデータが大きすぎるため取り込めません');\n  }\n",
          )
          api_start = source.index("        case 'rumi_api':")
          api_end = source.index("        case 'rumi_mobile_pair_v1':", api_start)
          rejected = """        case 'rumi_api':\n          return const QrRejected(\n            'APIキーを含む旧式QRは安全のため取り込めません。端末に紐づく短時間・一回限りの安全な転送を使用してください。',\n          );\n"""
          source = source[:api_start] + rejected + source[api_end:]
          payload_path.write_text(source, encoding='utf-8')

          scanner_path = Path('rumi_ai_1_10/ecosystem/rumi_mobile/lib/src/qr/qr_scanner_screen.dart')
          scanner = scanner_path.read_text(encoding='utf-8')
          old = """    final payload = parseQrPayload(raw);\n    final mismatch = !_matchesPurpose(payload);\n    Navigator.of(context).pop((payload, mismatch));\n"""
          new = """    final payload = parseQrPayload(raw);\n    if (payload is QrRejected) {\n      setState(() {\n        _scanError = payload.reason;\n        _handled = false;\n      });\n      return;\n    }\n    final mismatch = !_matchesPurpose(payload);\n    Navigator.of(context).pop((payload, mismatch));\n"""
          if old not in scanner:
              raise SystemExit('scanner result block changed upstream')
          scanner_path.write_text(scanner.replace(old, new), encoding='utf-8')

          test_path = Path('rumi_ai_1_10/ecosystem/rumi_mobile/test/qr_payload_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          first = tests.index("  test('parses rumi_api import payload with api_key alias'")
          end = tests.index("  test('parses plain url as QrUrl'", first)
          replacement = """  test('rejects legacy plaintext API credential QR payloads', () {\n    final payload = parseQrPayload(\n        '{\"kind\":\"rumi_api\",\"baseUrl\":\"https://api.openai.com/v1\",\"api_key\":\"sk-xx\",\"model\":\"gpt-4o-mini\"}');\n    expect(payload, isA<QrRejected>());\n    expect((payload as QrRejected).reason, contains('旧式QR'));\n  });\n\n  test('rejects oversized QR payloads before import', () {\n    final payload = parseQrPayload('x' * (64 * 1024 + 1));\n    expect(payload, isA<QrRejected>());\n  });\n\n"""
          tests = tests[:first] + replacement + tests[end:]
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Commit implementation
        run: |
          rm .github/workflows/issue-1050-autofix.yml
          git config user.name "rumiai-mobile-bot"
          git config user.email "rumiai-mobile-bot@users.noreply.github.com"
          git add -A .github/workflows/issue-1050-autofix.yml \
            rumi_ai_1_10/ecosystem/rumi_mobile/lib/src/qr/qr_payload.dart \
            rumi_ai_1_10/ecosystem/rumi_mobile/lib/src/qr/qr_scanner_screen.dart \
            rumi_ai_1_10/ecosystem/rumi_mobile/test/qr_payload_test.dart
          git commit -m "Reject plaintext API credential QR imports"
          git push origin HEAD:fix-1050-reject-plaintext-api-qr
