name: Flutter Mobile

on:
  pull_request:
    branches: [master]
    paths:
      - "rumi_mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  push:
    branches: [master]
    paths:
      - "rumi_mobile/**"
      - ".github/workflows/flutter-mobile.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: rumi_mobile
        run: flutter pub get

      - name: Check formatting
        working-directory: rumi_mobile
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        working-directory: rumi_mobile
        run: flutter analyze

      - name: Test
        working-directory: rumi_mobile
        run: flutter test
