name: Retry issue 1058 fix

on:
  push:
    branches:
      - fix/1058-harden-tool-preview-boundary

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1058-harden-tool-preview-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json
      - name: Apply incremental fail-closed transforms
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('rumi_ai_1_10/ecosystem/defaultspack/webapp')
          page = root / 'src/components/ToolPreview.tsx'
          text = page.read_text(encoding='utf-8')

          text = text.replace("export const WEB_PREVIEW_IFRAME_SANDBOX = 'allow-forms allow-modals allow-popups allow-scripts';", "export const WEB_PREVIEW_IFRAME_SANDBOX = '';")

          old_url_helpers = '''function safeHref(url: string | undefined): string | undefined {
            if (!url || url.startsWith('data:')) return undefined;
            return url;
          }

          function localPreviewUrl(url: string | undefined): boolean {
            if (!url) return false;
            try {
              const parsed = new URL(url, window.location.href);
              const host = parsed.hostname.toLowerCase();
              return host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' || host === '::1' || host === '[::1]';
            } catch {
              return false;
            }
          }'''
          new_url_helpers = '''function previewBaseUrl(): string {
            try {
              return typeof window === 'undefined' ? '' : window.location.href;
            } catch {
              return '';
            }
          }

          export function safePreviewHref(url: string | undefined, baseUrl = previewBaseUrl()): string | undefined {
            if (!url || !baseUrl) return undefined;
            try {
              const base = new URL(baseUrl);
              const parsed = new URL(url, base);
              if (parsed.origin !== base.origin) return undefined;
              if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return undefined;
              return parsed.toString();
            } catch {
              return undefined;
            }
          }

          export function safePreviewImageUrl(url: string | undefined, baseUrl = previewBaseUrl()): string | undefined {
            if (!url) return undefined;
            if (/^data:image\/(?:png|jpe?g|gif|webp);base64,/i.test(url)) return url;
            return safePreviewHref(url, baseUrl);
          }

          function safeHref(url: string | undefined): string | undefined {
            return safePreviewHref(url);
          }

          function localPreviewUrl(url: string | undefined): boolean {
            return Boolean(safePreviewHref(url));
          }'''
          text = text.replace(old_url_helpers, new_url_helpers)

          old_html = '''function htmlWithBase(content: string, url?: string): string {
            if (!url || !content || /<base\s/i.test(content)) return content;
            const baseTag = `<base href="${escapeHtmlAttribute(url)}">`;
            if (/<head[^>]*>/i.test(content)) {
              return content.replace(/<head([^>]*)>/i, `<head$1>${baseTag}`);
            }
            return `${baseTag}${content}`;
          }'''
          new_html = '''const HTML_PREVIEW_CSP = "default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src data:; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'";

          export function hardenedHtmlPreviewDocument(content: string): string {
            const csp = `<meta http-equiv="Content-Security-Policy" content="${escapeHtmlAttribute(HTML_PREVIEW_CSP)}">`;
            const metadata = `${csp}<meta name="referrer" content="no-referrer">`;
            if (/<head[^>]*>/i.test(content)) return content.replace(/<head([^>]*)>/i, `<head$1>${metadata}`);
            return `<!doctype html><html><head>${metadata}</head><body>${content}</body></html>`;
          }

          function htmlWithBase(content: string, _url?: string): string {
            return hardenedHtmlPreviewDocument(content);
          }'''
          text = text.replace(old_html, new_html)

          text = text.replace('      imageUrl: data.url,', '      imageUrl: safePreviewImageUrl(data.url),')
          text = text.replace('      href: data.url,\n      content: data.content,', '      href: safeHref(data.url),\n      content: data.content,')
          text = text.replace('    href: data.url,\n    imageUrl: data.screenshot,', '    href: safeHref(data.url),\n    imageUrl: safePreviewImageUrl(data.screenshot),')
          text = text.replace('href={data.url}', 'href={safeHref(data.url)}')
          text = text.replace('src={data.url}\n            title={data.title || data.url}', 'src={safeHref(data.url)}\n            title={data.title || data.url}', 1)
          text = text.replace('src={data.screenshot}', 'src={safePreviewImageUrl(data.screenshot)}', 1)
          text = text.replace('sandbox="allow-forms allow-modals allow-popups allow-scripts"', 'sandbox={WEB_PREVIEW_IFRAME_SANDBOX}\n            referrerPolicy="no-referrer"', 1)
          text = text.replace('src={data.url}\n            alt={data.alt}', 'src={safePreviewImageUrl(data.url)}\n            alt={data.alt}', 1)
          text = text.replace(') : data.screenshot ? (', ') : safePreviewImageUrl(data.screenshot) ? (', 1)
          text = text.replace('{data.url ? (\n          <img', '{safePreviewImageUrl(data.url) ? (\n          <img', 1)

          text = re.sub(
              r"    setIsLoading\(true\);\n    void fetch\(data\.url, \{ cache: 'no-store' \}\)",
              """    const fetchUrl = safeHref(data.url);
            if (!fetchUrl) {
              setIsLoading(false);
              setError('Remote preview blocked by URL policy.');
              return () => {
                cancelled = true;
              };
            }
            setIsLoading(true);
            void fetch(fetchUrl, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' })""",
              text,
              count=1,
          )
          page.write_text(text, encoding='utf-8')

          test_path = root / 'src/components/ToolPreview.test.ts'
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('  hasCanvasItems,\n  isCanvasPreviewItemRenderable,\n  WEB_PREVIEW_IFRAME_SANDBOX,', '  hasCanvasItems,\n  hardenedHtmlPreviewDocument,\n  isCanvasPreviewItemRenderable,\n  safePreviewHref,\n  safePreviewImageUrl,\n  WEB_PREVIEW_IFRAME_SANDBOX,')
          tests = tests.replace('''test("web preview iframe sandbox keeps same-origin content isolated", () => {
            assert.match(WEB_PREVIEW_IFRAME_SANDBOX, /allow-scripts/);
            assert.doesNotMatch(WEB_PREVIEW_IFRAME_SANDBOX, /allow-same-origin/);
          });''', '''test("web preview iframe sandbox disables active capabilities", () => {
            assert.equal(WEB_PREVIEW_IFRAME_SANDBOX, "");
          });''')
          if 'tool preview URL policy blocks external and active-content destinations' not in tests:
              tests += '''

          test("tool preview URL policy blocks external and active-content destinations", () => {
            const base = "https://rumi.example/chat";
            assert.equal(safePreviewHref("/artifact/1", base), "https://rumi.example/artifact/1");
            assert.equal(safePreviewHref("https://attacker.example/track", base), undefined);
            assert.equal(safePreviewHref("javascript:alert(1)", base), undefined);
            assert.equal(safePreviewHref("file:///tmp/secret", base), undefined);
          });

          test("tool preview image policy permits raster data only and rejects SVG", () => {
            assert.equal(safePreviewImageUrl("data:image/png;base64,abc", "https://rumi.example/"), "data:image/png;base64,abc");
            assert.equal(safePreviewImageUrl("data:image/svg+xml;base64,PHN2Zz4=", "https://rumi.example/"), undefined);
            assert.equal(safePreviewImageUrl("https://attacker.example/pixel.gif", "https://rumi.example/"), undefined);
          });

          test("HTML preview document has a fail-closed CSP and no injected base URL", () => {
            const document = hardenedHtmlPreviewDocument("<script>fetch('https://attacker.example')</script><form action='https://attacker.example'><button>go</button></form>");
            assert.match(document, /Content-Security-Policy/);
            assert.match(document, /default-src 'none'/);
            assert.match(document, /connect-src 'none'/);
            assert.match(document, /form-action 'none'/);
            assert.match(document, /base-uri 'none'/);
            assert.doesNotMatch(document, /<base\s/i);
          });
          '''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci
      - name: Validate and rebuild
        continue-on-error: true
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: |
          npx tsx --test src/components/ToolPreview.test.ts
          npm run lint
          npm run build
      - name: Commit implementation and remove helper
        if: always()
        run: |
          rm -f .github/workflows/issue-1058-retry.yml .github/.ci-trigger-1058-retry
          git config user.name "rumiai-ui-bot"
          git config user.email "rumiai-ui-bot@users.noreply.github.com"
          git add -A .github/workflows/issue-1058-retry.yml .github/.ci-trigger-1058-retry rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.tsx rumi_ai_1_10/ecosystem/defaultspack/webapp/src/components/ToolPreview.test.ts rumi_ai_1_10/ecosystem/defaultspack/ui
          git diff --cached --quiet && exit 0
          git commit -m "[auto-patched] Harden Tool Preview trust boundary"
          git push origin HEAD:fix/1058-harden-tool-preview-boundary
