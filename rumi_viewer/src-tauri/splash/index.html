<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumi AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      color: #ffffff;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #7c83ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 2rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress {
      font-size: 1rem;
      color: #b0b0b0;
      text-align: center;
      min-height: 1.5em;
      padding: 0 2rem;
      transition: color 0.3s;
    }

    .progress.error {
      color: #ff6b6b;
    }

    .progress.ready {
      color: #69db7c;
    }

    .debug {
      margin-top: 1rem;
      max-width: 720px;
      padding: 0 2rem;
      color: #8d93b5;
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      word-break: break-all;
    }

    .debug-log {
      margin-top: 0.75rem;
      max-height: 8rem;
      overflow: hidden;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="title">Rumi AI</div>
  <div class="spinner" id="spinner"></div>
  <div class="progress" id="progress">Initializing...</div>
  <div class="debug" id="debug">splash-debug v2026-04-20-02</div>
  <div class="debug debug-log" id="debug-log"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var el = document.getElementById('progress');
      var spinner = document.getElementById('spinner');
      var debug = document.getElementById('debug');
      var debugLog = document.getElementById('debug-log');
      var didReportReady = false;
      var debugLines = [];

      function setDebug(msg) {
        debug.textContent = msg;
        debugLines.push(new Date().toLocaleTimeString() + ' ' + msg);
        debugLines = debugLines.slice(-8);
        debugLog.textContent = debugLines.join('\n');
        console.log('[rumi-viewer splash]', msg);
      }

      function sanitizeUrl(url) {
        try {
          var parsed = new URL(url);
          if (parsed.searchParams.has('token')) {
            var token = parsed.searchParams.get('token') || '';
            parsed.searchParams.set('token', token.slice(0, 8) + '...');
          }
          return parsed.toString();
        } catch (_) {
          return String(url);
        }
      }

      setDebug('splash loaded; waiting for Tauri IPC');

      function poll() {
        // Wait until Tauri IPC is available
        if (!window.__TAURI__ || !window.__TAURI__.core) {
          setDebug('Tauri IPC not available yet');
          setTimeout(poll, 500);
          return;
        }

        if (!didReportReady) {
          setDebug('polling get_setup_progress');
        }
        window.__TAURI__.core.invoke('get_setup_progress')
          .then(function (msg) {
            if (!didReportReady || msg !== 'Ready') {
              setDebug('progress=' + msg);
            }
            el.textContent = msg;
            el.className = 'progress';

            if (msg.indexOf('Error') === 0) {
              el.className = 'progress error';
              spinner.style.display = 'none';
            } else if (msg === 'Ready') {
              el.className = 'progress ready';
              spinner.style.display = 'none';

              if (!didReportReady) {
                didReportReady = true;
                setDebug('Ready detected; requesting panel URL');
                window.__TAURI__.core.invoke('get_panel_url')
                  .then(function (url) {
                    setDebug('panel URL result=' + sanitizeUrl(url));
                    if (url) {
                      setDebug('navigating splash to panel');
                      window.location.replace(url);
                      setTimeout(function () {
                        setDebug('still on splash after navigation attempt: ' + location.href);
                      }, 1500);
                    } else {
                      setDebug('panel URL is empty; staying on splash');
                    }
                  })
                  .catch(function (err) {
                    el.textContent = 'Navigation error: ' + err;
                    el.className = 'progress error';
                  });
              }
            }
          })
          .catch(function (err) {
            el.textContent = 'IPC error: ' + err;
            el.className = 'progress error';
          });

        setTimeout(poll, 1000);
      }

      poll();
    });
  </script>
</body>
</html>
