<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumi AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cosmos-gold: #f5d27a;
      --cosmos-magenta: #c66bff;
      --cosmos-blue: #7c93ff;
      --cosmos-deep: #04060f;
      --cosmos-mid: #0c1230;
      --cosmos-text: #f3f1ff;
      --cosmos-muted: #a3a8c6;
    }

    body {
      background:
        radial-gradient(ellipse at 12% 8%, rgba(124, 147, 255, 0.32) 0%, transparent 55%),
        radial-gradient(ellipse at 88% 18%, rgba(198, 107, 255, 0.26) 0%, transparent 60%),
        radial-gradient(ellipse at 55% 95%, rgba(245, 210, 122, 0.28) 0%, transparent 65%),
        var(--cosmos-deep);
      color: var(--cosmos-text);
      font-family: 'Cormorant Garamond', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      position: relative;
    }

    /* Pure-CSS star field — guarantees stars even without art assets */
    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 8%,  #fff8d8 50%, transparent 51%),
        radial-gradient(1px 1px at 22% 36%, #c8d8ff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 38% 18%, #ffd9b3 50%, transparent 51%),
        radial-gradient(1px 1px at 52% 70%, #fff8d8 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 64% 44%, #ffaae6 50%, transparent 51%),
        radial-gradient(1px 1px at 78% 12%, #c8d8ff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 86% 56%, #fff8d8 50%, transparent 51%),
        radial-gradient(1px 1px at 92% 84%, #ffd9b3 50%, transparent 51%),
        radial-gradient(1px 1px at 8% 78%, #c8d8ff 50%, transparent 51%);
      background-repeat: repeat;
      background-size: 420px 420px;
      animation: twinkle 6s ease-in-out infinite;
      opacity: 0.65;
    }
    body::after {
      background-size: 720px 720px;
      animation-duration: 9s;
      opacity: 0.45;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 0.25; }
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
    }

    .orbit {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(245, 210, 122, 0.18);
      animation: rotate 60s linear infinite;
    }
    .orbit.outer { width: 360px; height: 360px; }
    .orbit.inner { width: 220px; height: 220px; border-color: rgba(124, 147, 255, 0.18); animation-direction: reverse; animation-duration: 36s; }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .emblem {
      width: 100px;
      height: 100px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 25%, #fff5d8 0%, #f5d27a 35%, #c08c2a 78%, #6a4a14 100%);
      box-shadow:
        0 0 32px 6px rgba(245, 210, 122, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -10px 14px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 700;
      color: #1a1230;
      letter-spacing: -0.05em;
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 28px 4px rgba(245, 210, 122, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -10px 14px rgba(0, 0, 0, 0.4); }
      50%      { box-shadow: 0 0 44px 12px rgba(245, 210, 122, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -10px 14px rgba(0, 0, 0, 0.4); }
    }

    .title {
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #f5d27a 0%, #c66bff 55%, #7c93ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .subtitle {
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--cosmos-muted);
    }

    .progress {
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(245, 210, 122, 0.85);
      text-align: center;
      min-height: 1.2em;
      padding: 0 2rem;
      transition: color 0.3s, opacity 0.3s ease;
      opacity: 0;
    }

    .progress.visible {
      opacity: 1;
    }

    .progress.error {
      color: #ff6b81;
    }

    .progress.ready {
      color: #5be7c4;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(245, 210, 122, 0.2);
      border-top-color: var(--cosmos-gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .spinner.visible { opacity: 1; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      position: absolute;
      bottom: 1.4rem;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(163, 168, 198, 0.5);
      z-index: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      body::before, body::after,
      .orbit, .emblem, .spinner {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="orbit outer"></div>
  <div class="orbit inner"></div>
  <div class="stage">
    <div class="emblem">R</div>
    <div class="title">Rumi AI</div>
    <div class="subtitle">a constellation of intelligence</div>
    <div class="spinner" id="spinner"></div>
    <div class="progress" id="progress">Awakening Rumi…</div>
  </div>
  <div class="footer">COSMOS · v1</div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var el = document.getElementById('progress');
      var spinner = document.getElementById('spinner');
      var showDelay = 350; // ms — don't show spinner/progress for very fast startups
      var timer = null;
      var shown = false;
      var finished = false;

      function showUi() {
        if (shown || finished) return;
        shown = true;
        spinner.classList.add('visible');
        el.classList.add('visible');
      }

      function hideSpinner() {
        spinner.classList.remove('visible');
      }

      function setMessage(msg, type) {
        el.textContent = msg;
        el.className = 'progress visible';
        if (type === 'error') {
          el.classList.add('error');
          hideSpinner();
        } else if (type === 'ready') {
          el.classList.add('ready');
          hideSpinner();
        }
      }

      function scheduleShow() {
        if (timer) clearTimeout(timer);
        if (!finished) {
          timer = setTimeout(showUi, showDelay);
        }
      }

      function onProgress(msg) {
        if (finished) return;

        if (msg.indexOf('Error') === 0) {
          finished = true;
          clearTimeout(timer);
          setMessage(msg, 'error');
        } else if (msg === 'Ready') {
          finished = true;
          clearTimeout(timer);
          setMessage(msg, 'ready');
        } else {
          scheduleShow();
          if (shown) {
            el.textContent = msg;
            el.className = 'progress visible';
          }
        }
      }

      // Try Tauri event listener first (push-based, instant)
      function listenProgress() {
        if (!window.__TAURI__ || !window.__TAURI__.event) {
          setTimeout(listenProgress, 100);
          return;
        }

        window.__TAURI__.event.listen('setup-progress', function (event) {
          onProgress(event.payload);
        });
      }

      // Fallback polling at slower rate for backwards compatibility
      function poll() {
        if (!window.__TAURI__ || !window.__TAURI__.core) {
          setTimeout(poll, 300);
          return;
        }

        window.__TAURI__.core.invoke('get_setup_progress')
          .then(function (msg) {
            onProgress(msg);
          })
          .catch(function () {
            // ignore — don't spam errors
          });

        if (!finished) {
          setTimeout(poll, 500);
        }
      }

      listenProgress();
      poll();
    });
  </script>
</body>
</html>
