<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rumi AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      color: #ffffff;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #7c83ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 2rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .spinner.visible {
      opacity: 1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress {
      font-size: 1rem;
      color: #b0b0b0;
      text-align: center;
      min-height: 1.5em;
      padding: 0 2rem;
      transition: color 0.3s, opacity 0.3s ease;
      opacity: 0;
    }

    .progress.visible {
      opacity: 1;
    }

    .progress.error {
      color: #ff6b6b;
    }

    .progress.ready {
      color: #69db7c;
    }
  </style>
</head>
<body>
  <div class="title">Rumi AI</div>
  <div class="spinner" id="spinner"></div>
  <div class="progress" id="progress">Initializing...</div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var el = document.getElementById('progress');
      var spinner = document.getElementById('spinner');
      var showDelay = 350; // ms — don't show spinner/progress for very fast startups
      var timer = null;
      var shown = false;
      var finished = false;

      function showUi() {
        if (shown || finished) return;
        shown = true;
        spinner.classList.add('visible');
        el.classList.add('visible');
      }

      function hideSpinner() {
        spinner.classList.remove('visible');
      }

      function setMessage(msg, type) {
        el.textContent = msg;
        el.className = 'progress visible';
        if (type === 'error') {
          el.classList.add('error');
          hideSpinner();
        } else if (type === 'ready') {
          el.classList.add('ready');
          hideSpinner();
        }
      }

      function scheduleShow() {
        if (timer) clearTimeout(timer);
        if (!finished) {
          timer = setTimeout(showUi, showDelay);
        }
      }

      function onProgress(msg) {
        if (finished) return;

        if (msg.indexOf('Error') === 0) {
          finished = true;
          clearTimeout(timer);
          setMessage(msg, 'error');
        } else if (msg === 'Ready') {
          finished = true;
          clearTimeout(timer);
          setMessage(msg, 'ready');
        } else {
          scheduleShow();
          if (shown) {
            el.textContent = msg;
            el.className = 'progress visible';
          }
        }
      }

      // Try Tauri event listener first (push-based, instant)
      function listenProgress() {
        if (!window.__TAURI__ || !window.__TAURI__.event) {
          setTimeout(listenProgress, 100);
          return;
        }

        window.__TAURI__.event.listen('setup-progress', function (event) {
          onProgress(event.payload);
        });
      }

      // Fallback polling at slower rate for backwards compatibility
      function poll() {
        if (!window.__TAURI__ || !window.__TAURI__.core) {
          setTimeout(poll, 300);
          return;
        }

        window.__TAURI__.core.invoke('get_setup_progress')
          .then(function (msg) {
            onProgress(msg);
          })
          .catch(function () {
            // ignore — don't spam errors
          });

        if (!finished) {
          setTimeout(poll, 500);
        }
      }

      listenProgress();
      poll();
    });
  </script>
</body>
</html>
