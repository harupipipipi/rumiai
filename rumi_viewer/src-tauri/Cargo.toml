[package]
name = "rumi-viewer"
version = "1.0.0-beta.1"
edition = "2021"

[lib]
name = "rumi_viewer_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
semver = "1"
open = "5"
rand = "0.8"
which = "7"
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.2"
