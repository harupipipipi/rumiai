<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Tobkiri Launcher</title>
    <style>
      html {
        background: #0a0a0a;
        color: #f5f5f5;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: inherit;
        color: inherit;
      }

      #root {
        min-height: 100vh;
        background: inherit;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var themes = {
          Rumi: 'theme-rumi',
          Minimal: 'theme-minimal',
          Standard: 'theme-standard',
          Rounded: 'theme-rounded'
        };
        var theme = 'Rumi';
        var mode = 'dark';

        try {
          var storedTheme = localStorage.getItem('tobkiri-theme');
          var storedMode = localStorage.getItem('tobkiri-color-mode');
          if (storedTheme === null) {
            var legacyTheme = localStorage.getItem('rumi-theme');
            if (themes[legacyTheme]) {
              storedTheme = legacyTheme;
              try { localStorage.setItem('tobkiri-theme', legacyTheme); } catch (error) {}
            }
          }
          if (storedMode === null) {
            var legacyMode = localStorage.getItem('rumi-color-mode');
            if (legacyMode === 'light' || legacyMode === 'dark') {
              storedMode = legacyMode;
              try { localStorage.setItem('tobkiri-color-mode', legacyMode); } catch (error) {}
            }
          }
          if (themes[storedTheme]) theme = storedTheme;
          if (storedMode === 'light' || storedMode === 'dark') mode = storedMode;
        } catch (error) {
          theme = 'Rumi';
          mode = 'dark';
        }

        root.classList.add(themes[theme]);
        if (mode === 'dark') {
          root.classList.add('dark');
        }
        root.style.colorScheme = mode;
        root.style.backgroundColor = mode === 'light' && theme === 'Rounded' ? '#f0f4f9' : mode === 'light' ? '#ffffff' : '#0a0a0a';
        root.style.color = mode === 'light' ? '#111827' : '#f5f5f5';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
