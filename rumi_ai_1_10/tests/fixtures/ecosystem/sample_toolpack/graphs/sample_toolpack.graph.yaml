graph_id: sample_toolpack_to_default_agent
version: rumi.graph.v1

display_name:
  en: Sample Toolpack to Default Agent

nodes:
  - id: start
    ref: rumi.start
  - id: agent
    ref: defaultspack.agent
  - id: ai
    ref: defaultspack.ai_client
  - id: sample_search
    ref: sample_toolpack.search

edges:
