version: 1
owner: quality-pack
description: |
  手動回帰シナリオ台帳の第4弾。承認境界・ネットワーク境界・Fail-Soft・UI操作性・監査追跡性を
  細粒度で固定化し、品質ゲートの失敗を現場で即切り分けできる状態を維持する。
scenarios:
  - id: b4-al-001
    layer: security-permission
    risk: approval-status-race
    reproduce: "pending packを一覧表示中に別端末でapproveして再実行"
    expected: "最終状態がapprovedへ収束し矛盾しない"
    triage: "approval managerの読み込み順と再取得処理を確認"
  - id: b4-al-002
    layer: security-permission
    risk: approval-reject-race
    reproduce: "approve直後にrejectを実行して状態を確認"
    expected: "最終操作に一致した単一状態"
    triage: "状態遷移の排他制御と永続化順序を確認"
  - id: b4-al-003
    layer: security-permission
    risk: approve-without-hash
    reproduce: "ハッシュ未計算のpackをapproveしようとする"
    expected: "承認拒否または事前検証エラー"
    triage: "approve前検証フックを確認"
  - id: b4-al-004
    layer: security-permission
    risk: modified-pack-reapproval-gap
    reproduce: "modified判定後に再承認せず実行"
    expected: "実行拒否と再承認要求"
    triage: "modified statusと実行ガード条件を確認"
  - id: b4-al-005
    layer: security-permission
    risk: approval-log-missing-actor
    reproduce: "承認操作後に監査ログのactor項目を確認"
    expected: "実行主体が監査ログに残る"
    triage: "audit payloadのactor設定を確認"
  - id: b4-al-006
    layer: security-permission
    risk: approval-log-missing-target
    reproduce: "承認操作後にtarget pack_idの有無を確認"
    expected: "対象packが監査ログで追跡可能"
    triage: "event payloadのtargetを確認"
  - id: b4-al-007
    layer: security-permission
    risk: stale-approved-cache
    reproduce: "承認直後に実行して古いpending情報が使われる"
    expected: "最新承認状態で判定"
    triage: "承認キャッシュ無効化の実装を確認"
  - id: b4-al-008
    layer: security-permission
    risk: stale-rejected-cache
    reproduce: "reject直後に実行要求"
    expected: "拒否状態が即時反映される"
    triage: "status cache再読み込みを確認"
  - id: b4-al-009
    layer: security-permission
    risk: preauth-approve-leak
    reproduce: "pre-auth経路から承認操作を試みる"
    expected: "未認証では承認不可"
    triage: "pre-auth route tableに承認系が含まれないことを確認"
  - id: b4-al-010
    layer: security-permission
    risk: malformed-pack-id-on-approve
    reproduce: "承認APIに不正pack_idを渡す"
    expected: "400で拒否"
    triage: "pack_id validationの共通経路を確認"
  - id: b4-al-011
    layer: security-permission
    risk: uppercase-pack-id-compat
    reproduce: "大文字混在pack_idで承認/拒否"
    expected: "規約に沿って拒否または正規化"
    triage: "ID正規化ルールを確認"
  - id: b4-al-012
    layer: security-permission
    risk: unicode-pack-id
    reproduce: "非ASCII pack_idで承認操作"
    expected: "許可仕様外なら明示的に拒否"
    triage: "バリデーションの文字種制限を確認"
  - id: b4-al-013
    layer: security-permission
    risk: reapprove-without-diff-review
    reproduce: "modified packを差分確認なしで再承認"
    expected: "運用チェックでブロック"
    triage: "manual checklistの再承認項目を確認"
  - id: b4-al-014
    layer: security-permission
    risk: bulk-approve-mixed-state
    reproduce: "pendingとmodifiedを混在させた一括承認"
    expected: "状態ごとの安全判定が維持される"
    triage: "一括処理で個別判定が行われるか確認"
  - id: b4-al-015
    layer: security-permission
    risk: approve-while-scan-running
    reproduce: "pack scan中に承認操作"
    expected: "scan結果と承認結果の整合が崩れない"
    triage: "scan/approval競合時のロックを確認"
  - id: b4-al-016
    layer: security-permission
    risk: reject-with-stale-hash
    reproduce: "古いhash情報を持ったままreject"
    expected: "状態破損なくrejectが反映"
    triage: "状態更新時の最新読込を確認"
  - id: b4-al-017
    layer: security-permission
    risk: approval-comment-loss
    reproduce: "承認理由コメントを付与して保存"
    expected: "監査に必要な文脈が保存される"
    triage: "approval metadataの保存経路を確認"
  - id: b4-al-018
    layer: security-permission
    risk: reject-reason-empty
    reproduce: "reject理由空欄で操作"
    expected: "運用上必須なら入力要求"
    triage: "reject validationポリシーを確認"
  - id: b4-al-019
    layer: security-permission
    risk: approval-timezone-skew
    reproduce: "異なるtimezone環境で承認履歴を確認"
    expected: "ISO8601で一貫表示"
    triage: "timestamp生成のtimezone処理を確認"
  - id: b4-al-020
    layer: security-permission
    risk: approval-audit-order
    reproduce: "連続承認時に監査ログ順序を確認"
    expected: "時系列で追跡可能"
    triage: "audit writerのflush順序を確認"

  - id: b4-nb-001
    layer: security-permission
    risk: domain-exact-match
    reproduce: "grant domain=api.example.comでsubdomainへ接続"
    expected: "仕様どおり許可/拒否が明確"
    triage: "domain matchingルールを確認"
  - id: b4-nb-002
    layer: security-permission
    risk: domain-case-normalization
    reproduce: "大文字ドメインでgrantし接続"
    expected: "ケース差による判定崩れなし"
    triage: "lowercase正規化の有無を確認"
  - id: b4-nb-003
    layer: security-permission
    risk: trailing-dot-domain
    reproduce: "末尾ドット付きFQDNで接続"
    expected: "正規化ルールで判定一貫"
    triage: "FQDN正規化処理を確認"
  - id: b4-nb-004
    layer: security-permission
    risk: ipv6-domain-policy
    reproduce: "IPv6 literalでの接続試行"
    expected: "許可範囲外なら拒否"
    triage: "IP表記のバリデーションを確認"
  - id: b4-nb-005
    layer: security-permission
    risk: wildcard-domain-overgrant
    reproduce: "広すぎるワイルドカードgrantを申請"
    expected: "最小権限方針で却下"
    triage: "grant審査基準を確認"
  - id: b4-nb-006
    layer: security-permission
    risk: scheme-confusion
    reproduce: "https限定grantでhttpアクセス"
    expected: "ポリシーに従い拒否"
    triage: "scheme判定有無を確認"
  - id: b4-nb-007
    layer: security-permission
    risk: port-default-implicit
    reproduce: "port未指定時の443/80既定扱いを確認"
    expected: "暗黙許可が過剰にならない"
    triage: "port解決ルールを確認"
  - id: b4-nb-008
    layer: security-permission
    risk: mixed-port-list
    reproduce: "許可portリストに異常値混在"
    expected: "不正値は拒否または除外"
    triage: "port validationを確認"
  - id: b4-nb-009
    layer: security-permission
    risk: localhost-bypass
    reproduce: "localhostへの暗黙許可の有無を確認"
    expected: "仕様外の自動許可なし"
    triage: "localhost特例ロジックを確認"
  - id: b4-nb-010
    layer: security-permission
    risk: loopback-range-bypass
    reproduce: "127.0.0.0/8範囲アクセス"
    expected: "grantなし拒否"
    triage: "IP range判定を確認"
  - id: b4-nb-011
    layer: security-permission
    risk: dns-rebind-risk
    reproduce: "許可ドメインが内部IPへ解決されるケース"
    expected: "危険経路は拒否または監査警告"
    triage: "DNS解決後のIP検証を確認"
  - id: b4-nb-012
    layer: security-permission
    risk: proxy-env-bypass
    reproduce: "HTTP_PROXY経由で未許可先へ接続"
    expected: "egress policyで拒否"
    triage: "proxy経由通信も同一判定か確認"
  - id: b4-nb-013
    layer: security-permission
    risk: ws-scheme-gap
    reproduce: "ws/wss接続時のgrant判定"
    expected: "HTTP系と同等の最小権限"
    triage: "websocket接続経路の判定を確認"
  - id: b4-nb-014
    layer: security-permission
    risk: redirect-to-ungranted
    reproduce: "許可先から未許可先へリダイレクト"
    expected: "遷移先で再判定して拒否"
    triage: "redirect追従時の再評価を確認"
  - id: b4-nb-015
    layer: security-permission
    risk: revoked-grant-stale
    reproduce: "revoke直後の接続試行"
    expected: "即時拒否"
    triage: "grant cache invalidateを確認"
  - id: b4-nb-016
    layer: security-permission
    risk: concurrent-grant-write
    reproduce: "複数プロセスでgrant更新"
    expected: "破損なく最終状態整合"
    triage: "grant保存時の排他制御を確認"
  - id: b4-nb-017
    layer: security-permission
    risk: malformed-domain-entry
    reproduce: "空白・制御文字入りdomainをgrant"
    expected: "バリデーションで拒否"
    triage: "domain sanitizerを確認"
  - id: b4-nb-018
    layer: security-permission
    risk: too-many-domains
    reproduce: "過剰件数のdomain grant申請"
    expected: "運用上限で制御"
    triage: "件数制限ポリシーを確認"
  - id: b4-nb-019
    layer: security-permission
    risk: network-audit-missing-domain
    reproduce: "network grant監査イベントのdomain欠落"
    expected: "対象domainが監査で追跡可能"
    triage: "network audit payloadを確認"
  - id: b4-nb-020
    layer: security-permission
    risk: network-audit-missing-action
    reproduce: "grant/revoke区別なく同一イベントで記録"
    expected: "操作種別が明示される"
    triage: "action fieldの記録を確認"

  - id: b4-fsr-001
    layer: failure-path
    risk: startup-partial-dependency-fail
    reproduce: "一部依存サービスを停止して起動"
    expected: "Fail-Softで縮退起動しクラッシュしない"
    triage: "startup degradation pathを確認"
  - id: b4-fsr-002
    layer: failure-path
    risk: startup-all-dependency-fail
    reproduce: "必須依存が全停止で起動"
    expected: "安全停止し原因を明示"
    triage: "fatal dependency判定を確認"
  - id: b4-fsr-003
    layer: failure-path
    risk: reload-route-file-missing
    reproduce: "route定義ファイルを削除してreload"
    expected: "旧状態維持または安全エラー"
    triage: "reload失敗時rollbackを確認"
  - id: b4-fsr-004
    layer: failure-path
    risk: reload-route-file-malformed
    reproduce: "route YAMLを壊してreload"
    expected: "不正設定の反映拒否"
    triage: "parser error handlingを確認"
  - id: b4-fsr-005
    layer: failure-path
    risk: auth-header-empty
    reproduce: "Authorization: Bearer だけを送信"
    expected: "401で拒否"
    triage: "token抽出ロジックを確認"
  - id: b4-fsr-006
    layer: failure-path
    risk: auth-header-multi-space
    reproduce: "Bearer前後に異常空白を含むヘッダ"
    expected: "曖昧な認証を拒否"
    triage: "header split処理を確認"
  - id: b4-fsr-007
    layer: failure-path
    risk: content-length-negative
    reproduce: "負のContent-Length送信"
    expected: "400で拒否"
    triage: "Content-Length境界チェックを確認"
  - id: b4-fsr-008
    layer: failure-path
    risk: content-length-overflow
    reproduce: "巨大Content-Lengthで接続"
    expected: "413または早期拒否"
    triage: "MAX_REQUEST_BODY_BYTES比較を確認"
  - id: b4-fsr-009
    layer: failure-path
    risk: socket-close-mid-body
    reproduce: "ボディ送信途中でクライアント切断"
    expected: "サーバ側が異常終了しない"
    triage: "read loopの例外処理を確認"
  - id: b4-fsr-010
    layer: failure-path
    risk: non-json-content-type
    reproduce: "Content-Type text/plainでJSON相当API呼び出し"
    expected: "明示エラーまたは安全な拒否"
    triage: "content type判定方針を確認"
  - id: b4-fsr-011
    layer: failure-path
    risk: missing-required-field
    reproduce: "必須フィールド欠落JSON送信"
    expected: "400と不足項目情報"
    triage: "payload validationメッセージを確認"
  - id: b4-fsr-012
    layer: failure-path
    risk: null-required-field
    reproduce: "必須フィールドにnull送信"
    expected: "型不一致として拒否"
    triage: "schema/type guardを確認"
  - id: b4-fsr-013
    layer: failure-path
    risk: duplicate-request-replay
    reproduce: "同一更新リクエストを短時間連打"
    expected: "状態破損しない"
    triage: "idempotency要件と実装差分を確認"
  - id: b4-fsr-014
    layer: failure-path
    risk: stale-frontend-config
    reproduce: "古いfrontend build成果物で起動"
    expected: "不整合を検知し再build案内"
    triage: "artifact同期手順を確認"
  - id: b4-fsr-015
    layer: failure-path
    risk: strict-mode-without-docker
    reproduce: "strict modeでdocker未起動"
    expected: "実行拒否と明示メッセージ"
    triage: "strict mode prerequisite checkを確認"
  - id: b4-fsr-016
    layer: failure-path
    risk: permissive-mode-unintended
    reproduce: "想定外環境でpermissiveが有効"
    expected: "運用チェックで検知"
    triage: "起動引数と環境条件を確認"
  - id: b4-fsr-017
