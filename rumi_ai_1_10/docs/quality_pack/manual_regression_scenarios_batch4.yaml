  - id: b4-fsr-018
    layer: failure-path
    risk: flow-size-near-limit
    reproduce: "上限直下サイズのflow読み込み"
    expected: "境界値で正しく許可"
    triage: "size checkの>=条件を確認"
  - id: b4-fsr-019
    layer: failure-path
    risk: flow-size-over-limit
    reproduce: "上限+1バイトのflow読み込み"
    expected: "明示拒否"
    triage: "エラーメッセージの可読性を確認"
  - id: b4-fsr-020
    layer: failure-path
    risk: fallback-path-hidden
    reproduce: "fallback実行時にログ不足"
    expected: "fallback理由が診断可能"
    triage: "fallback log messageを確認"

  - id: b4-uio-001
    layer: frontend-ui
    risk: setup-first-render
    reproduce: "初回起動直後のSetup画面表示"
    expected: "白画面なしで必要入力が表示"
    triage: "初期データフェッチ失敗時の分岐を確認"
  - id: b4-uio-002
