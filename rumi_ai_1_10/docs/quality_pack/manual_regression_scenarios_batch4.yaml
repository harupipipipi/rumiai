  - id: b4-at-001
    layer: audit-readiness
    risk: missing-command-evidence
    reproduce: "PR本文に実行コマンドを省略"
    expected: "レビューで差し戻し"
    triage: "検証コマンド一覧を必須化"
  - id: b4-at-002
