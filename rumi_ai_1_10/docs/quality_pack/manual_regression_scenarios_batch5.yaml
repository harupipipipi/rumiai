version: 1
owner: quality-pack
description: |
  手動回帰シナリオ台帳の第5弾。Pack API の主要GET/POST/PUT/DELETE経路と
  pre-auth境界、承認境界、ルート再読込、Flow実行、監査可観測性を重点化する。
  ルート単位の「認証」「入力境界」「失敗時UX」「監査追跡」を固定化する。
scenarios:
  - id: b5-get-001
    layer: security-permission
    risk: health-route-regression
    reproduce: "GET /health"
    expected: "200 と health payload を返す"
    triage: "app_lifecycle_manager 不在時フォールバックを確認"
  - id: b5-get-002
    layer: failure-path
    risk: health-route-degraded
    reproduce: "lifecycle manager を無効化して GET /health"
    expected: "needs_setup を含む fail-soft payload"
    triage: "health branch の fallback 内容を確認"
  - id: b5-get-003
    layer: security-permission
    risk: setup-status-preauth
    reproduce: "Authorization なしで GET /api/setup/status"
    expected: "401 ではなく setup status を返す"
    triage: "pre_auth_routes と do_GET pre-auth 分岐を確認"
  - id: b5-get-004
    layer: failure-path
    risk: setup-status-missing-lifecycle
    reproduce: "lifecycle manager なしで GET /api/setup/status"
    expected: "needs_setup=true の安全応答"
    triage: "check_setup_status fallback を確認"
  - id: b5-get-005
    layer: security-permission
    risk: setup-oauth-start-preauth
    reproduce: "Authorization なしで GET /api/setup/oauth/start"
    expected: "認証なしで開始できる"
    triage: "oauth_start pre-auth 経路を確認"
  - id: b5-get-006
    layer: failure-path
    risk: setup-oauth-start-exception
    reproduce: "oauth start 内部例外を発生"
    expected: "500 safe error"
    triage: "_log_internal_error(oauth_start) の記録を確認"
  - id: b5-get-007
    layer: security-permission
    risk: callback-preauth
    reproduce: "Authorization なしで GET /callback?code=x&state=y"
    expected: "setup へ redirect"
    triage: "callback pre-auth 分岐と redirect 処理を確認"
  - id: b5-get-008
    layer: failure-path
    risk: callback-exception
    reproduce: "callback 内部例外を発生"
    expected: "/setup?error=internal_error へ redirect"
    triage: "_oauth_send_redirect fallback を確認"
