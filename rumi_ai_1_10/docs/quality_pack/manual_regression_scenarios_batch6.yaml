version: 1
owner: quality-pack
description: |
  手動回帰シナリオ台帳の第6弾。frontend UX 契約（Setup/Dashboard/Packs/PackDetail/Flows/Settings）を
  画面状態・導線・失敗表示・操作継続性の観点で固定化する。
scenarios:
  - id: b6-ui-001
    layer: frontend-ui
    risk: setup-initial-render
    reproduce: "初回表示で /panel/setup を開く"
    expected: "タイトル・接続ボタン・スキップボタンが表示される"
    triage: "Setup.tsx の初期レンダリング条件を確認"
  - id: b6-ui-002
    layer: frontend-ui
    risk: setup-connect-loading
    reproduce: "connect 実行中のボタン状態を確認"
    expected: "Loading表示が出て二重押下できない"
    triage: "loading state と Button disabled を確認"
  - id: b6-ui-003
    layer: failure-ux
    risk: setup-connect-error-toast
    reproduce: "connectAccount を失敗させる"
    expected: "Failed to connect トーストが表示される"
    triage: "catch節の addToast 呼び出しを確認"
  - id: b6-ui-004
    layer: frontend-ui
    risk: setup-skip-navigation
    reproduce: "Skip を押す"
    expected: "isSetupDone=true になり /panel へ遷移"
    triage: "handleSkip の store 更新と navigate を確認"
  - id: b6-ui-005
    layer: frontend-ui
    risk: setup-linked-redirect
    reproduce: "/panel/setup?linked=true を開く"
    expected: "linked表示後ダッシュボードへ自動遷移"
    triage: "searchParams linked 分岐と timer を確認"
  - id: b6-ui-006
    layer: failure-ux
    risk: setup-oauth-error-toast
    reproduce: "/panel/setup?error=access_denied を開く"
    expected: "OAuth error トーストを表示し画面は継続"
    triage: "error param 分岐を確認"
  - id: b6-ui-007
    layer: frontend-ui
    risk: setup-logo-layout-break
    reproduce: "狭幅画面で setup を表示"
    expected: "ロゴと見出しが崩れず中央揃え"
    triage: "container class のレスポンシブ挙動を確認"
  - id: b6-ui-008
