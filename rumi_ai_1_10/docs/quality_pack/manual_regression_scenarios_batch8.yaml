version: 1
owner: quality-pack
description: |
  手動回帰シナリオ台帳の第8弾。長時間運用の Fail-Soft、HMAC 移行、Store 移行、
  互換CLI、監査可観測性を強化する。
scenarios:
  - id: b8-lr-001
    layer: data-integrity
    risk: hmac-migration-command-path
    reproduce: "python -m rumi_ai migrate-hmac を実行"
    expected: "各対象ファイルの migrated/already_signed/failed が出力される"
    triage: "app.py _run_hmac_migration の集計ロジックを確認"
  - id: b8-lr-002
    layer: data-integrity
    risk: hmac-migration-failed-exit
    reproduce: "migrate-hmac で1件 failed を発生させる"
    expected: "終了コード1で終了する"
    triage: "result_counts['failed'] > 0 分岐を確認"
  - id: b8-lr-003
    layer: data-integrity
    risk: trust-store-hmac-status-missing
    reproduce: "trusted_handlers.json 署名なし状態を作る"
    expected: "hmac_status が missing を返す"
    triage: "capability_trust_store.hmac_status を確認"
  - id: b8-lr-004
    layer: data-integrity
    risk: trust-store-hmac-status-invalid
    reproduce: "trusted_handlers.json の署名改ざん状態を作る"
    expected: "hmac_status が invalid を返す"
    triage: "verify_data_hmac 分岐を確認"
  - id: b8-lr-005
    layer: data-integrity
    risk: trust-store-migrate-legacy
    reproduce: "署名なし trusted_handlers.json を migrate_hmac_signature 実行"
    expected: "migrated になる"
    triage: "migrate_legacy_file 呼び出しを確認"
  - id: b8-lr-006
    layer: data-integrity
    risk: store-sharing-hmac-status-missing
    reproduce: "sharing index の署名を除去"
    expected: "hmac_status が missing を返す"
    triage: "store_sharing_manager.hmac_status を確認"
  - id: b8-lr-007
    layer: data-integrity
    risk: store-sharing-migrate-sign
    reproduce: "署名なし sharing index で migrate_hmac_signature 実行"
    expected: "migrated を返して署名付き保存"
    triage: "_save() が _hmac_signature を付与することを確認"
  - id: b8-lr-008
    layer: data-integrity
    risk: capability-installer-index-migrate
    reproduce: "capability index の署名なし状態で migrate_hmac_signatures 実行"
    expected: "index が migrated"
    triage: "capability_installer migrate_hmac_signatures index 分岐を確認"
  - id: b8-lr-009
    layer: data-integrity
    risk: capability-installer-blocked-migrate
    reproduce: "blocked.json 署名なし状態で migrate_hmac_signatures 実行"
    expected: "blocked が migrated"
    triage: "blocked 分岐と _save_blocked を確認"
  - id: b8-lr-010
    layer: data-integrity
    risk: active-ecosystem-migrate
    reproduce: "active_ecosystem.json 署名なし状態で migrate_hmac_signature 実行"
    expected: "migrated を返す"
    triage: "active_ecosystem.migrate_hmac_signature を確認"
  - id: b8-lr-011
    layer: data-integrity
    risk: active-ecosystem-invalid-signature
    reproduce: "active_ecosystem.json の署名改ざん"
    expected: "migrate_hmac_signature が failed を返す"
    triage: "hmac_status invalid 分岐を確認"
  - id: b8-lr-012
    layer: data-integrity
    risk: store-migration-skip-existing-db
    reproduce: "stores.db 既存状態で migrate_json_to_sqlite 実行"
    expected: "False でスキップ"
    triage: "db_path.exists 分岐を確認"
  - id: b8-lr-013
    layer: data-integrity
    risk: store-migration-skip-no-index
    reproduce: "index.json 不在状態で migrate_json_to_sqlite 実行"
    expected: "False でスキップ"
    triage: "index_path.exists 分岐を確認"
  - id: b8-lr-014
    layer: data-integrity
    risk: store-migration-atomic-rename
    reproduce: "migration 成功時のファイル生成を確認"
    expected: "stores.db.tmp から os.replace で原子的に切替"
    triage: "store_migration os.replace を確認"
  - id: b8-lr-015
    layer: data-integrity
    risk: store-migration-keeps-json
    reproduce: "migration 後 index.json の扱いを確認"
    expected: "json は削除されずロールバック用途で残る"
    triage: "store_migration コメントと処理を確認"
  - id: b8-lr-016
    layer: data-integrity
    risk: store-migration-user-version
    reproduce: "migration 成功後の user_version を確認"
    expected: "PRAGMA user_version=1"
    triage: "conn.execute user_version 設定を確認"
  - id: b8-lr-017
    layer: data-integrity
    risk: store-migration-bad-json-file
    reproduce: "不正JSONデータファイルを混在させる"
    expected: "warning を出して他キー移行を継続"
    triage: "json.JSONDecodeError handling を確認"
  - id: b8-lr-018
    layer: data-integrity
    risk: store-migration-failure-cleanup
    reproduce: "migration 中に例外を発生"
    expected: "tmp が削除され False を返す"
    triage: "except 節の tmp_path.unlink を確認"
  - id: b8-lr-019
    layer: data-integrity
    risk: cleanup-stale-tmp
    reproduce: "stores.db.tmp が残った状態で cleanup_stale_tmp 実行"
    expected: "stale tmp が削除される"
    triage: "cleanup_stale_tmp の unlink を確認"
  - id: b8-lr-020
    layer: data-integrity
    risk: cleanup-stale-tmp-fail-soft
    reproduce: "unlink 失敗を発生"
    expected: "warning ログで継続"
    triage: "cleanup_stale_tmp OSError handling を確認"
  - id: b8-lr-021
    layer: data-integrity
    risk: shared-dict-snapshot-journal-consistency
    reproduce: "shared_dict snapshot/journal を連続更新"
    expected: "不整合なく読み戻せる"
    triage: "shared_dict snapshot/journal/resolver の整合を確認"
  - id: b8-lr-022
    layer: data-integrity
    risk: secrets-grant-file-hmac
    reproduce: "secrets grant ファイルの署名状態を確認"
    expected: "署名検証失敗時は fail-safe 側に倒れる"
    triage: "secrets_grant_manager の検証経路を確認"
  - id: b8-lr-023
    layer: data-integrity
    risk: capability-trust-file-absent
    reproduce: "trust file 不在状態"
    expected: "hmac_status=absent"
    triage: "trust_store hmac_status absent 分岐を確認"
  - id: b8-lr-024
    layer: data-integrity
    risk: capability-trust-signed-state
    reproduce: "正常署名済み trust file を読み込み"
    expected: "hmac_status=signed"
    triage: "verify_data_hmac 成功分岐を確認"
  - id: b8-lr-025
    layer: data-integrity
    risk: migrate-hmac-summary-accuracy
    reproduce: "各ステータス混在で migrate-hmac 実行"
    expected: "summary 数値が実測と一致"
    triage: "result_counts 加算ロジックを確認"

  - id: b8-lr-026
    layer: recovery
    risk: startup-no-http-fallback
    reproduce: "io.http.server 未登録状態で app 起動"
    expected: "fallback メッセージを出して待機継続"
    triage: "app.py no_http 分岐を確認"
  - id: b8-lr-027
    layer: recovery
    risk: startup-pack-api-fallback
    reproduce: "pack_api_server が先行起動済みの状態"
    expected: "http://host:port 表示で待機継続"
    triage: "get_pack_api_server fallback を確認"
  - id: b8-lr-028
    layer: recovery
    risk: startup-validate-host-execution-guard-soft
    reproduce: "preflight validate_host_execution で例外発生"
    expected: "debug ログのみで起動継続"
    triage: "except Exception の継続分岐を確認"
  - id: b8-lr-029
    layer: recovery
    risk: startup-mark-ecosystem-init-soft
    reproduce: "mark_ecosystem_initialized 失敗を発生"
    expected: "debug ログで継続"
    triage: "app.py try/except を確認"
  - id: b8-lr-030
    layer: recovery
    risk: startup-restart-request-exit42
    reproduce: "control panel から restart request を送る"
    expected: "SystemExit(42) で再起動要求"
    triage: "_wait_for_signal と _RESTART_EXIT_CODE を確認"
  - id: b8-lr-031
    layer: recovery
    risk: permissive-warning-loop
    reproduce: "--permissive で起動"
    expected: "30秒間隔 warning を継続出力"
    triage: "_start_permissive_warning_loop を確認"
  - id: b8-lr-032
    layer: recovery
    risk: health-mode-early-exit
    reproduce: "--health 実行"
    expected: "aggregate_health を出力して終了"
    triage: "args.health early exit 分岐を確認"
  - id: b8-lr-033
    layer: recovery
    risk: validate-mode-early-exit
    reproduce: "--validate 実行"
    expected: "validate report 出力して終了"
    triage: "args.validate early exit 分岐を確認"
  - id: b8-lr-034
    layer: recovery
    risk: migrate-mode-early-exit
    reproduce: "migrate-hmac 実行"
    expected: "migration 完了後に通常起動へ進まない"
    triage: "args.command migrate-hmac 分岐を確認"
  - id: b8-lr-035
    layer: recovery
    risk: missing-critical-dependency-stop
    reproduce: "yaml/cryptography 片方不在にして起動"
    expected: "FATAL 表示して即終了"
    triage: "_check_critical_dependencies を確認"
  - id: b8-lr-036
    layer: recovery
    risk: fallback-http-inspection-fail-soft
    reproduce: "pack_api_server fallback inspection で例外発生"
    expected: "debug ログで no_http メッセージへフォールバック"
    triage: "fallback inspection except 節を確認"
  - id: b8-lr-037
    layer: recovery
    risk: store-migration-partial-read-fail-soft
    reproduce: "store_root 配下の一部ファイル読み取り失敗"
    expected: "warning でスキップし他データ移行継続"
    triage: "store_migration continue 分岐を確認"
  - id: b8-lr-038
    layer: recovery
    risk: capability-proxy-init-fail-soft
    reproduce: "capability proxy 初期化失敗を発生"
    expected: "診断記録して起動継続"
    triage: "kernel_core _get_capability_proxy except を確認"
  - id: b8-lr-039
    layer: recovery
    risk: uds-proxy-init-fail-soft
    reproduce: "uds proxy 初期化失敗を発生"
    expected: "診断記録して起動継続"
    triage: "kernel_core _get_uds_proxy_manager except を確認"
  - id: b8-lr-040
    layer: recovery
    risk: env-tamper-restore
    reproduce: "component 実行中に RUMI_SECURITY_MODE 改ざん"
    expected: "警告ログと復元が行われる"
    triage: "component_lifecycle _restore_env を確認"
  - id: b8-lr-041
    layer: recovery
    risk: syspath-shadow-block-recovery
    reproduce: "component path に os.py を置く"
    expected: "sys.path追加を拒否し他処理継続"
    triage: "_has_shadow_module と security audit を確認"
  - id: b8-lr-042
    layer: recovery
    risk: component-reload-in-use-guard
    reproduce: "使用中 component の reload を実行"
    expected: "failed を返し無理にreloadしない"
    triage: "reload_component usage guard を確認"
  - id: b8-lr-043
    layer: recovery
    risk: component-drain-timeout
    reproduce: "drain timeout ケースを発生"
    expected: "False を返しハングしない"
    triage: "drain timeout loop を確認"
  - id: b8-lr-044
    layer: recovery
    risk: active-ecosystem-atomic-fallback
    reproduce: "atomic write 失敗を発生"
    expected: "direct write fallback で保存継続"
    triage: "active_ecosystem _save_config_internal を確認"
  - id: b8-lr-045
    layer: recovery
    risk: hmac-invalid-stop-migration
    reproduce: "invalid 署名ファイルで migrate 実行"
    expected: "failed として扱い安全側で停止"
    triage: "migrate_hmac_signature invalid 分岐を確認"

  - id: b8-lr-046
    layer: observability
    risk: startup-warning-banner-permissive
    reproduce: "--permissive 起動ログを確認"
    expected: "WARNING banner が明示される"
    triage: "app.py print WARNING ブロックを確認"
  - id: b8-lr-047
    layer: observability
    risk: health-output-structure
    reproduce: "--health 出力JSONを確認"
    expected: "status を含む構造で返る"
    triage: "aggregate_health 結果出力を確認"
  - id: b8-lr-048
    layer: observability
    risk: validate-output-summary
