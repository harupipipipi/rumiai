    reproduce: "store migration 実行時ログを確認"
    expected: "Starting JSON -> SQLite migration ログが出る"
    triage: "store_migration logger.info を確認"
  - id: b8-lr-051
    layer: observability
    risk: store-migration-complete-log
    reproduce: "store migration 成功時ログを確認"
    expected: "migrated stores/keys 件数が出る"
    triage: "logger.info completion を確認"
  - id: b8-lr-052
    layer: observability
    risk: store-migration-fail-log
    reproduce: "migration 失敗ケース"
    expected: "Migration failed が stacktrace付きで出る"
    triage: "logger.error(exc_info=True) を確認"
  - id: b8-lr-053
    layer: observability
    risk: proxy-init-failure-diagnostics
    reproduce: "uds/capability init fail を発生"
    expected: "diagnostics に failed step が記録される"
    triage: "kernel_core diagnostics.record_step を確認"
  - id: b8-lr-054
    layer: observability
    risk: env-tamper-audit-event
    reproduce: "env tamper を発生"
    expected: "env_var_tamper_detected 監査イベントが記録される"
    triage: "component_lifecycle audit_logger 呼び出しを確認"
  - id: b8-lr-055
    layer: observability
    risk: shadow-module-audit-event
    reproduce: "module shadow を発生"
    expected: "syspath_shadow_blocked 監査イベントが記録される"
    triage: "component_lifecycle get_audit_logger 呼び出しを確認"
  - id: b8-lr-056
    layer: observability
    risk: no-http-guidance-message
    reproduce: "http server 不在起動"
    expected: "install_http_pack ガイダンスが表示される"
    triage: "startup no_http メッセージを確認"
  - id: b8-lr-057
    layer: observability
    risk: fallback-api-running-message
    reproduce: "pack_api_server 起動済みで起動"
    expected: "Pack API server running on ... が表示される"
    triage: "fallback print を確認"
  - id: b8-lr-058
    layer: observability
    risk: startup-success-message
    reproduce: "通常起動成功"
    expected: "startup.success メッセージが表示される"
    triage: "app.py startup success 出力を確認"
  - id: b8-lr-059
    layer: observability
    risk: shutdown-starting-message
    reproduce: "Ctrl+C または restart で停止"
    expected: "shutdown.starting メッセージが出る"
    triage: "KeyboardInterrupt/_wait_for_signal 分岐を確認"
  - id: b8-lr-060
    layer: observability
    risk: health-exit-code-trace
    reproduce: "--health で失敗statusを返すケース"
    expected: "exit code 1"
    triage: "sys.exit(0 if status == UP else 1) を確認"

  - id: b8-lr-061
    layer: compatibility
    risk: cli-migrate-command-compat
    reproduce: "python -m rumi_ai migrate-hmac を実行"
    expected: "現行エントリポイント経由で app.main が処理"
    triage: "rumi_ai/__main__.py と app.py 分岐を確認"
  - id: b8-lr-062
    layer: compatibility
    risk: cli-health-command-compat
    reproduce: "python -m rumi_ai --health 実行"
    expected: "互換エントリポイントで health mode が動作"
    triage: "root entrypoint -> app.main 経路を確認"
  - id: b8-lr-063
    layer: compatibility
    risk: cli-validate-command-compat
    reproduce: "python -m rumi_ai --validate 実行"
    expected: "validate mode が動作"
    triage: "args.validate 分岐を確認"
  - id: b8-lr-064
    layer: compatibility
    risk: migrate-flag-compat
    reproduce: "--migrate-trust-store-hmac 実行"
    expected: "migrate-hmac と同等に処理される"
    triage: "args.migrate_trust_store_hmac 分岐を確認"
  - id: b8-lr-065
    layer: compatibility
    risk: security-mode-default-strict
    reproduce: "環境変数なし通常起動"
    expected: "RUMI_SECURITY_MODE が strict"
    triage: "os.environ.setdefault('RUMI_SECURITY_MODE','strict') を確認"
  - id: b8-lr-066
    layer: compatibility
    risk: permissive-env-optin-compat
    reproduce: "RUMI_ENVIRONMENT=development + permissive.lock で --permissive"
    expected: "起動許可される"
    triage: "_check_permissive_production_guard 条件を確認"
  - id: b8-lr-067
    layer: compatibility
    risk: permissive-optin-reject-compat
    reproduce: "opt-inなしで --permissive"
    expected: "FATAL で拒否"
    triage: "_check_permissive_production_guard env 条件を確認"
  - id: b8-lr-068
    layer: compatibility
    risk: permissive-lockfile-reject-compat
    reproduce: "env opt-inありだが lockfile 無しで --permissive"
    expected: "FATAL lockfile required で拒否"
    triage: "lockfile is_file 分岐を確認"
  - id: b8-lr-069
    layer: compatibility
    risk: health-disk-path-windows-compat
    reproduce: "Windows相当環境で --health"
    expected: "SystemDrive を使用して probe"
    triage: "os.name == nt 分岐を確認"
  - id: b8-lr-070
    layer: compatibility
    risk: health-disk-path-unix-compat
    reproduce: "Unix相当環境で --health"
    expected: "disk path '/' を使用"
    triage: "else 分岐を確認"

  - id: b8-lr-071
    layer: failure-path
    risk: trust-file-parse-failure
    reproduce: "trust file を壊れたJSONにする"
    expected: "load_error 設定で拒否"
    triage: "capability_trust_store parse error handling を確認"
  - id: b8-lr-072
    layer: failure-path
    risk: trust-file-object-type-check
