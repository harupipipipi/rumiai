  - id: b8-lr-079
    layer: failure-path
    risk: startup-http-server-override-lookup-fail
    reproduce: "get_interface_override 例外を発生"
    expected: "debug ログで継続"
    triage: "override lookup except 節を確認"
  - id: b8-lr-080
    layer: failure-path
    risk: startup-http-server-handler-fail
    reproduce: "http_server callable 内で例外発生"
    expected: "startup.failed 経路で終了"
    triage: "main 全体 except を確認"
  - id: b8-lr-081
    layer: failure-path
    risk: health-probe-writable-fail
    reproduce: "tmp 書き込み不可環境で --health"
    expected: "writable probe failure が反映される"
