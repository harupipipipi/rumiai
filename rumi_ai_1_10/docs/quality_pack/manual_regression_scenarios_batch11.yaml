version: 1
owner: quality-pack
description: |
  手動回帰シナリオ台帳の第11弾。runtime 境界（pack_api/egress/capability/startup/active ecosystem）
  の失敗系・観測性・復旧導線を高密度に監査し、Fail-Soft と最小権限の回帰を検知する。
scenarios:
  - id: b11-rt-001
    layer: failure-path
    risk: pack-api-preauth-body-parse-fail
    reproduce: "POST /api/setup/complete に不正JSONを送る"
    expected: "400 で安全に失敗し、サーバープロセスは継続する"
    triage: "core_runtime/pack_api_server.py do_POST/_parse_body を確認"
  - id: b11-rt-002
    layer: failure-path
    risk: pack-api-unauthorized-post
    reproduce: "認証ヘッダなしで保護POST APIへアクセス"
    expected: "401 を返し接続が不安定化しない"
    triage: "core_runtime/pack_api_server.py _check_auth と do_POST を確認"
  - id: b11-rt-003
    layer: failure-path
    risk: pack-api-unauthorized-put
    reproduce: "認証ヘッダなしで保護PUT APIへアクセス"
    expected: "401 を返しプロセス継続"
    triage: "pack_api_server.py do_PUT を確認"
  - id: b11-rt-004
    layer: failure-path
    risk: pack-api-unauthorized-delete
    reproduce: "認証ヘッダなしで保護DELETE APIへアクセス"
    expected: "401 を返しプロセス継続"
    triage: "pack_api_server.py do_DELETE を確認"
  - id: b11-rt-005
    layer: failure-path
    risk: pack-api-rate-limit-throttle
    reproduce: "短時間に連続リクエストを送信"
    expected: "rate limit 応答となりサーバー停止しない"
    triage: "pack_api_server.py _check_rate_limit を確認"
  - id: b11-rt-006
    layer: failure-path
    risk: pack-api-invalid-pack-id
    reproduce: "grant APIへ不正 pack_id を送信"
    expected: "400 Invalid pack_id"
    triage: "pack_api_server.py _validate_pack_id を確認"
  - id: b11-rt-007
    layer: failure-path
    risk: pack-api-missing-required-field
    reproduce: "必須フィールド欠落で POST /api/network/grant"
    expected: "400 を返し監査記録可能"
    triage: "pack_api_server.py _network_grant path を確認"
  - id: b11-rt-008
    layer: failure-path
    risk: pack-api-unmatched-route-get
    reproduce: "未定義 GET ルートへアクセス"
    expected: "404 Not found"
    triage: "pack_api_server.py do_GET unmatched path 処理を確認"
  - id: b11-rt-009
    layer: failure-path
    risk: pack-api-unmatched-route-post
    reproduce: "未定義 POST ルートへアクセス"
    expected: "404 か明示エラーを返す"
    triage: "pack_api_server.py _dispatch_api_route を確認"
  - id: b11-rt-010
    layer: failure-path
    risk: pack-api-large-body-limit
    reproduce: "制限超過サイズの body を送信"
    expected: "413/400で拒否しメモリ圧迫しない"
    triage: "pack_api_server.py _parse_body 制限を確認"
  - id: b11-rt-011
    layer: failure-path
    risk: egress-internal-ip-block
    reproduce: "egress で 127.0.0.1 宛て通信を要求"
    expected: "security policy で拒否"
    triage: "core_runtime/egress_proxy.py is_internal_ip 経路を確認"
  - id: b11-rt-012
    layer: failure-path
    risk: egress-private-network-block
    reproduce: "egress で private subnet 宛て通信を要求"
    expected: "拒否され audit に理由が残る"
    triage: "egress_proxy.py BLOCKED_IPV4_NETWORKS を確認"
  - id: b11-rt-013
    layer: failure-path
    risk: egress-dns-rebinding-block
    reproduce: "外部ドメインが内部IPへ解決されるケースを再現"
    expected: "DNS rebinding 対策で拒否"
    triage: "egress_proxy.py resolve_and_check_ip を確認"
  - id: b11-rt-014
    layer: failure-path
    risk: egress-redirect-over-limit
    reproduce: "4hop以上の redirect を返す先へ通信"
    expected: "redirect 上限で失敗"
    triage: "egress_proxy.py MAX_REDIRECTS を確認"
  - id: b11-rt-015
    layer: failure-path
    risk: egress-method-not-allowed
    reproduce: "許可されない HTTP method で要求"
    expected: "method 制限で拒否"
    triage: "egress_protocol.py ALLOWED_METHODS を確認"
  - id: b11-rt-016
    layer: failure-path
    risk: egress-header-count-over
    reproduce: "ヘッダ数超過の要求を送る"
    expected: "request validation で拒否"
    triage: "egress_protocol.py MAX_HEADER_COUNT を確認"
  - id: b11-rt-017
    layer: failure-path
    risk: egress-header-name-too-long
    reproduce: "過長ヘッダ名を送る"
    expected: "validation error"
    triage: "egress_protocol.py MAX_HEADER_NAME_LENGTH を確認"
  - id: b11-rt-018
    layer: failure-path
    risk: egress-header-value-too-long
    reproduce: "過長ヘッダ値を送る"
    expected: "validation error"
    triage: "egress_protocol.py MAX_HEADER_VALUE_LENGTH を確認"
  - id: b11-rt-019
    layer: failure-path
    risk: egress-response-size-limit
    reproduce: "巨大レスポンスを返す先へ通信"
    expected: "サイズ制限で失敗しOOMしない"
    triage: "egress_proxy.py MAX_RESPONSE_SIZE を確認"
  - id: b11-rt-020
    layer: failure-path
    risk: egress-connect-timeout
    reproduce: "接続不能先へ通信し timeout を誘発"
    expected: "timeout で失敗しプロキシ継続"
    triage: "egress_proxy.py DEFAULT_CONNECT_TIMEOUT を確認"
  - id: b11-rt-021
    layer: failure-path
    risk: egress-read-timeout
    reproduce: "応答遅延先へ通信し read timeout を誘発"
    expected: "timeout で失敗し継続"
    triage: "egress_proxy.py DEFAULT_READ_TIMEOUT を確認"
  - id: b11-rt-022
    layer: failure-path
    risk: egress-rate-limit-per-pack
    reproduce: "単一packで連続大量送信"
    expected: "レート制限で抑止"
    triage: "egress_rate_limiter.py PackRateLimiter を確認"
  - id: b11-rt-023
    layer: failure-path
    risk: egress-domain-blacklist
    reproduce: "blacklist対象ドメインへ通信"
    expected: "deny 応答"
    triage: "egress_domain_controller.py を確認"
  - id: b11-rt-024
    layer: failure-path
    risk: capability-invalid-json-request
    reproduce: "capability proxy に壊れたJSONを送信"
    expected: "Invalid request 応答"
    triage: "capability_proxy.py _PrincipalHandler.handle を確認"
  - id: b11-rt-025
    layer: failure-path
    risk: capability-request-too-large
    reproduce: "MAX_REQUEST_SIZE超過 payload を送る"
    expected: "受理拒否される"
    triage: "capability_proxy.py _read_length_prefixed を確認"
  - id: b11-rt-026
    layer: failure-path
    risk: capability-socket-permission-failure
    reproduce: "chmod/chown 失敗環境で proxy 起動"
    expected: "例外を握りつぶし warning audit のみ"
    triage: "capability_proxy.py _apply_socket_permissions を確認"
  - id: b11-rt-027
    layer: failure-path
    risk: startup-http-override-lookup-fail
    reproduce: "interface override lookup で例外を発生"
    expected: "debug log のみで通常取得へフォールバック"
    triage: "app.py HTTP server override block を確認"
  - id: b11-rt-028
    layer: failure-path
    risk: startup-pack-api-fallback-fail
    reproduce: "pack_api_server fallback inspection で例外"
    expected: "no_http メッセージ表示で待機継続"
    triage: "app.py fallback inspection block を確認"
  - id: b11-rt-029
    layer: failure-path
    risk: active-ecosystem-invalid-json
    reproduce: "active_ecosystem.json を壊して起動"
    expected: "default config へフォールバック"
    triage: "active_ecosystem.py _load_config を確認"
  - id: b11-rt-030
