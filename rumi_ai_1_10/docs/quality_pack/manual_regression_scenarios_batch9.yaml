version: 1
owner: quality-pack
description: |
  手動回帰シナリオ台帳の第9弾。認証境界・権限境界・承認整合・監査追跡を重点化し、
  悪意Pack前提と最小権限の逸脱を早期検知する。
scenarios:
  - id: b9-sp-001
    layer: security-permission
    risk: preauth-health-only
    reproduce: "認証なしで GET /health を実行する"
    expected: "200 で health 応答、認証要求されない"
    triage: "pack_api_server do_GET pre-auth ルートを確認"
  - id: b9-sp-002
    layer: security-permission
    risk: unauthorized-get-deny
    reproduce: "認証なしで GET /api/packs を実行する"
    expected: "401 Unauthorized"
    triage: "pack_api_server do_GET _check_auth 分岐を確認"
  - id: b9-sp-003
    layer: security-permission
    risk: unauthorized-post-deny
    reproduce: "認証なしで POST /api/packs/scan を実行する"
    expected: "401 Unauthorized"
    triage: "pack_api_server do_POST _check_auth 分岐を確認"
  - id: b9-sp-004
    layer: security-permission
    risk: unauthorized-put-deny
    reproduce: "認証なしで PUT /api/secrets/... を実行する"
    expected: "401 Unauthorized"
    triage: "pack_api_server do_PUT _check_auth 分岐を確認"
  - id: b9-sp-005
    layer: security-permission
    risk: unauthorized-delete-deny
    reproduce: "認証なしで DELETE /api/packs/{id} を実行する"
    expected: "401 Unauthorized"
    triage: "pack_api_server do_DELETE _check_auth 分岐を確認"
  - id: b9-sp-006
    layer: security-permission
    risk: setup-status-preauth-only
    reproduce: "認証なしで GET /api/setup/status を実行する"
    expected: "200でsetup状態を返す"
    triage: "pre-auth route テーブル定義を確認"
  - id: b9-sp-007
    layer: security-permission
    risk: oauth-start-preauth
    reproduce: "認証なしで GET /api/setup/oauth/start を実行する"
    expected: "認証不要で開始できる"
    triage: "oauth_start の pre-auth 例外扱いを確認"
  - id: b9-sp-008
    layer: security-permission
    risk: oauth-callback-preauth
    reproduce: "認証なしで GET /callback を実行する"
    expected: "認証不要で callback 処理される"
    triage: "oauth_callback 分岐を確認"
  - id: b9-sp-009
    layer: security-permission
    risk: permissive-without-optin
    reproduce: "opt-in環境無しで --permissive 起動する"
    expected: "起動拒否される"
    triage: "app._check_permissive_production_guard を確認"
  - id: b9-sp-010
    layer: security-permission
    risk: permissive-without-lockfile
    reproduce: "opt-in環境のみで lockfile無し --permissive を実行"
    expected: "起動拒否される"
    triage: "permissive lockfile check を確認"
  - id: b9-sp-011
    layer: security-permission
    risk: strict-default-mode
    reproduce: "引数なしで app.py 起動する"
    expected: "RUMI_SECURITY_MODE=strict で動作する"
    triage: "app.py setdefault 分岐を確認"
  - id: b9-sp-012
    layer: security-permission
    risk: host-execution-preflight
    reproduce: "未許可 host_execution pack を含む状態で起動"
    expected: "startup aborted になる"
    triage: "validate_host_execution_single 分岐を確認"
  - id: b9-sp-013
    layer: security-permission
    risk: host-execution-env-bypass
    reproduce: "RUMI_ALLOW_HOST_EXECUTION 未設定で host_execution 実行を試す"
    expected: "許可されない"
    triage: "pack_validator 境界を確認"
  - id: b9-sp-014
    layer: security-permission
    risk: approval-required-before-exec
    reproduce: "未承認 pack をscan後に実行導線へ進む"
    expected: "pending のまま実行不可"
    triage: "approval_manager status 判定を確認"
  - id: b9-sp-015
    layer: security-permission
    risk: hash-mismatch-auto-modified
    reproduce: "承認後 pack ファイルを改変して再評価する"
    expected: "modified 状態へ遷移する"
    triage: "approval_manager verify/hash 分岐を確認"
  - id: b9-sp-016
    layer: security-permission
    risk: modified-pack-block
    reproduce: "modified 状態 pack を実行する"
    expected: "再承認なしでは実行されない"
    triage: "approval_manager / executor 側の拒否経路を確認"
  - id: b9-sp-017
    layer: security-permission
    risk: network-grant-required
    reproduce: "network grantなしで外部アクセスを実行"
    expected: "拒否される"
    triage: "network_grant_manager 判定を確認"
  - id: b9-sp-018
    layer: security-permission
    risk: network-grant-allow
    reproduce: "grant_network_access 後に外部アクセスを実行"
    expected: "許可される"
    triage: "grant file と check 分岐を確認"
  - id: b9-sp-019
    layer: security-permission
    risk: network-grant-revoke
    reproduce: "revoke_network_access 後に外部アクセスを再実行"
    expected: "再び拒否される"
    triage: "revoke 書き込みと再読込を確認"
  - id: b9-sp-020
    layer: security-permission
    risk: network-grant-scope-host-port
