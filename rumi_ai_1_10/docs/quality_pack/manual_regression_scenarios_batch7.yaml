version: 1
owner: quality-pack
description: |
  手動回帰シナリオ台帳の第7弾。viewer 起動/失敗UX/ナビゲーション制御、
  release パイプライン、CI 境界、監査証跡の検証を追加する。
scenarios:
  - id: b7-vr-001
    layer: failure-ux
    risk: viewer-splash-initial
    reproduce: "viewer起動直後のsplashを確認"
    expected: "Initializing... が表示される"
    triage: "src-tauri/splash/index.html の初期progressを確認"
  - id: b7-vr-002
    layer: failure-ux
    risk: viewer-splash-error-color
    reproduce: "get_setup_progress が Error を返す状態にする"
    expected: "progress が error クラスになり赤表示"
    triage: "splashの progress.error クラス付与を確認"
  - id: b7-vr-003
    layer: failure-ux
    risk: viewer-splash-ready-state
    reproduce: "setup完了状態で splash を表示"
    expected: "Ready 表示かつ spinner が非表示になる"
    triage: "msg==='Ready' 分岐を確認"
  - id: b7-vr-004
    layer: failure-ux
    risk: viewer-ipc-unavailable-loop
    reproduce: "window.__TAURI__ 未定義状態を再現"
    expected: "500ms間隔で再試行しクラッシュしない"
    triage: "poll の early return 分岐を確認"
  - id: b7-vr-005
    layer: failure-ux
    risk: viewer-ipc-error-message
    reproduce: "invoke('get_setup_progress') で例外を発生"
    expected: "IPC error: ... が表示される"
    triage: "catch節の el.textContent 更新を確認"
  - id: b7-vr-006
    layer: security-permission
    risk: viewer-nav-guard-external-block
    reproduce: "viewerで https://example.com へ遷移要求"
    expected: "nav-guard が遷移を拒否する"
    triage: "lib.rs on_navigation allowed 判定を確認"
  - id: b7-vr-007
    layer: security-permission
    risk: viewer-nav-guard-localhost-allow
    reproduce: "http://localhost:8765/panel/ へ遷移"
    expected: "遷移が許可される"
    triage: "is_local_http 条件を確認"
  - id: b7-vr-008
    layer: security-permission
    risk: viewer-nav-guard-127001-allow
    reproduce: "http://127.0.0.1:8765/panel/ へ遷移"
    expected: "遷移が許可される"
    triage: "host == 127.0.0.1 条件を確認"
  - id: b7-vr-009
    layer: security-permission
    risk: viewer-nav-guard-wrong-port-block
    reproduce: "http://localhost:9999 へ遷移"
    expected: "遷移が拒否される"
    triage: "port==8765 条件を確認"
  - id: b7-vr-010
