workflows:
  map_fields_from_semantic_dom:
    owner: rumi_browser_form_operator_pack
    spec_asset: specs/semantic_dom_dependency.yaml
    requires_evidence:
      - field_selector_map
      - before_after_screenshot_ids
      - submit_intent
      - receipt_url
      - visible_label_map
      - validation_message_map
    handoff_policy: setup_pack_overlap_policy
    acceptance_gates:
      - selector_stability_reviewed
      - labels_match_user_intent
      - duplicate_field_names_resolved
      - screenshot_ids_linked
  stage_form_values_for_review:
    owner: rumi_browser_form_operator_pack
    spec_asset: specs/field_risk_classification.yaml
    requires_evidence:
      - field_selector_map
      - before_after_screenshot_ids
      - submit_intent
      - receipt_url
      - field_risk_map
      - confirmation_requirements
    handoff_policy: setup_pack_overlap_policy
    acceptance_gates:
      - field_risk_map_reviewed
      - sensitive_values_redacted_in_summary
      - medium_or_higher_risk_requires_confirmation
      - hidden_fields_excluded_or_explained
  record_submission_receipt:
    owner: rumi_browser_form_operator_pack
    spec_asset: specs/submission_review_checklist.yaml
    evidence_asset: evidence/submission_receipt_evidence.schema.yaml
    requires_evidence:
      - field_selector_map
      - before_after_screenshot_ids
      - submit_intent
      - receipt_url
      - pre_submit_review
      - user_confirmation_ref
      - receipt_evidence_plan
    handoff_policy: setup_pack_overlap_policy
    acceptance_gates:
      - submit_button_text_recorded
      - before_screenshot_id_recorded
      - after_screenshot_id_recorded
      - receipt_url_or_state_recorded
      - no_submit_without_explicit_approval_and_receipt_evidence
  block_high_risk_submission:
    owner: rumi_browser_form_operator_pack
    spec_asset: specs/field_risk_classification.yaml
    requires_evidence:
      - field_risk_map
      - high_risk_fields
      - irreversible_controls
      - user_goal
    handoff_policy: setup_pack_overlap_policy
    acceptance_gates:
      - high_risk_submit_requires_security_review
      - irreversible_submit_requires_explicit_confirmation
      - rollback_or_contact_path_recorded_if_visible
