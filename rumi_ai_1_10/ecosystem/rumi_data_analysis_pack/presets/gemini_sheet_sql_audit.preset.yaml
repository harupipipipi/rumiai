preset_id: gemini_sheet_sql_audit
name: Gemini Style Sheet and SQL Audit
profile: rumi_data_analysis.sql_notebook_analyst
inspired_by: [Gemini, spreadsheet analysis, SQL reasoning]
enabled_capabilities: [sheet_audit, sql_reasoning, data_cleaning, analysis_audit]
