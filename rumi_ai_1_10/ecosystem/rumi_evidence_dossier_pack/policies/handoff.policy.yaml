handoff_policy:
  default: do_not_execute_adjacent_runtime_action
  overlap_policy:
    source_retrieval: handoff_to_rumi_research_pack
    connector_access: handoff_to_rumi_connector_gateway_pack
    data_transformation: handoff_to_rumi_data_analysis_pack
    document_rendering: handoff_to_rumi_document_intelligence_pack
    workspace_export: handoff_to_rumi_workspace_pack
    model_eval_scoring: handoff_to_rumi_model_evals_pack
    claim_evidence_graph: owned_by_rumi_evidence_dossier_pack
    citation_ledger: owned_by_rumi_evidence_dossier_pack
    tool_aliases: prefer_explicit_pack_namespace
  conflict_resolution:
  - Prefer the most specific owner surface.
  - Emit Handoff packets for adjacent runtime actions.
  - Require human review when approval, identity, citation, or safety state is uncertain.
