handoff_policy:
  default: do_not_execute_adjacent_runtime_action
  overlap_policy:
    analytics_query_execution: handoff_to_rumi_data_analysis_pack
    runtime_telemetry: handoff_to_rumi_observability_pack
    production_rollout: handoff_to_rumi_devops_release_pack
    model_benchmarking: handoff_to_rumi_model_evals_pack
    business_decision_execution: handoff_to_rumi_business_ops_pack
    feature_flag_mutation: handoff_to_rumi_devops_release_pack
    experiment_design_contract: owned_by_rumi_experiment_design_pack
    tool_aliases: prefer_explicit_pack_namespace
  conflict_resolution:
  - If an action mutates external state, stop and emit a handoff packet.
  - If evidence is missing, mark uncertainty instead of fabricating details.
  - If pack ownership is ambiguous, prefer the narrower owner surface and require human review.
