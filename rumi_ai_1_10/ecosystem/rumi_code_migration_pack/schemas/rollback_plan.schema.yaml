$schema: https://json-schema.org/draft/2020-12/schema
$id: https://rumi.local/schemas/rollback_plan.schema.json
title: Rollback Plan
description: Code migration planning contract schema.
type: object
additionalProperties: false
required:
- rollback_id
- trigger
- revert_strategy
- data_config_considerations
- dependency_downgrade_path
- user_impact
- verification_after_rollback
properties:
  rollback_id:
    type: string
    minLength: 1
  trigger:
    type: string
    minLength: 1
  revert_strategy:
    type: string
    minLength: 1
  data_config_considerations:
    type: array
    items:
      type: string
  dependency_downgrade_path:
    type: string
    minLength: 1
  user_impact:
    type: string
    minLength: 1
  verification_after_rollback:
    type: string
    minLength: 1
