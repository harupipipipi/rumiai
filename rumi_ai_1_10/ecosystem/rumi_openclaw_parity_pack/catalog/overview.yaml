id: rumi_openclaw_parity_pack
category: parity-catalog
openclaw_surface: official OpenClaw runtime, plugin, channel, provider, skill, memory, automation, security, media, and node surfaces
capabilities:
  - Map OpenClaw surfaces to Rumiai pack ownership.
  - Keep setup-pack install choices visible without granting execution power.
