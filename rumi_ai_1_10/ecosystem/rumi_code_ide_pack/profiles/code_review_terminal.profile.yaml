profile_id: rumi_code_ide_pack.code_review_terminal
version: rumi.profile.v1
kind: runtime_profile
locale: ja

display_name:
  ja: Terminal Code Review
  en: Terminal Code Review

description:
  ja: 差分、テスト、リスク確認を優先するレビュー用プロファイル。
  en: Review-first profile for diff, test, and risk inspection.

default_graph: defaultspack.coding_workspace
default_flow: agent_chat

surfaces:
  preferred: cli
  enabled:
    - cli
    - desktop

prompt_layers:
  system:
    - prompts/code_review_terminal.system.md

tool_scope: tool_scopes/code_ide_tool_scope.yaml
command_recipes: command_recipes/code_cli_recipes.yaml

permissions:
  can_create_profile: true
  can_update_profile: true
  can_delete_profile: false
  can_enable_node: true
  can_disable_node: true
  can_enable_unapproved_nodes: false
  can_install_packs: false
  can_edit_bindings: false
  require_audit: true

enabled_nodes:
  - rumi.start
  - defaultspack.agent
  - defaultspack.ai_client
  - defaultspack.tool
  - defaultspack.memory
  - defaultspack.prompt
  - defaultspack.cli_surface

policy:
  write_actions_require_approval: true
  terminal_actions_require_approval: true
  default_response_order: findings_first
  audit_level: detailed

metadata:
  pack_id: rumi_code_ide_pack
  category: review
