profile_id: rumi_code_ide_pack.local_first_pair_programmer
version: rumi.profile.v1
kind: runtime_profile
locale: ja

display_name:
  ja: Local-First Pair Programmer
  en: Local-First Pair Programmer

description:
  ja: ローカル優先で安全に進めるペアプログラミング用プロファイル。
  en: Conservative local-first pair programming profile.

default_graph: defaultspack.coding_workspace
default_flow: agent_chat

surfaces:
  preferred: desktop
  enabled:
    - desktop
    - cli
    - ide

prompt_layers:
  system:
    - prompts/code_ide_agent.system.md

tool_scope: tool_scopes/code_ide_tool_scope.yaml

permissions:
  can_create_profile: true
  can_update_profile: true
  can_delete_profile: false
  can_enable_node: true
  can_disable_node: true
  can_enable_unapproved_nodes: false
  can_install_packs: false
  can_edit_bindings: false
  require_audit: true

enabled_nodes:
  - rumi.start
  - defaultspack.agent
  - defaultspack.ai_client
  - defaultspack.tool
  - defaultspack.memory
  - defaultspack.prompt
  - defaultspack.frontend

policy:
  network_default: disabled
  write_actions_require_approval: true
  terminal_actions_require_approval: true
  destructive_actions_allowed: false
  audit_level: detailed

metadata:
  pack_id: rumi_code_ide_pack
  category: pair_programming
