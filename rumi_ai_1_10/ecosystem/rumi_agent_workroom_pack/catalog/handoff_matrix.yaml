handoff_matrix:
  pack_boundary_rule: owner_surface_wins_then_explicit_handoff
  items:
  - surface: tool_execution
    resolution: handoff_to_rumi_default_tools_pack
    requires_human_review: true
  - surface: agent_service_choreography
    resolution: handoff_to_rumi_agent_services_pack
    requires_human_review: true
  - surface: browser_action
    resolution: handoff_to_rumi_browser_automation_pack
    requires_human_review: true
  - surface: desktop_action
    resolution: handoff_to_rumi_computer_control_pack
    requires_human_review: true
  - surface: schedule_execution
    resolution: handoff_to_rumi_workflow_scheduler_pack
    requires_human_review: true
  - surface: file_persistence
    resolution: handoff_to_rumi_workspace_pack
    requires_human_review: true
  - surface: metrics_collection
    resolution: handoff_to_rumi_observability_pack
    requires_human_review: true
  - surface: subagent_pr_management
    resolution: handoff_to_rumi_subagent_pr_manager_pack
    requires_human_review: true
  - surface: model_routing
    resolution: handoff_to_rumi_model_catalog_pack
    requires_human_review: true
