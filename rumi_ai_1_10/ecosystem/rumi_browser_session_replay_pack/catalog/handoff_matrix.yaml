handoff_matrix:
  pack_id: rumi_browser_session_replay_pack
  pack_boundary_rule: owner_surface_wins_then_explicit_handoff
  items:
  - surface: browser_execution
    resolution: handoff_to_rumi_browser_automation_pack
  - surface: semantic_dom
    resolution: handoff_to_rumi_browser_element_pack
  - surface: browser_transport
    resolution: handoff_to_rumi_default_tools_pack
  - surface: audit_logs
    resolution: handoff_to_defaultspack
  - surface: form_submission
    resolution: handoff_to_rumi_browser_form_operator_pack
  - surface: session_replay_contract
    resolution: owned_by_rumi_browser_session_replay_pack
  - surface: redaction_review
    resolution: owned_by_rumi_browser_session_replay_pack
  - surface: tool_aliases
    resolution: prefer_explicit_pack_namespace
