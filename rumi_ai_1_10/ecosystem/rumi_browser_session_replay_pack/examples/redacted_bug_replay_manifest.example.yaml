example:
  id: redacted_bug_replay_manifest
  pack_id: rumi_browser_session_replay_pack
  scenario: A bug report replay manifest orders observed events without containing
    executable browser commands.
  input_refs:
  - workspace_ref:case-file
  evidence_refs:
  - event:navigation_observed:redacted_bug_page
  - dom:snapshot:bug-page-redacted
  - screenshot:artifact:bug-state-redacted
  handoff_owner: rumi_browser_automation_pack
  replay_manifest:
    manifest_id: manifest_redacted_bug_report
    trace_id: trace_bug_report_replay_2026_06_04
    ordered_evidence_refs:
    - event:navigation_observed:redacted_bug_page
    - dom:snapshot:bug-page-redacted
    - screenshot:artifact:bug-state-redacted
    preconditions:
    - user_auth_state_supplied_by_runtime_owner
    - private_url_redacted
    expected_page_states:
    - error_banner_visible
    - save_button_disabled
    redaction_policy_ref: policies/session_replay_redaction.policy.yaml
