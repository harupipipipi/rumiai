    sensitive_classes:
    - private_url
    - dom_text
    - screenshot_region
  review_gate: all_blocking_checks
  expected_result: reviewed_handoff_packet
  must_not:
  - external_action
  - runtime_execution
  - secret_material
  status: ready_for_owner_handoff
  redaction:
    state: redacted
    sensitive_classes:
    - private_url
    - typed_input_evidence
    - dom_text
    receipt_ref: redaction:redacted_bug_replay_manifest
  replay_manifest:
