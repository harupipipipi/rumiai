handoff_policy:
  default: do_not_execute_adjacent_runtime_action
  overlap_policy:
    actual_app_connectors: handoff_to_rumi_connector_gateway_pack
    slack_gmail_mobile_clients: handoff_to_connector_or_channel_owner
    work_execution: handoff_to_rumi_agent_services_pack
    schedule_execution: handoff_to_rumi_workflow_scheduler_pack
    security_policy_review: handoff_to_rumi_security_review_pack
    message_sending: handoff_to_rumi_connector_gateway_pack
    identity_mapping: owned_by_rumi_omnichannel_agent_inbox_pack
    outbound_draft_approval: owned_by_rumi_omnichannel_agent_inbox_pack
    tool_aliases: prefer_explicit_pack_namespace
  conflict_resolution:
  - Prefer the most specific owner surface.
  - Emit Handoff packets for adjacent runtime actions.
  - Require human review when approval, identity, citation, or safety state is uncertain.
  remote_input_authority:
    approve: false
    execute: false
    install_pack: false
    mutate_settings: false
    issue_tokens: false
