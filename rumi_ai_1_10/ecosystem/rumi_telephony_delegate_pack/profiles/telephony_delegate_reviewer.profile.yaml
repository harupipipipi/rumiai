profile:
  id: telephony_delegate
  pack_id: rumi_telephony_delegate_pack
  mode: local_first_declarative
  default_presets:
  - safe_default
  - handoff_review
  - quality_gate
  owned_surfaces:
  - call_task_contract
  - pre_call_script
  - dial_approval_gate
  - consent_disclosure_script
  - call_session_state
  - takeover_escalation
  - transcript_redaction_contract
  - never_call_list
  - mock_dial_readiness
  handoff_surfaces:
  - actual dialing
  - ASR/TTS runtime
  - contact lookup
  - calendar mutation
  - payment or purchase execution
  - external connector writes
  - emergency services
  review_contract:
    external_actions: handoff_only
    evidence_required: true
    human_review_required: true
