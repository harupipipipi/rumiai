handoff_matrix:
  pack_boundary_rule: owner_surface_wins_then_explicit_handoff
  items:
  - surface: actual_dialing
    resolution: blocked_handoff_to_connector_gateway_or_voice_owner
    requires_human_review: true
  - surface: asr_tts_runtime
    resolution: handoff_to_rumi_voice_mobile_pack
    requires_human_review: true
  - surface: media_transcript_runtime
    resolution: handoff_to_rumi_multimodal_media_pack
    requires_human_review: true
  - surface: contact_or_calendar_lookup
    resolution: handoff_to_rumi_connector_gateway_pack
    requires_human_review: true
  - surface: meeting_recap
    resolution: handoff_to_rumi_meeting_intelligence_pack
    requires_human_review: true
  - surface: external_business_action
    resolution: handoff_to_rumi_business_ops_pack
    requires_human_review: true
  - surface: real_world_action_risk_review
    resolution: handoff_to_rumi_security_review_pack
    requires_human_review: true
