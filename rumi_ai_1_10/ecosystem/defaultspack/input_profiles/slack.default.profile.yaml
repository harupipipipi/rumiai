id: slack.default
provider: slack
version: 1
display_name: Slack Default
match:
  event_type: message
input:
  role: user
  content: "coalesce($.event.text, $.text, $.message, 'Slack event received')"
metadata:
  source:
    kind: integration
    provider: slack
  slack:
    team_id: "$.team_id"
    channel_id: "$.event.channel"
    user_id: "$.event.user"
    thread_ts: "coalesce($.event.thread_ts, $.event.ts)"
params:
  external_input:
    default_response:
      mode: same_response
      include_source_context: true
      source_context_format: "${provider}から来た入力です。"
response_prompt:
  enabled: false
