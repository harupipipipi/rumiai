id: generic.webhook.default
provider: generic
version: 1
display_name: Generic Webhook Default
match:
  event_type: message
input:
  role: user
  content: "coalesce($.text, $.message, $.content, 'Webhook event received')"
metadata:
  source:
    kind: webhook
    provider: generic
  webhook:
    payload: "$"
params:
  external_input:
    default_response:
      mode: same_response
      include_source_context: true
      source_context_format: "${provider}から来た入力です。"
response_prompt:
  enabled: false
