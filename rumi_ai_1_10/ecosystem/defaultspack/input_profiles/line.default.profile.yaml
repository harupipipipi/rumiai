id: line.default
provider: line
version: 1
display_name: LINE Default
match:
  event_type: message
input:
  role: user
  content:
    when:
      - if: "$.message.type == 'text'"
        value: "$.message.text"
      - else:
        value: "LINE ${$.message.type} message received. messageId=${$.message.id}"
metadata:
  source:
    kind: integration
    provider: line
  line:
    reply_token: "$.replyToken"
    source: "$.source"
    message: "$.message"
