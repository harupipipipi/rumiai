id: line.output.default
direction: output
provider: line
display_name: LINE Output
summary: Reply with LINE replyToken first, or push to User/Group/Room ID when needed.
setup_steps:
  - Paste Channel Access Token into External Tokens with provider=line.
  - Use replyToken from incoming LINE events for immediate replies.
  - Use User/Group/Room ID for push fallback.
output_profile_id: line.default
required_setup:
  any_of:
    - fields:
        - channel_access_token
        - reply_token
    - fields:
        - channel_access_token
        - user_id
tokens:
  - kind: channel_access_token
    label: Channel Access Token
fields:
  - id: reply_token
    label: Reply Token
    secret: false
  - id: user_id
    label: User/Group/Room ID
    secret: false
capabilities_profile: line
examples:
  - id: external_send.line.push
    label: Tool send
    tool: external_send
    args:
      provider: line
      target_id: "Uxxxxxxxx"
      text: "送信する本文"
