profile_id: defaultspack.startup
version: rumi.profile.v1
kind: runtime_profile
locale: ja

display_name:
  ja: defaultspack 起動
  en: defaultspack Startup

description:
  ja: defaultspack を Runtime Profile から起動するための標準プリセット。
  en: Standard preset for launching defaultspack from a Runtime Profile.

default_graph: defaultspack.startup
default_flow: defaultspack.compile_coding_workspace

surfaces:
  preferred: cli
  enabled:
    - cli
    - desktop

permissions:
  can_add_nodes: true
  can_enable_unapproved_nodes: false
  can_install_packs: false
  can_edit_bindings: false

enabled_nodes:
  - rumi.start
  - defaultspack.agent
  - defaultspack.ai_client
  - defaultspack.tool
  - defaultspack.memory
  - defaultspack.prompt
  - defaultspack.frontend
  - defaultspack.cli_surface

disabled_nodes: []

node_settings:
  defaultspack.ai_client:
    default_model: openrouter/tencent/hy3-preview:free

policy:
  write_actions_require_approval: true
  audit_level: normal

metadata:
  pack_id: defaultspack
  category: startup
