flow_id: defaultspack.chat_turn
description: Transparent model routing, multimodal fallback, prompt preparation, tool selection, and chat completion.
steps:
  - id: load_model_settings
    type: function
    function: defaults.ai.get_preferred_model
    output: model_settings
  - id: detect_input_modalities
    type: function
    function: defaults.context.token_estimate
    input: "{{input}}"
    output: modality_hint
  - id: route_model
    type: function
    function: defaults.ai.route_model
    input: "{{input}}"
    output: route_model
  - id: maybe_run_vision_bridge
    type: function
    function: defaults.vision.describe_images
    when: "{{route_model.bridge_required}}"
    input: "{{input}}"
    output: vision_bridge_result
  - id: compact_prompts
    type: function
    function: defaults.prompt.compact_prompt
    input: "{{input.prompt}}"
    output: prompt_compaction
  - id: select_tools
    type: function
    function: defaults.agent.run_subagent
    input:
      role_id: tool_selector
      payload: "{{input}}"
    output: tool_selection
  - id: call_ai
    type: function
    function: defaults.ai.complete
    input: "{{input}}"
    output: ai_response
