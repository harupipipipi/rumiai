flow_id: agent_chat
name: "Agent Chat"
description: "ツール使用可能なエージェントチャットループ"
version: "1.0.0"
trigger:
  type: user_input
  config:
    require_conversation: true
handler: handler.py
config_schema:
  agent_id:
    type: string
    default: "default_agent"
  max_iterations:
    type: integer
    default: 10
metadata:
  author: "defaults"
  tags: ["agent", "chat"]
