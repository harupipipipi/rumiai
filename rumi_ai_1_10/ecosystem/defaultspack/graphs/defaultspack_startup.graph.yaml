graph_id: defaultspack_startup
version: rumi.graph.v1

display_name:
  ja: defaultspack startup
  en: defaultspack startup

description:
  ja: defaultspack の起動時 Capability Graph。
  en: Startup Capability Graph for defaultspack.

nodes:
  - id: start
    ref: rumi.start
  - id: agent
    ref: defaultspack.agent
  - id: ai
    ref: defaultspack.ai_client
  - id: tools
    ref: defaultspack.tool
  - id: memory
    ref: defaultspack.memory
  - id: prompt
    ref: defaultspack.prompt
  - id: frontend
    ref: defaultspack.frontend

edges:
  - id: start_to_agent
    from: start.out
    to: agent.start
    kind: binding
  - id: ai_to_agent
    from: ai.client
    to: agent.ai
    kind: binding
  - id: tools_to_agent
    from: tools.tools
    to: agent.tools
    kind: binding
  - id: memory_to_agent
    from: memory.store
    to: agent.memory
    kind: binding
  - id: prompt_to_agent
    from: prompt.prompt
    to: agent.prompt
    kind: binding
  - id: frontend_to_agent
    from: frontend.ui
    to: agent.surface
    kind: binding

metadata:
  pack_id: defaultspack
  category: startup
