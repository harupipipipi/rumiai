id: local_model
name: Local Model Provider
description: Local provider interface for Ollama, llama.cpp, LM Studio, and OpenAI-compatible local endpoints.
local_only: true
requires_network: false
risk_level: low
permissions: [llm.local.call, llm.local.models]
handlers:
  - blocks.ai.models
  - blocks.ai.providers
providers: [ollama, llama_cpp, lm_studio, openai_compatible_local]
metadata:
  supports_tools: boolean
  supports_vision: boolean
  supports_embeddings: boolean
  context_length: integer
