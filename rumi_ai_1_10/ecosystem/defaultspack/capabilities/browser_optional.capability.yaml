id: browser_optional
name: Browser and Computer Use
description: Optional browser open, screenshot, click, type, extraction, download, and session restore capability.
local_only: true
requires_network: optional
risk_level: high
permissions:
  - browser.open
  - browser.screenshot
  - browser.input
  - browser.download
handlers:
  - defaults.tool.container.create
  - defaults.tool.container.screenshot
operations: [open, screenshot, click, type, extract, download, session_save, session_restore]
approval:
  network: true
  download: true
