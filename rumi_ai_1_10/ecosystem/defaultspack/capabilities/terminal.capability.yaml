id: terminal
name: Local Terminal
description: Local command execution with cwd, environment, history, stream metadata, risk labels, and approval policy.
local_only: true
requires_network: false
risk_level: high
permissions: [terminal.execute, terminal.stream, terminal.session]
handlers:
  - blocks.coding.terminal_exec
  - blocks.coding.terminal_stream
operations: [exec, stream, cancel, replay, summarize_output]
approval:
  execute: true
risk_levels:
  low: [pwd, ls, cat, git status]
  medium: [npm test, python script.py, pytest, npm run build]
  high: [rm, chmod, curl, git push, npm install]
