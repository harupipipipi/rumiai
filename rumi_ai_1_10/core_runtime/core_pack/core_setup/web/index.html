<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumi AI Setup</title>
  <style>
    :root {
      --bg: linear-gradient(140deg, #f5efe2 0%, #d9e5db 55%, #c6d6df 100%);
      --ink: #1b2a2f;
      --muted: #56666b;
      --card: rgba(255, 252, 245, 0.88);
      --line: rgba(27, 42, 47, 0.12);
      --accent: #1f6d57;
      --accent-2: #be6b3a;
      --shadow: 0 20px 50px rgba(27, 42, 47, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 24px;
      overflow-x: hidden;
    }
    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .hero {
      padding: 28px 28px 12px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at top right, rgba(190, 107, 58, 0.16), transparent 32%),
        radial-gradient(circle at left center, rgba(31, 109, 87, 0.14), transparent 28%);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    p { margin: 0; color: var(--muted); }
    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 0.82fr);
      padding: 24px 28px 28px;
    }
    .panel {
      background: rgba(255,255,255,0.66);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .pack-list {
      display: grid;
      gap: 12px;
    }
    .pack {
      display: block;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }
    .pack:hover {
      transform: translateY(-1px);
      border-color: rgba(31,109,87,0.28);
    }
    .pack:focus-within,
    .pack.selected {
      border-color: rgba(31,109,87,0.42);
      box-shadow: inset 0 0 0 1px rgba(31,109,87,0.2);
    }
    .pack header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap;
    }
    .recommended { color: var(--accent); border-color: rgba(31,109,87,0.25); }
    .danger { color: var(--accent-2); border-color: rgba(190,107,58,0.25); }
    .actions, .mini-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .mini-actions {
      align-items: center;
      min-height: 44px;
    }
    .mini-actions input {
      min-width: 22px;
      min-height: 22px;
      accent-color: var(--accent);
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
      color: white;
      background: var(--accent);
    }
    button.secondary {
      color: var(--ink);
      background: rgba(27, 42, 47, 0.08);
    }
    button.warn { background: var(--accent-2); }
    button:disabled { opacity: 0.55; cursor: default; }
    .status {
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
      background: rgba(27,42,47,0.04);
      border-radius: 16px;
      padding: 14px;
      min-height: 140px;
    }
    .status h3 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 15px;
    }
    .status ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }
    .status details {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .status pre {
      margin: 10px 0 0;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .advanced-selection {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .advanced-selection summary {
      cursor: pointer;
      color: var(--ink);
      font-weight: 700;
    }
    .meta {
      display: grid;
      gap: 10px;
      font-size: 14px;
    }
    .meta strong {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      body { padding: 12px; }
      .hero { padding: 22px 18px 10px; }
      .grid { padding: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>Choose setup packs.</h1>
      <p>Checked setup packs are installed together. all OK permissions are granted only to setup packs that explicitly support all OK.</p>
    </section>
    <section class="grid">
      <div class="panel">
        <h2>Available Setup Packs</h2>
        <div class="actions">
          <button id="install-selected">Install checked packs</button>
        </div>
        <div id="pack-list" class="pack-list"></div>
      </div>
      <div class="panel">
        <h2>Setup State</h2>
        <div class="meta">
          <div><strong>Selection</strong><span id="selection">Loading…</span></div>
          <div><strong>Migration</strong><span id="migration">Loading…</span></div>
        </div>
        <div class="actions">
          <button id="refresh" class="secondary">Refresh</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </section>
  </main>
  <script>
    const PANEL_CSRF_STORAGE_KEY = "rumi-panel-csrf";
    const statusEl = document.getElementById("status");
    const selectionEl = document.getElementById("selection");
    const migrationEl = document.getElementById("migration");
    const listEl = document.getElementById("pack-list");
    const installButton = document.getElementById("install-selected");
    const returnTo = safeReturnTo(new URLSearchParams(window.location.search).get("return_to"));
    const PROFILE_CARDS = [
      {
        id: "recommended",
        title: "Recommended setup",
        description: "Balanced local-first defaults for the first run.",
        match: (pack) => pack.recommended || /default/i.test(pack.pack_id || pack.display_name || ""),
      },
      {
        id: "minimal",
        title: "Minimal base",
        description: "Only the smallest base setup needed to proceed.",
        match: (pack) => /minimal|base|default/i.test(pack.pack_id || pack.display_name || ""),
      },
      {
        id: "agent-continuity",
        title: "Agent continuity",
        description: "Continuity, memory, workroom, and restart guidance.",
        match: (pack) => /agent|continuity|memory|workroom/i.test(pack.pack_id || pack.display_name || ""),
      },
      {
        id: "services",
        title: "Services and workflows",
        description: "Workflow, office, data, browser, computer, MCP, and scheduler packs.",
        match: (pack) => /service|workflow|office|data|browser|computer|mcp|scheduler|tool/i.test(pack.pack_id || pack.display_name || ""),
      },
      {
        id: "advanced",
        title: "Advanced custom",
        description: "Specialized or higher-risk setup packs for explicit opt-in.",
        match: () => true,
      },
    ];

    function setStatus(label, payload, rows) {
      const items = rows && rows.length ? rows : ["Waiting for setup pack selection."];
      statusEl.innerHTML = "";
      const title = document.createElement("h3");
      title.textContent = label;
      const list = document.createElement("ul");
      for (const row of items) {
        const item = document.createElement("li");
        item.textContent = row;
        list.appendChild(item);
      }
      statusEl.appendChild(title);
      statusEl.appendChild(list);
      renderDebugState(payload);
    }

    function renderDebugState(payload) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const pre = document.createElement("pre");
      summary.textContent = "Advanced debug state";
      pre.textContent = JSON.stringify(payload || {}, null, 2);
      details.appendChild(summary);
      details.appendChild(pre);
      statusEl.appendChild(details);
    }

    function renderInstallSummary(packs, migration) {
      const selectedIds = packs.selected_setup_pack_ids || [];
      const selectedNames = (packs.packs || [])
        .filter((pack) => selectedIds.includes(pack.pack_id))
        .map((pack) => pack.display_name || pack.pack_id);
      const allOkCount = (packs.packs || []).filter(
        (pack) => selectedIds.includes(pack.pack_id) && pack.supports_all_ok
      ).length;
      return [
        "Selected: " + (selectedNames.join(", ") || "none yet"),
        "Install plan: choose one of the grouped cards, or open Advanced custom selection for pack-level control.",
        "All OK impact: " + (allOkCount ? allOkCount + " selected pack(s) can receive bounded all OK grants." : "No selected pack will receive all OK grants by default."),
        "Migration: " + setupMigrationLabel(migration),
      ];
    }

    function errorMessage(error) {
      return error instanceof Error ? error.message : String(error || "request failed");
    }

    function payloadError(payload) {
      if (!payload || typeof payload !== "object") return "";
      if (payload.error) return String(payload.error);
      if (Array.isArray(payload.errors) && payload.errors.length) {
        return payload.errors.map(payloadErrorItem).filter(Boolean).join("; ");
      }
      return "";
    }

    function payloadErrorItem(item) {
      if (!item || typeof item !== "object") return String(item || "");
      const reason = item.reason ? String(item.reason) : "";
      const message = item.error ? String(item.error) : "";
      return [reason, message].filter(Boolean).join(": ") || JSON.stringify(item);
    }

    function safeReturnTo(value) {
      if (!value) return "";
      try {
        const url = new URL(value, window.location.origin);
        const isPanelReturnPath = url.pathname === "/panel" || url.pathname.startsWith("/panel/");
        if (url.origin !== window.location.origin || !isPanelReturnPath) {
          return "";
        }
        return url.pathname + url.search + url.hash;
      } catch {
        return "";
      }
    }

    function setupMigrationLabel(migration) {
      if (migration && migration.available === false) {
        if (migration.reason === "active_target_not_selected") {
          return "no active setup pack selected";
        }
        return migration.reason ? "migration unavailable: " + migration.reason : "migration unavailable";
      }
      return migration && migration.needs_user_migration ? "user.csv migration pending" : "ready";
    }

    function redirectToReturnTarget(packs) {
      if (!returnTo || !(packs.selected_setup_pack_ids || []).length || !packs.active_target_pack_id) {
        return;
      }
      window.location.assign(returnTo);
    }

    function panelCsrfToken() {
      try {
        return window.sessionStorage.getItem(PANEL_CSRF_STORAGE_KEY) || "";
      } catch {
        return "";
      }
    }

    function requestHeaders(options) {
      const headers = { ...((options && options.headers) || {}) };
      const method = String((options && options.method) || "GET").toUpperCase();
      if (method === "POST" || method === "PUT" || method === "DELETE" || method === "PATCH") {
        const csrf = panelCsrfToken();
        if (csrf) headers["X-Rumi-CSRF"] = csrf;
      }
      return headers;
    }

    async function getJson(url, options) {
      const requestOptions = {
        ...(options || {}),
        credentials: "same-origin",
        headers: requestHeaders(options),
      };
      const res = await fetch(url, requestOptions);
      const data = await res.json().catch(() => ({}));
      const payload = data.data || data;
      if (!res.ok || data.success === false || (payload && payload.success === false)) {
        throw new Error(payloadError(payload) || data.error || res.statusText || "request failed");
      }
      return payload;
    }

    async function installSelectedPacks() {
      const selected = selectedSetupPackIds();
      if (!selected.length) {
        setStatus("No setup packs checked", {}, ["Choose at least one setup profile or advanced pack before installing."]);
        return;
      }
      installButton.disabled = true;
      setStatus("Installing setup packs…", { setup_pack_ids: selected }, [
        "Sending " + selected.length + " setup pack id(s): " + selected.join(", "),
        "The button is disabled until the install request completes.",
      ]);
      let data;
      try {
        data = await getJson("/api/setup/packs/install", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ setup_pack_ids: selected })
        });
      } catch (error) {
        installButton.disabled = false;
        setStatus("Setup pack install failed", { setup_pack_ids: selected, error: errorMessage(error) }, [
          "The install request did not complete.",
          "Reason: " + errorMessage(error),
        ]);
        return;
      }
      await load();
      installButton.disabled = false;
      setStatus("Setup packs installed", { setup_pack_ids: selected, result: data }, [
        "Installed: " + selected.join(", "),
        "The setup state has been refreshed.",
      ]);
    }

    function uniquePackIds(packIds) {
      return Array.from(new Set((packIds || []).filter(Boolean)));
    }

    function selectedSetupPackIds() {
      const profileIds = Array.from(listEl.querySelectorAll("[data-profile-pack-ids]:checked"))
        .flatMap((input) => {
          try {
            return JSON.parse(input.dataset.profilePackIds || "[]");
          } catch {
            return [];
          }
        });
      const customIds = Array.from(listEl.querySelectorAll("[data-select-pack]:checked"))
        .map((input) => input.dataset.selectPack);
      return uniquePackIds([...profileIds, ...customIds]);
    }

    function updateSelectionSummary() {
      const selected = selectedSetupPackIds();
      selectionEl.textContent = selected.join(", ") || "none";
      for (const input of listEl.querySelectorAll("[data-profile-pack-ids], [data-select-pack]")) {
        const card = input.closest(".pack");
        if (card) card.classList.toggle("selected", input.checked);
      }
    }

    function matchingPacks(profile, packs, assigned) {
      const matches = [];
      for (const pack of packs) {
        const packId = pack.pack_id || "";
        if (profile.id !== "advanced" && assigned.has(packId)) continue;
        if (profile.match(pack)) matches.push(pack);
      }
      if (!matches.length && profile.id === "recommended" && packs.length) {
        matches.push(packs[0]);
      }
      for (const pack of matches) assigned.add(pack.pack_id || "");
      return matches;
    }

    function renderPacks(payload) {
      listEl.innerHTML = "";
      const hasSelection = Boolean((payload.selected_setup_pack_ids || []).length);
      const packs = payload.packs || [];
      const assigned = new Set();
      const visibleProfiles = PROFILE_CARDS.slice(0, 5);
      for (const profile of visibleProfiles) {
        const profilePacks = matchingPacks(profile, packs, assigned);
        const packIds = uniquePackIds(profilePacks.map((pack) => pack.pack_id));
        if (!packIds.length) continue;
        const checked = profilePacks.some((pack) => pack.selected)
          || (!hasSelection && profile.id === "recommended");
        const card = document.createElement("label");
        card.className = "pack" + (checked ? " selected" : "");
        const header = document.createElement("header");
        const details = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = profile.title;
        const description = document.createElement("div");
        description.textContent = profile.description;
        const allOk = document.createElement("div");
        allOk.textContent = packIds.length + " setup pack(s): " + packIds.join(", ");
        details.appendChild(name);
        details.appendChild(description);
        details.appendChild(allOk);

        const pill = document.createElement("div");
        pill.className = "pill" + (profile.id === "recommended" ? " recommended" : "");
        pill.textContent = profile.id === "recommended" ? "Recommended" : "Profile";
        header.appendChild(details);
        header.appendChild(pill);

        const miniActions = document.createElement("div");
        miniActions.className = "mini-actions";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.profilePackIds = JSON.stringify(packIds);
        input.checked = Boolean(checked);
        miniActions.appendChild(input);
        miniActions.appendChild(document.createTextNode(" Include this setup profile"));

        card.appendChild(header);
        card.appendChild(miniActions);
        listEl.appendChild(card);
      }
      renderAdvancedSelection(packs, hasSelection);
      updateSelectionSummary();
    }

    function renderAdvancedSelection(packs, hasSelection) {
      const details = document.createElement("details");
      details.className = "advanced-selection";
      const summary = document.createElement("summary");
      summary.textContent = "Advanced custom selection";
      details.appendChild(summary);
      for (const pack of packs) {
        const label = document.createElement("label");
        label.className = "pack" + (pack.selected ? " selected" : "");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.selectPack = pack.pack_id || "";
        input.checked = Boolean(pack.selected || (!hasSelection && pack.recommended));
        const riskClass = pack.risk_level === "high" ? "danger" : "";
        const allOkText = pack.supports_all_ok
          ? "Supports selective all OK grants"
          : "Installs without all OK grants";
        label.innerHTML = "<header><div><strong></strong><div></div><div></div></div><div class=\"pill\"></div></header>";
        label.querySelector("strong").textContent = pack.display_name || pack.pack_id || "";
        label.querySelector("header div div").textContent = pack.description || "";
        label.querySelector("header div div + div").textContent = allOkText;
        const pill = label.querySelector(".pill");
        pill.className = "pill" + (pack.recommended ? " recommended" : (riskClass ? " " + riskClass : ""));
        pill.textContent = pack.recommended ? "Recommended" : "Risk: " + pack.risk_level;
        const miniActions = document.createElement("div");
        miniActions.className = "mini-actions";
        miniActions.appendChild(input);
        miniActions.appendChild(document.createTextNode(" Include this individual pack"));
        label.appendChild(miniActions);
        details.appendChild(label);
      }
      listEl.appendChild(details);
    }

    async function load() {
      try {
        const packs = await getJson("/api/setup/packs");
        const migration = await getJson("/api/setup/migration/status");
        renderPacks(packs);
        migrationEl.textContent = setupMigrationLabel(migration);
        setStatus("Setup loaded", { packs, migration }, renderInstallSummary(packs, migration));
        redirectToReturnTarget(packs);
      } catch (error) {
        setStatus("Setup failed", { error: errorMessage(error) }, [
          "The setup state could not be loaded.",
          "Reason: " + errorMessage(error),
        ]);
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    listEl.addEventListener("change", updateSelectionSummary);
    installButton.addEventListener("click", installSelectedPacks);
    load();
  </script>
</body>
</html>
