profile:
  id: customer_research
  pack_id: rumi_customer_research_pack
  mode: local_first_declarative
  default_presets:
  - safe_default
  - handoff_review
  - quality_gate
  owned_surfaces:
  - participant_consent_record
  - research_redaction_policy
  - interview_evidence
  - survey_synthesis
  - feedback_to_insight_card
  - opportunity_map
  - evidence_linked_research_brief
  handoff_surfaces:
  - live recruiting
  - email or CRM writes
  - generic web research
  - product roadmap decisions
  - analytics query execution
  - contact enrichment
  - message sending
  review_contract:
    external_actions: handoff_only
    evidence_required: true
    human_review_required: true
