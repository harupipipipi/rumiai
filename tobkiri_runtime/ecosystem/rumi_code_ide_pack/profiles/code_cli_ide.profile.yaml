profile_id: rumi_code_ide_pack.code_cli_ide
version: rumi.profile.v1
kind: runtime_profile
locale: ja

display_name:
  ja: Code CLI IDE
  en: Code CLI IDE

description:
  ja: CLI と IDE を横断する高度なコーディングワークフロー用プロファイル。
  en: Advanced coding workflow profile for CLI and IDE sessions.

default_graph: defaultspack.coding_workspace
default_flow: agent_chat

surfaces:
  preferred: cli
  enabled:
    - cli
    - desktop
    - ide

prompt_layers:
  system:
    - prompts/code_ide_agent.system.md
    - prompts/command_recipe_runner.system.md

tool_scope: tool_scopes/code_ide_tool_scope.yaml
command_recipes: command_recipes/code_cli_recipes.yaml

permissions:
  can_create_profile: true
  can_update_profile: true
  can_delete_profile: false
  can_enable_node: true
  can_disable_node: true
  can_enable_unapproved_nodes: false
  can_install_packs: false
  can_edit_bindings: false
  require_audit: true

enabled_nodes:
  - rumi.start
  - defaultspack.agent
  - defaultspack.ai_client
  - defaultspack.tool
  - defaultspack.memory
  - defaultspack.prompt
  - defaultspack.frontend
  - defaultspack.cli_surface

disabled_nodes: []

policy:
  write_actions_require_approval: true
  terminal_actions_require_approval: true
  destructive_actions_allowed: false
  audit_level: detailed

metadata:
  pack_id: rumi_code_ide_pack
  category: workspace
  intended_for:
    - repository edits
    - CLI driven debugging
    - IDE pairing
    - test and lint loops
