policy_id: rumi_sandbox_runtime.secret_mount.v1
owner: rumi_sandbox_runtime_pack
purpose: Declarative policy for reviewing secret and credential mounts into any runtime environment.
network_default: none
default_decision: deny_secret_mount
secret_mount_classes:
  no_secret:
    allowed: true
    evidence_required: [runtime_receipt, redaction_check]
  named_runtime_secret_reference:
    allowed: review_required
    evidence_required: [secret_owner, scope, ttl, redaction_check, security_handoff]
  raw_secret_value:
    allowed: false
    evidence_required: [reject_reason, redaction_check]
  inherited_host_environment:
    allowed: false
    evidence_required: [blocked_env_keys_summary, security_handoff]
rules:
  - id: never_record_secret_values
    statement: Receipt and logs may record secret labels only, never values.
  - id: require_ttl_and_scope
    statement: Any approved secret reference needs explicit scope, TTL, and command boundary.
  - id: forbid_ambient_env_inheritance
    statement: Host environment inheritance is blocked unless an execution owner creates a reviewed allowlist outside this pack.
outputs:
  - secret_mount_decision
  - redaction_requirements
  - security_review_handoff
