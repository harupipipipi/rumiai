version: rumi.document_intelligence.citation_privacy_policy.v1
policy_id: rumi_document_intelligence_pack.citation_privacy_review
pack_id: rumi_document_intelligence_pack
network_default: none

principles:
  - Do not invent citations, page numbers, or spans.
  - Separate exact quote evidence from paraphrase evidence.
  - Treat document text, names, signatures, account details, and private annotations as sensitive until classified.
  - Use local evidence first; external lookup requires explicit user request and runtime approval.
  - Escalate legal, medical, financial, or employment-impacting interpretations to human review.

privacy_classes:
  - public_or_user_approved
  - internal_business
  - personal_data
  - confidential_contract
  - regulated_sensitive
  - unknown_needs_review

required_checks:
  before_summary:
    - source_document_identified
    - page_span_or_missing_evidence_recorded
    - privacy_classification_assigned
  before_redline_handoff:
    - source_and_target_versions_identified
    - high_risk_deltas_flagged
    - citation_delta_reviewed
  before_external_sharing:
    - user_approval_recorded
    - sensitive_spans_redacted_or_excluded
    - recipients_or_destination_known

blocked_by_default:
  - uploading_documents_to_remote_services
  - exposing full confidential clauses unnecessarily
  - claiming page-level evidence without source access
  - treating redline output as legal advice
