workflows:
  pack_id: rumi_browser_session_replay_pack
  default_execution: no_runtime_action
  ownership:
    owned:
    - browser_session_trace_contract
    - dom_snapshot_evidence_bundle
    - screenshot_evidence_bundle
    - browser_event_evidence
    - replay_manifest_contract
    - selector_drift_report
    - redaction_review_receipt
    handoff:
    - browser execution
    - semantic DOM interpretation
    - browser companion transport
    - form submission
    - defaultspack audit and grants
    - observability metric storage
    - connector retrieval
  items:
  - id: trace_capture_review
    execution: declarative_only
    description: Contract workflow for trace capture review.
    handoffs:
    - handoff_to_rumi_browser_automation_pack
    - handoff_to_rumi_browser_element_pack
    - handoff_to_rumi_default_tools_pack
    - handoff_to_defaultspack
    - handoff_to_rumi_browser_form_operator_pack
    produces: trace_capture_review_handoff_packet
  - id: redacted_replay_bundle
    execution: declarative_only
    description: Contract workflow for redacted replay bundle.
    handoffs:
    - handoff_to_rumi_browser_automation_pack
    - handoff_to_rumi_browser_element_pack
    - handoff_to_rumi_default_tools_pack
    - handoff_to_defaultspack
    - handoff_to_rumi_browser_form_operator_pack
    produces: redacted_replay_bundle_handoff_packet
  - id: selector_drift_audit
    execution: declarative_only
    description: Contract workflow for selector drift audit.
    handoffs:
    - handoff_to_rumi_browser_automation_pack
    - handoff_to_rumi_browser_element_pack
    - handoff_to_rumi_default_tools_pack
    - handoff_to_defaultspack
    - handoff_to_rumi_browser_form_operator_pack
    produces: selector_drift_audit_handoff_packet
  - id: failed_flow_replay_manifest
    execution: declarative_only
    description: Contract workflow for failed flow replay manifest.
    handoffs:
    - handoff_to_rumi_browser_automation_pack
    - handoff_to_rumi_browser_element_pack
    - handoff_to_rumi_default_tools_pack
    - handoff_to_defaultspack
    - handoff_to_rumi_browser_form_operator_pack
    produces: failed_flow_replay_manifest_handoff_packet
  - id: handoff_to_browser_owner
    execution: declarative_only
    description: Contract workflow for handoff to browser owner.
    handoffs:
    - handoff_to_rumi_browser_automation_pack
    - handoff_to_rumi_browser_element_pack
    - handoff_to_rumi_default_tools_pack
    - handoff_to_defaultspack
    - handoff_to_rumi_browser_form_operator_pack
    produces: handoff_to_browser_owner_handoff_packet
