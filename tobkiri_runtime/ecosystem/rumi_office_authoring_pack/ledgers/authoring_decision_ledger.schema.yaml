evidence_ledger_schema:
  pack_id: rumi_office_authoring_pack
  fields:
  - ledger_id
  - entry_id
  - evidence_ref
  - review_state
  - handoff_owner
  - created_at
  completion_rules:
    external_actions_are_handoffs: true
    render_and_file_outputs_are_manifest_handoffs: true
    verified_export_requires_complete_review_gate: true
    missing_citations_block_verified_export: true
    unresolved_formula_dependencies_block_verified_export: true
    minimum_pass: all_blocking_checks
