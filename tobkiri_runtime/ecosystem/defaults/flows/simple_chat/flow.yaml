flow_id: simple_chat
name: "Simple Chat"
description: "シンプルなチャットフロー（ツール使用なし）"
version: "1.0.0"
trigger:
  type: user_input
  config:
    require_conversation: true
handler: handler.py
config_schema:
  model:
    type: string
    default: "stub/default"
  system_prompt_id:
    type: string
    default: null
metadata:
  author: "defaults"
  tags: ["chat", "default"]
