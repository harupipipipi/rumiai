flow_id: planning_agent
name: "Planning Agent"
description: "タスク分解→承認→順次実行を行うフロー"
version: "1.0.0"
trigger:
  type: user_input
  config:
    require_conversation: true
handler: handler.py
config_schema:
  agent_id:
    type: string
    default: "default_agent"
  planning_model:
    type: string
    default: "stub/default"
metadata:
  author: "defaults"
  tags: ["agent", "planning"]
