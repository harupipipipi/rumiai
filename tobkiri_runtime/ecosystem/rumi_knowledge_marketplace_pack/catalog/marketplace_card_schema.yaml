schema_id: rumi_knowledge_marketplace.card
version: 2
required_fields:
  - card_id
  - capability_type
  - source
  - publisher
  - trust_status
  - permission_summary
  - provenance
  - install_review
optional_fields:
  - display_name
  - summary
  - tags
  - provides
  - requirements
  - model_policy
  - extension_contract
  - listing
capability_types: [skill, tool, mcp_tool, mcp_server, template, playbook, connector_card, extension, pack_bundle]
requirement_schema: schemas/marketplace_requirement.schema.json
model_tier_catalog: catalog/model_tiers.yaml
trust_statuses: [unreviewed, repository_reviewed, trusted, blocked]
permission_summary_fields:
  - required_permissions
  - network_requirement
  - secret_requirement
  - host_execution_requirement
install_review_decisions:
  - allow_install
  - allow_with_warning
  - needs_security_review
  - block_install
provenance_fields:
  - source_ref
  - content_digest
  - publisher
  - reviewer
  - reviewed_at
