schema: io.tobkiri.profile.v4
profile_id: defaults-modern-cli
profile_revision: 4.0.0-local
kind: runtime_profile
locale: en

display_name:
  en: Tobkiri Defaults Modern (CLI)
  ja: Tobkiri Defaults Modern（CLI）

description:
  en: Local-first defaultspack composition with a structured stdio CLI Shell.
  ja: 構造化 stdio CLI Shell を選ぶローカル優先の defaultspack 構成。

base:
  pack: defaults-basepack

shell:
  contract: app.shell.v1
  provider: shell.cli.default

packs:
  - defaultspack

platform:
  os: macos
  architecture: arm64

local_first:
  default_model: stub/default
  cloud_keys_required: false
  required_secrets: []
  required_network: []

policy:
  network_default: deny
  write_actions_require_approval: true
  terminal_actions_require_approval: true
  git_push_requires_approval: true
  audit_level: strict
  profile_may_mint_host_authority: false

cli:
  protocol: cli.io.v1
  raw_host_terminal: false
  output_limit: 1048576
  cancellation: authenticated_control_frame

materialization:
  mode: selected_only
  unselected_contributions: remain_unmaterialized
  gui_routes: forbidden
  webviews: forbidden
  window_lifecycle: forbidden
  production_source_build: false
  production_dev_commands: forbidden

metadata:
  pack_id: defaults-basepack
  category: modern_defaults
  shell_selection_is_exact: true
