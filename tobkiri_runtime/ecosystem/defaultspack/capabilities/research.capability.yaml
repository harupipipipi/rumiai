id: research
name: Research Agent
description: Local source collection, claim extraction, comparison, citation, and optional web providers.
local_only: partial
requires_network: optional
risk_level: medium
permissions: [research.local.read, research.source.write, research.web.optional]
handlers:
  - blocks.research.local_search
  - blocks.research.report
operations: [local_search, source_collect, claim_extract, compare, summarize, cite]
optional_providers: [web_search, reddit, browser]
