<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumi AI - セットアップ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 2rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
        header p { color: #888; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .card h2 { font-size: 1.1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .card p { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        .btn {
            background: #4a90d9;
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            margin-right: 0.5rem;
        }
        .btn:hover { background: #5a9fe9; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        .btn-success { background: #4ad97b; }
        .btn-success:hover { background: #5ae98b; }
        .btn-warn { background: #d97b4a; }
        .btn-warn:hover { background: #e98b5a; }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; }
        .checkbox-group label { color: #ccc; font-size: 0.9rem; }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: none;
        }
        .status.active { display: block; }
        .progress-bar { height: 4px; background: #333; border-radius: 2px; margin: 0.5rem 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: #4a90d9; transition: width 0.3s; }
        .logs { max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; }
        .log-entry { padding: 0.2rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .log-entry.success { color: #6fbf73; }
        .log-entry.error { color: #f44336; }
        .log-entry.warn { color: #ffb74d; }
        .log-entry.info { color: #64b5f6; }
        .check-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
        .check-item .icon { font-size: 1.1rem; }
        .check-item.ok .icon { color: #6fbf73; }
        .check-item.warn .icon { color: #ffb74d; }
        .check-item.error .icon { color: #f44336; }
        .run-command {
            background: #2d2d44;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            margin-top: 1rem;
            word-break: break-all;
        }
        .run-command code { color: #6fbf73; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌸 Rumi AI</h1>
            <p>セットアップウィザード</p>
        </header>
        
        <div class="card">
            <h2>🔍 環境チェック</h2>
            <p>Python, pip, Git, Docker の確認</p>
            <button class="btn" onclick="runCheck()">チェック実行</button>
            <div id="check-status" class="status">
                <div class="progress-bar"><div class="progress-bar-fill" id="check-progress"></div></div>
                <div id="check-results"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>📦 初期セットアップ</h2>
            <p>user_data と設定ファイルを作成</p>
            <div class="checkbox-group">
                <input type="checkbox" id="install-default" checked>
                <label for="install-default">setup pack target を準備</label>
            </div>
            <button class="btn" onclick="runInit()">セットアップ開始</button>
            <div id="init-status" class="status">
                <div class="progress-bar"><div class="progress-bar-fill" id="init-progress"></div></div>
                <div class="logs" id="init-logs"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>🩺 診断</h2>
            <p>システムの問題を検出</p>
            <button class="btn" onclick="runDoctor()">診断実行</button>
            <div id="doctor-status" class="status">
                <div class="progress-bar"><div class="progress-bar-fill" id="doctor-progress"></div></div>
                <div class="logs" id="doctor-logs"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>🔧 リカバリー</h2>
            <p>壊れた設定を自動修復</p>
            <button class="btn btn-warn" onclick="runRecover()">リカバリー実行</button>
            <div id="recover-status" class="status">
                <div class="progress-bar"><div class="progress-bar-fill" id="recover-progress"></div></div>
                <div class="logs" id="recover-logs"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>🚀 アプリケーション起動</h2>
            <p>Rumi AI を起動します</p>
            <button class="btn btn-success" onclick="showRunCommand()">起動コマンドを表示</button>
            <div id="run-status" class="status">
                <p>セットアップツールを終了してから、以下のコマンドを実行してください：</p>
                <div class="run-command"><code id="run-command-text">Loading...</code></div>
                <p style="margin-top: 1rem; color: #888; font-size: 0.85rem;">
                    ※ セットアップツールと Rumi AI は同時に実行できません。<br>
                    Ctrl+C でこのツールを終了してから、上記コマンドを実行してください。
                </p>
            </div>
        </div>
    </div>
    
    <script>
        let pollInterval = null;
        
        async function runCheck() {
            document.getElementById('check-status').classList.add('active');
            document.getElementById('check-results').innerHTML = '';
            await fetch('/api/check', { method: 'POST' });
            startPolling('check', renderCheckResults);
        }
        
        async function runInit() {
            document.getElementById('init-status').classList.add('active');
            document.getElementById('init-logs').innerHTML = '';
            const installDefault = document.getElementById('install-default').checked;
            await fetch('/api/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ install_default: installDefault })
            });
            startPolling('init', renderLogs);
        }
        
        async function runDoctor() {
            document.getElementById('doctor-status').classList.add('active');
            document.getElementById('doctor-logs').innerHTML = '';
            await fetch('/api/doctor', { method: 'POST' });
            startPolling('doctor', renderLogs);
        }
        
        async function runRecover() {
            if (!confirm('リカバリーを実行しますか？')) return;
            document.getElementById('recover-status').classList.add('active');
            document.getElementById('recover-logs').innerHTML = '';
            await fetch('/api/recover', { method: 'POST' });
            startPolling('recover', renderLogs);
        }
        
        async function showRunCommand() {
            document.getElementById('run-status').classList.add('active');
            const res = await fetch('/api/run/command');
            const data = await res.json();
            document.getElementById('run-command-text').textContent = data.command;
        }
        
        function startPolling(action, renderFn) {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                const res = await fetch('/api/status');
                const data = await res.json();
                const progressEl = document.getElementById(`${action}-progress`);
                if (progressEl) progressEl.style.width = `${data.progress}%`;
                renderFn(action, data);
                if (data.status === 'completed' || data.status === 'failed') {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
            }, 500);
        }
        
        function renderCheckResults(action, data) {
            if (!data.result || !data.result.checks) { renderLogs(action, data); return; }
            const container = document.getElementById('check-results');
            container.innerHTML = data.result.checks.map(check => {
                const status = check.available ? 'ok' : (check.required ? 'error' : 'warn');
                const icon = check.available ? '✓' : (check.required ? '✗' : '⚠');
                const version = check.version ? ` (${check.version})` : '';
                const req = check.required ? '' : ' [推奨]';
                return `<div class="check-item ${status}"><span class="icon">${icon}</span><span>${check.name}${version}${req}</span></div>`;
            }).join('');
        }
        
        function renderLogs(action, data) {
            const container = document.getElementById(`${action}-logs`);
            if (!container) return;
            container.innerHTML = data.logs.map(log => 
                `<div class="log-entry ${log.level}">[${log.timestamp}] ${log.message}</div>`
            ).join('');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
