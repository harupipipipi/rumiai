# cargo-packager configuration for Rumi AI Launcher
# Ref: https://docs.crabnebula.dev/packager/configuration
#
# Run:  cd rumi_launcher && cargo packager --release

productName = "Rumi AI"
version = "0.1.0"
identifier = "dev.rumiai.app"
description = "Rumi AI OS — Pack-based modular AI operating system"
authors = ["harupipipipi"]
homepage = "https://github.com/harupipipipi/rumiai"
category = "Productivity"

outDir = "./dist"
binariesDir = "./target/release"
beforePackagingCommand = "cargo build --release"

icons = ["assets/icon.png"]

# ── Binary ──────────────────────────────────────────────────────────────────
[[binaries]]
path = "rumi-launcher"
main = true

# ── Resources ───────────────────────────────────────────────────────────────
# Python source tree + built frontend
[[resources]]
src = "../rumi_ai_1_10"
target = "app"

# uv binary (placed by CI or manually into ./bundled/)
[[resources]]
src = "./bundled"
target = "bundled"

# ── macOS ───────────────────────────────────────────────────────────────────
[macos]
backgroundApp = true
exceptionDomain = "localhost"
minimumSystemVersion = "11.0"

# ── Windows NSIS ────────────────────────────────────────────────────────────
[nsis]
installMode = "currentUser"
