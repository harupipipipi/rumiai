name: rumi_remote_app
description: Mobile remote client for PC-hosted Rumi defaultspack.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true
